name: ci
# dist/ is committed: the plugin and github: installs run it. This job fails when it is stale.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ matches src/
        run: |
          git diff --exit-code -- dist || { echo "::error::dist/ is stale. Run npm run build, then commit dist/."; exit 1; }
