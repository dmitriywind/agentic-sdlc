name: ci
# dist/ is committed: the plugin and github: installs run it. This job fails when it is stale.
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ matches src/
        run: |
          # The build ran in the tests above; a changed or untracked file means the committed copy is stale.
          [ -z "$(git status --porcelain -- dist docs/guide.html)" ] || { git status --porcelain -- dist docs/guide.html; echo "::error::dist/ or docs/guide.html is stale. Run npm run build, then commit them."; exit 1; }
      - name: plugin.json version equals package.json version
        run: node -e "const a=require('./.claude-plugin/plugin.json').version,b=require('./package.json').version;if(a!==b){console.error('::error::plugin.json '+a+' != package.json '+b);process.exit(1)}"
