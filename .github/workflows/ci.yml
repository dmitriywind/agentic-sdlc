name: ci
# dist/ is committed: the plugin and github: installs run it. This job fails when it, the guide or the hash list is stale.
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ matches src/
        run: |
          # The build ran in the tests above; a changed or untracked file means the committed copy is stale.
          [ -z "$(git status --porcelain -- dist docs/guide.html templates/known-hashes.json)" ] || { git status --porcelain -- dist docs/guide.html templates/known-hashes.json; echo "::error::dist/, docs/guide.html or templates/known-hashes.json is stale. Run npm run build, then commit them."; exit 1; }
      - name: plugin manifests version equals package.json version
        run: node -e "const b=require('./package.json').version;for(const f of ['.claude-plugin']){const a=require('./'+f+'/plugin.json').version;if(a!==b){console.error('::error::'+f+'/plugin.json '+a+' != package.json '+b);process.exit(1)}}"
