<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs';

/* ---------- Component contract ----------
   Each file in scripts/guide/components/ adds one or more entries to VIZ: VIZ.<name> = (el) => { ... }.
   A chapter places it with the marker <!-- viz: <name> --> (the next ```mermaid block, if any, is the GitHub fallback and is dropped).
   Shell helpers available to components: $ (querySelector), esc (HTML escape), reduced (prefers-reduced-motion),
   addStyle(id, cssText) (adds a component's CSS once), copyText(text, button) (copy with a select fallback).
   Components style only with the tokens and shared classes in the stylesheet above, scroll only inside themselves,
   never call scrollIntoView on the page, and work from 360px wide in light and dark. */
const VIZ = {};
const GUIDE = {"chapters":[{"id":"1-what-it-is","n":1,"file":"docs/guide/1-what-it-is.md","title":"1. What it is","short":"What it is","group":"Understand","lead":"agentic-sdlc runs software delivery with agents. You put work on a board. Every hour, a scheduled agent run (the cycle) moves each ticket one step: it shapes the ticket, builds it, reviews it and merges it. CI checks decide what may merge, and no agent can skip them. You act when a rule says a person must decide. Together, the skills, your settings, the CLI and the CI checks are the factory.","md":"# 1. What it is\n<!-- group: Understand -->\n\nagentic-sdlc runs software delivery with agents. You put work on a board. Every hour, a scheduled\nagent run (the **cycle**) moves each ticket one step: it shapes the ticket, builds it, reviews it\nand merges it. CI checks decide what may merge, and no agent can skip them. You act when a rule\nsays a person must decide. Together, the skills, your settings, the CLI and the CI checks are the\n**factory**.\n\n```mermaid\nflowchart TB\n  you([\"You\"]):::you -->|\"ideas, priorities,<br/>answers\"| board[(\"Board\")]:::board\n  board --> cycle[\"Cycle:<br/>agents\"]:::agent\n  cycle -->|\"pull request\"| gates[\"CI checks\"]:::ci\n  gates -->|\"merge\"| main[(\"main branch\")]:::board\n  gates -.->|\"ticket Done\"| board\n  cycle -.->|\"asks\"| you\n```\n\n## What it guarantees\n\n| Guarantee | How |\n|---|---|\n| No change merges without its checks | Six required CI checks decide every merge. The checks read their rules from the main branch, never from the change. |\n| The code that is reviewed is the code that is tested | CI runs the tests with no secrets; the review reads the result and never runs the change's code. |\n| You are asked, not bypassed | A rule makes a skill stop and ask you: a product ruling, security, money, something that cannot be undone. |\n| Every run leaves a record | Each cycle writes a heartbeat: what ran, on which model, what failed. |\n\n## Is it for you\n\n<div class=\"callout ok\">\n\n**A good fit:** a product on GitHub with tests in CI, work you can write as tickets, and an agent\nsubscription (Claude, Codex or Cursor) or API keys.\n\n<\/div>\n\n<div class=\"callout warn\">\n\n**Not a fit yet:** a forge other than GitHub; a team that cannot let agents open pull requests; work\nwith no automated checks. It is early (0.1): interfaces may still change before 1.0.\n\n<\/div>\n\nYou need: a GitHub repo with CI, a board (GitHub issues, a GitHub Project, Jira or Linear), an agent\n(Claude Code, Codex, Cursor or another with a shell), and a place to run the cycle (an agent\nvendor's cloud, GitHub Actions or your own machine).\n\nNext: [2. A ticket's journey](#2-a-ticket).\n"},{"id":"2-a-ticket","n":2,"file":"docs/guide/2-a-ticket.md","title":"2. A ticket's journey","short":"A ticket's journey","group":"Understand","lead":"Follow one ticket from a request to production. Pick a scenario, then press Next or use the arrow keys. Each step shows who acts, what happens, and what you would see.","md":"# 2. A ticket's journey\n<!-- group: Understand -->\n\nFollow one ticket from a request to production. Pick a scenario, then press **Next** or use the\narrow keys. Each step shows who acts, what happens, and what you would see.\n\n<!-- viz: journey -->\n```mermaid\nflowchart LR\n  sig[\"Signals\"]:::board -->|\"triage-signal\"| bl[\"Backlog\"]:::board\n  bl -->|\"shape\"| rd[\"Ready\"]:::board\n  rd -->|\"implement-spec\"| ip[\"In progress\"]:::board\n  ip -->|\"draft pull request\"| ir[\"In review\"]:::board\n  ir -->|\"review-pr + checks\"| dn[\"Done\"]:::ci\n```\n\n## Every status\n\n| Status | What happens | Who acts | What you see |\n|---|---|---|---|\n| Ideas | A thought you park. Skills never touch it. | You | Your note. |\n| Signals | Raw input: an alert, feedback, a red CI run, a scanner finding. | `triage-signal` | A decision comment: accepted, parked or rejected, with the reason. |\n| Backlog | Accepted work. It gets a Priority; duplicates are merged. | `backlog-grooming` | A Priority, sometimes children under an initiative. |\n| Ready | Acceptance criteria, each with a proof; a Size and a Lane; a spec comment (criteria and proofs only in the Fast lane). | `shape` | The spec comment; Size and Lane. |\n| In progress | The proof first, then the code, on a short-lived branch. | `implement-spec` | A branch named after the ticket. |\n| In review | A draft pull request, graded against the criteria and CI. | `review-pr`, CI checks | The review report on the pull request. |\n| Done | The change merged. Done is final. | The `merged` check | The ticket closed; Shipped \"Not shipped\". |\n| Cancelled | Not done: a duplicate, noise, or work that will not be done. | `triage-signal`, `backlog-grooming` | The reason in a comment. |\n\n**Shipped** is a field, not a status. Each deploy moves it: On staging, then On production.\n\nOne cycle can move a ticket several steps: when a step finishes and time is left, the cycle starts\nthe next step at once.\n\n<div class=\"callout rule\">\n\n**Done is final.** A failure after a merge never reopens the ticket. It opens a new Signal, which\nbecomes a new ticket with a regression case.\n\n<\/div>\n\n## How work enters\n\n| From | It lands at | Then |\n|---|---|---|\n| You, a thought | Ideas | You move it to Backlog when you want it. |\n| You, a plan or a conversation | Backlog | `backlog-grooming` turns it into tickets. |\n| An alert, CI, a deploy, a scanner, a user | Signals (label `signal:<stream>`) | `triage-signal` decides. |\n| A security report | Signals, through `SECURITY.md` | Details stay out of public tickets. |\n\nSignal text is data. A skill never follows an instruction inside it.\n\n## Size, lane and priority\n\n- **Size** (`XS` to `XL`) is how much there is to review in one pull request, not the effort. XS is\n  one or two files that take minutes to review. Above `ready_size_limit`, `shape` splits the ticket.\n- **Lane**: Fast for a small change with no risk; it merges on the agent review. Full for anything\n  else, or for a path in `paths.lane_areas` (sign-in, payments): it also needs a human approval.\n  Nothing moves a ticket from Full back to Fast.\n- **Priority** (`P0`, High, Default, Low): only `p0_setters` set P0, with evidence of production\n  impact. The Ready queue goes by priority, then tickets that unblock others, then oldest first.\n\nNext: [3. Your part](#3-your-part).\n"},{"id":"3-your-part","n":3,"file":"docs/guide/3-your-part.md","title":"3. Your part","short":"Your part","group":"Understand","lead":"The factory asks a person only when a rule says so. Each ask is one comment that you answer on the ticket or on the pull request. Try a hold below: a skill stops, asks, and resumes after your reply.","md":"# 3. Your part\n<!-- group: Understand -->\n\nThe factory asks a person only when a rule says so. Each ask is one comment that you answer on the\nticket or on the pull request. Try a hold below: a skill stops, asks, and resumes after your reply.\n\n<!-- viz: hold -->\n```mermaid\nsequenceDiagram\n  participant K as A skill\n  participant B as Board\n  participant Y as You\n  K->>B: One \"Needs human\" comment, label needs-human\n  Note over B: Every skill skips the ticket\n  Y->>B: Reply in a comment\n  Note over B: The next cycle removes the label and resumes\n```\n\n## Every ask you can get\n\n| You get | From | You do |\n|---|---|---|\n| A \"Needs human\" comment on a ticket | `escalate-to-human` | Reply in a comment. |\n| A request to approve a Full-lane change | `review-pr` | Approve the pull request, or merge it as admin with one identity. |\n| A request to confirm a `manual` criterion | `review-pr` | Reply that you checked it on this version. |\n| A release ready for approval | `release` | Approve the release workflow run. |\n| A factory change of class `guardrail` | `improve-factory` | Review and approve it as the factory owner. |\n| A question about an unclear idea | `backlog-grooming` | Answer it, or leave the ticket in Ideas. |\n\n## Who you are\n\n| Role | Setting | Acts through |\n|---|---|---|\n| Product owner | `owners.product` | Ideas, Priority and P0, answers to holds, Full-lane and release approvals. |\n| Factory owner | `owners.factory` | The settings, the skills and the checks; approves `guardrail` factory changes. |\n| The factory | `owners.bots` | The cycle and the review run. Only these accounts' heartbeats count. |\n| Operator, security, compliance | `owners.operator`, `owners.security`, `owners.compliance` | Optional. Deploy and incident asks, security findings, release evidence gaps. With no such role, the ask goes to the product or factory owner. |\n\nEach owner setting takes one account or a list. Any account in the list counts as the owner: any factory owner's approval passes a `guardrail` change, and a reply from any of them settles a hold. The first account is the primary, the one an ask is addressed to.\n| Anyone else | | A pull request like any other, through the same checks. A Signal or `SECURITY.md` to report. |\n\n## A week with it\n\n<div class=\"callout\">\n\n**Product owner**\n- Put ideas in Ideas; move the ones you want to Backlog.\n- Answer holds: filter the board on the `needs-human` label.\n- Approve Full-lane pull requests and releases.\n- Set P0 only with evidence of production impact.\n\n<\/div>\n\n<div class=\"callout\">\n\n**Factory owner**\n- Read the heartbeats; act when `errors` repeat.\n- Watch the dead-man check (`ledger stale`): it fails when no cycle ran in time.\n- Review `guardrail` factory changes from the learning loop.\n- Upgrade one repo at a time ([9. Run it](#9-run-it)).\n\n<\/div>\n\nNext: [4. The cycle](#4-the-cycle).\n"},{"id":"4-the-cycle","n":4,"file":"docs/guide/4-the-cycle.md","title":"4. The cycle","short":"The cycle","group":"Understand","lead":"A scheduler starts one cycle at a time, for example every hour. The cycle is one agent session that loads the sdlc skill: it decides the order of work, subagents do the work, and it writes a heartbeat at the end. Step through one cycle below, and try the cases that stop or change it.","md":"# 4. The cycle\n<!-- group: Understand -->\n\nA scheduler starts one cycle at a time, for example every hour. The cycle is one agent session that\nloads the `sdlc` skill: it decides the order of work, subagents do the work, and it writes a\nheartbeat at the end. Step through one cycle below, and try the cases that stop or change it.\n\n<!-- viz: cycle -->\n```mermaid\nflowchart LR\n  c1[\"1. Claim\"]:::agent --> c2[\"2. Read state\"]:::agent --> c3[\"3. Triage\"]:::agent\n  c3 --> c4[\"4. Route\"]:::agent --> c5[\"5. Chain\"]:::agent --> c6[\"6. Heartbeat\"]:::board\n```\n\nThe routing order and every rule of the cycle are in [`skills/sdlc/SKILL.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/skills/sdlc/SKILL.md).\n\n## Rules that keep it safe\n\n| Rule | Why |\n|---|---|\n| One cycle at a time; a second start stops at Claim. | Two cycles never claim the same ticket. |\n| A second start of the same step is skipped inside `cycle.dedupe_minutes`, and while the first run has not finished until `stall_minutes`. | A scheduler that fires twice does no harm; keep `stall_minutes` above your longest stage run. |\n| Each cycle removes the hold from a ticket whose owner has replied. | An owner who only comments is never stuck. |\n| Nothing new starts after `cycle.time_budget_minutes`. | The heartbeat is always written before the job times out. |\n| A stage may carry caps (`executors.<stage>.max_turns`, `max_tokens`, `max_minutes`); a run that ends on one is recorded `capped` and treated as a failed run. | A runaway run costs a bounded amount. |\n| A ticket whose runs used more than `cycle.max_tokens_per_ticket` tokens gets no further run and goes to a person. | One ticket cannot spend without limit; `ledger summary` lists tokens per ticket. |\n| A failed step goes into the heartbeat's `errors`; the cycle goes on. | One failure does not stop other work. |\n| A step that failed in the last `cycle.failure_limit` heartbeats on the same main-branch commit is held for a person. | No endless retries; a fix to the factory gives the step a fresh start. |\n\nNext: [5. Review and merge](#5-review-and-merge).\n"},{"id":"5-review-and-merge","n":5,"file":"docs/guide/5-review-and-merge.md","title":"5. Review and merge","short":"Review and merge","group":"Understand","lead":"implement-spec opens a draft pull request. CI and review-pr then decide whether it merges. The review never runs the change's code: CI runs it, with no secrets, and the review reads the result. Switch between one and two identities, and between the Fast and Full lane, to see what changes.","md":"# 5. Review and merge\n<!-- group: Understand -->\n\n`implement-spec` opens a **draft** pull request. CI and `review-pr` then decide whether it merges.\nThe review never runs the change's code: CI runs it, with no secrets, and the review reads the\nresult. Switch between one and two identities, and between the Fast and Full lane, to see what changes.\n\n<!-- viz: review -->\n```mermaid\nsequenceDiagram\n  participant I as implement-spec\n  participant CI as CI checks\n  participant R as review-pr\n  participant G as GitHub\n  I->>G: Draft pull request\n  G->>CI: Tests and checks\n  R->>G: Review report (Verdict PASS)\n  CI-->>G: review = success\n  R->>G: Ready, merge when all checks are green\n```\n\n## The six required checks\n\n| Check | Passes when |\n|---|---|\n| `Required` | `commands.install` and `commands.verify` pass on the change, in a job with no secrets. |\n| `proofs-on-base` | Every new or changed proof fails on the old code, so it proves the change. |\n| `ticket-linkage` | The pull request closes exactly one open ticket, named in its branch. |\n| `review` | The review verdict is PASS. |\n| `human-approval` | The approvals its class needs are on the latest commit (below). |\n| `skill-regression` | A factory change keeps the skill pack valid. A product change passes it. |\n\n## Who made each commit\n\nA seventh check, `agent-provenance`, is off until you set `forge.provenance`. When it is on, every commit an agent makes ends with `Agent-Run` and `Agent-Model` trailers, and the pull request body lists the run ids. The check reads the commits of the pull request and lists each as agent or human. A merge made by the forge's own account, such as a branch update, is listed as a merge. A merge commit by anyone else is checked like any other commit. With `warn` it only reports. With `require` it fails when an agent commit has no trailers, and you add it to the required checks yourself. A squash merge keeps one commit, so the check's report on the pull request is the record. [docs/forges.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md) maps the checks to the SLSA Source track.\n\n## Who must approve\n\n| Class | Is | Needs |\n|---|---|---|\n| `product-fast` | A product change in the Fast lane. | Nothing more. |\n| `product-full` | A product change in the Full lane, or one that touches `paths.lane_areas`. | A human approval (`forge.human_approval`). |\n| `tuning` | A factory change to the model map or a benched skill's tier. | Nothing, when `learning.auto_merge_classes` lists it; else the factory owner. |\n| `guardrail` | Any other factory change. | The factory owner. |\n\n## When review says no\n\n| Finding | Where it goes |\n|---|---|\n| A criterion not met, a bug, a security issue | The ticket goes back to In progress with the findings, until `cycle.max_rework` reports have asked for it; then a person is asked. |\n| The spec or scope is wrong | The pull request goes back to draft; the ticket goes to Backlog. |\n| A pull request a person opened | Back to draft with the report; that person fixes it. |\n| A red check | Back to draft. A cause in the code goes to In progress; a cause elsewhere becomes a Signal. |\n| It is behind the main branch | It is brought up to date and reviewed again. |\n\nGitHub setup (rulesets, tokens, private repos on GitHub Free) is in [forges.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md).\n\nNext: [6. Shipping](#6-shipping).\n"},{"id":"6-shipping","n":6,"file":"docs/guide/6-shipping.md","title":"6. Shipping","short":"Shipping","group":"Understand","lead":"A merge makes the ticket Done and \"Not shipped\". Your deploy jobs then report each environment to the shipped check, which moves the ticket's Shipped field. product.delivery picks one of two ways. Merge, deploy, and make a deploy fail below.","md":"# 6. Shipping\n<!-- group: Understand -->\n\nA merge makes the ticket Done and \"Not shipped\". Your deploy jobs then report each environment to\nthe `shipped` check, which moves the ticket's **Shipped** field. `product.delivery` picks one of two\nways. Merge, deploy, and make a deploy fail below.\n\n<!-- viz: ship -->\n```mermaid\nflowchart LR\n  m[\"Merge\"]:::ci --> s[\"On staging\"]:::board --> p[\"On production\"]:::board\n```\n\n| | Continuous | Release line |\n|---|---|---|\n| What ships | Every merge, environment by environment. | What the Product owner approves, cut as a release line. |\n| Who starts a release | Nobody: each deploy reports itself. | You open a release request (a Backlog ticket with the `release` label); a P0 fix opens one by itself. |\n| The last environment | Deploys from the main branch. | Deploys from the release line, after your approval. Agents never approve it. |\n| Evidence | | With `product.evidence`, the release is ready only when `commands.evidence_check` passes. |\n\n## When a deploy fails\n\n- The tickets in that deploy go back to the last good environment, and one Signal opens with the\n  evidence. A failure in the last environment also puts a hold on the Signal.\n- A rollback reports `--result rolled-back`: tickets not in the running version step back.\n- A failed release line is left as it is. The fix ships under the next version.\n- If the delivery workflow itself fails, start it by hand with the commit's sha: it runs the\n  `merged` check again.\n\nNext: [7. Choose your setup](#7-choose).\n"},{"id":"7-choose","n":7,"file":"docs/guide/7-choose.md","title":"7. Choose your setup","short":"Choose your setup","group":"Adopt","lead":"Answer the questions below. The chooser writes your init command, the settings for .agents/binding.yml and the scheduler template, and warns you about combinations that do not work. You can change every answer later.","md":"# 7. Choose your setup\n<!-- group: Adopt -->\n\nAnswer the questions below. The chooser writes your `init` command, the settings for\n`.agents/binding.yml` and the scheduler template, and warns you about combinations that do not work.\nYou can change every answer later.\n\n<!-- viz: setup -->\n\n<details>\n<summary>Compare the profiles<\/summary>\n\n| `profile` | Pick it when | Agents run on | Identities |\n|---|---|---|---|\n| `individual` | One person or a small team on agent subscriptions. | Subscriptions only. No API key. | One (default) |\n| `individual-api` | As individual, plus some stages on managed agents or bots. | Subscriptions, plus API keys for those stages. | One (default), or two |\n| `organization` | A team that pays per use and wants runs owned by service accounts. | API keys and managed agents. | Two (required) |\n\n<\/details>\n\n<details>\n<summary>Compare one identity and two<\/summary>\n\n| | One identity (default for individual) | Two identities (required for organization) |\n|---|---|---|\n| Accounts | Yours. On a Claude cloud routine, the routine's GitHub login. | An implementer account and a separate review app. |\n| Who reviews | `review-pr` in the cycle, as a fresh subagent. | `review-pr` in a separate review run that holds the review token. |\n| Review status | CI posts it from the review report. | The review app posts it, and approves. |\n| Full-lane approval | A collaborator approves it, or you merge it as admin. | A human approves the latest commit. |\n| What it proves | The review is a separate agent context. | No implementer can approve its own change. |\n\n<\/details>\n\n<details>\n<summary>Compare where the cycle runs<\/summary>\n\n| Runtime | Pick it when | Limits |\n|---|---|---|\n| Claude cloud routine | No machine of your own; subscription usage. | Board: GitHub issues, Jira or Linear (not a GitHub Project). No Docker: `commands.verify` runs in CI. At most hourly. |\n| Codex or Cursor cloud task | You use Codex or Cursor. | See [docs/ecosystems](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/codex.md). |\n| GitHub Actions | Any board, a GitHub Project included. | A subscription token or an API key in a secret. |\n| Your own machine | Code, tools or a network only your machine reaches. | No sandbox: opt in with `sandbox: local` and `AGENTIC_SDLC_LOCAL=1`. The machine must be on. |\n| Managed agents | `individual-api` or `organization`. | API billing. |\n\n<\/details>\n\n<details>\n<summary>Compare one repo and many<\/summary>\n\n| Setup | Board | Settings |\n|---|---|---|\n| One repo | The repo's issues, or its own Jira project, Linear team or GitHub Project. | Nothing extra. |\n| Many repos, one GitHub Project | One Project. | Each repo sets its own `board.options.repo`. |\n| Many repos, one Jira project, Linear team or hub repo | One shared board. | Each repo sets `board.scope.label: repo:<name>`; one repo sets `home: true` and lists every label in `repos`. |\n\n<\/details>\n\nNext: [8. Install](#8-install).\n"},{"id":"8-install","n":8,"file":"docs/guide/8-install.md","title":"8. Install","short":"Install","group":"Adopt","lead":"Try it first in five minutes with no accounts. Then install it on a real repo.","md":"# 8. Install\n<!-- group: Adopt -->\n\nTry it first in five minutes with no accounts. Then install it on a real repo.\n\n## Try it in five minutes\n\nThe `local` board is a file, `.agents/board.json`. No board account and no forge are needed.\n\n```bash\nmkdir try-agentic && cd try-agentic && git init -b main && npm init -y\nnpm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v0.1.0\nnpx --no agentic-sdlc init --board local --forge github --harness generic\nprintf 'Show a greeting on the home page.\\n' > body.md\nnpx --no agentic-sdlc board create --title \"Greeting\" --body-file body.md --status Backlog\nnpx --no agentic-sdlc dispatch shape --ticket 2\n```\n\n`dispatch` prints the instruction your agent would follow and starts nothing. Open the folder in your\nagent and ask it to run the `sdlc` skill for one cycle. `doctor` also probes Git and GitHub, so it needs a\nfirst commit and a GitHub remote: run it on a real repo.\n\n<div class=\"callout warn\">\n\nThe CLI installs from Git only. The npm package named `agentic-sdlc` is a different project: do not\ninstall it.\n\n<\/div>\n\n## Install on a real repo\n\n1. **Install the CLI**, pinned to a tag:\n   `npm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v0.1.0`\n2. **Run `init`** with the command from [7. Choose your setup](#7-choose). It lists every file it writes.\n3. **Fill in `.agents/binding.yml`**. The file documents every key. Set at least the owners, the board\n   options (`init` reads the repo from `git remote origin`), `commands.*`, `product.environments`,\n   `product.delivery` and `models`. `npx --no agentic-sdlc validate` names every key still missing.\n   The Claude Code plugin also brings a subagent per tier, a `sdlc-reviewer` that can only read files and\n   run `agentic-sdlc` commands, and `agentic-sdlc` itself on the Bash path. Codex and Cursor can install\n   the package as a plugin for the skills and the MCP server.\n4. **Write the two docs** the skills judge every ticket against: `paths.importance_doc` (what\n   matters) and `paths.guiding_narrative` (where the product goes). Without them, product questions\n   become holds.\n5. **Run `npx --no agentic-sdlc doctor`** until every port is ok. Import `.github/rulesets/trunk.json`\n   in the repo settings. A private repo on GitHub Free cannot enforce a ruleset; `doctor` warns.\n6. **Create the heartbeat ticket** and put its id in `heartbeat.ticket`. Keep it off every route: on\n   `github-issues`, an issue with no `status:` label is off the board, and comments still work; on the\n   local board, status Cancelled (`init` does this); on other boards, a Cancelled status.\n7. **Run one cycle by hand** with two or three real tickets in Backlog. Read every comment it writes.\n   Repeat until three cycles in a row need no correction.\n8. **Schedule the cycle** from [`templates/runner/`](https://github.com/dmitriywind/agentic-sdlc/blob/master/templates/runner/routine.md), and the\n   dead-man check (`agentic-sdlc ledger stale --max-hours <h>`). On GitHub, set the repo variables\n   `AGENTIC_SDLC_VERSION` (an exact version or a commit SHA; a SHA cannot move) and, for the runner\n   workflows, `AGENTIC_AGENT_CLI_VERSION`; the workflows fail when one is unset\n   ([GitHub forges](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md)).\n\n<div class=\"callout ok\">\n\n**Done when** a scheduled cycle writes a heartbeat with no `errors`, and a pull request merges\nthrough the checks.\n\n<\/div>\n\n## Claude Code plugin\n\nFor Claude Code, the skills, the guard hook and the MCP server ship as a plugin, named\n`/agentic-sdlc:<skill>`:\n\n```text\n/plugin marketplace add dmitriywind/agentic-sdlc\n/plugin install agentic-sdlc@agentic-sdlc\n```\n\nA scheduled run loads the repo's pinned copy instead: `claude --plugin-dir ./node_modules/agentic-sdlc`.\nA Claude cloud routine loads `.claude/skills/`: install with `init --no-plugin`.\n\nNext: [9. Run it](#9-run-it).\n"},{"id":"9-run-it","n":9,"file":"docs/guide/9-run-it.md","title":"9. Run it","short":"Run it","group":"Operate","lead":"What you do after the first cycle: watch it, upgrade it, and keep the repo and the board healthy.","md":"# 9. Run it\n<!-- group: Operate -->\n\nWhat you do after the first cycle: watch it, upgrade it, and keep the repo and the board healthy.\n\n## Watch it\n\n```bash\nnpx --no agentic-sdlc ledger summary\nnpx --no agentic-sdlc ledger stale --max-hours 3\n```\n\n`ledger summary` reads the heartbeats: runs, outcomes and failures by cluster. `ledger stale` fails\nwhen no heartbeat arrived in time; schedule it where a failure alerts you.\n\n`ledger measures` prints deploy frequency, lead time, change failure rate, time to restore and\nrework rate over the last 30 days (`--days <n>`), computed from the board and the forge. A measure\nthe data cannot give is `null` with a reason. Set `product.slo` (`change_failure_rate_max` and\n`window_days`) to give the factory an error budget: when the failure rate passes it, or the window has failures and no shipped change, the cycle starts\nno new feature ticket and works only bugs, Signals and reviews in flight, and the heartbeat says\n`budget: exhausted`.\n\n## Send it to your telemetry\n\nNothing leaves the project unless the binding's `telemetry` block names where. Each key names an\nenvironment variable, never a URL or a token: `otlp_endpoint_env` (an OTLP/HTTP base URL),\n`cdevents_sink_env` (a CDEvents sink URL) and `headers_env` (request headers as `name=value,name2=value2`).\n\n```bash\nnpx --no agentic-sdlc ledger export --format otlp --since 7            # print one OTLP/HTTP JSON document\nnpx --no agentic-sdlc ledger export --format otlp --send               # post it to <endpoint>/v1/traces\nnpx --no agentic-sdlc ledger export --format cdevents --out events.jsonl\n```\n\n`--since` takes a number of days or an ISO time; `--run <id>` exports one run. OTLP has one trace\nper heartbeat: an `invoke_workflow` span for the cycle and an `invoke_agent` span per run, with the\nskill as `gen_ai.agent.name`, the model, the outcome as span status and `error.type`, and the ticket,\nCR, tier, executor, tokens and scores as `agentic_sdlc.*` attributes and evaluation events. Ids are\nhashes of the heartbeat and run ids, so exporting twice gives the same document. The GenAI\nconventions are still in `development`, so their names can change; they live in one table in\n`src/telemetry.ts`. With `cdevents_sink_env` set, the `merged` gate posts a `change.merged` event and\nthe `shipped` gate a `service.deployed` or `service.rolledback` event. A failed send writes one line to\nstderr and never fails the gate.\n\nIf the delivery workflow fails on a merge, start it by hand with the commit's sha: it runs the\n`merged` check again and moves the ticket to Done.\n\n## Upgrade\n\n1. Read `git log v<yours>..v<new>` and the contract diff.\n2. Run `npm uninstall agentic-sdlc`, then the `npm i` line with the new tag. npm 12 refuses to change\n   a Git dependency in place (`EALLOWGIT`).\n3. Run `init --upgrade`. `init` records the hash of every file it installs from the package in\n   `.agents/install.lock.json`. A file still at its recorded hash is updated, a file you edited is kept\n   (the line names the package file with the new version), a new file is written, and a file the\n   package dropped is reported as `stale` and left in place. A file with no lock entry, or a lock entry\n   that does not match, counts as edited unless it equals the package's or has the hash of a released\n   version (`templates/known-hashes.json`, built by `npm run hashes`); a kept file's line says it\n   `differs from every released version`. `init` writes the delivery workflow's trunk, release prefix and\n   delivery, and the verify workflow's install and verify commands, from the binding; a workflow that differs from\n   a released version only in those values is updated. A kept pre-push hook keeps its mode. `--force` overwrites your edits to those files. No flag rewrites\n   `.agents/binding.yml`: to regenerate it, delete it. `init` and `validate` list the binding keys the\n   template has and yours lacks. When nothing changed, `init` ends with `install: up to date`, or `install: nothing to update; N kept (differ from every released version)` when it kept files.\n4. Run `npm install`, merge the kept files by hand, then run `validate` and `doctor` and one cycle by hand.\n\nWith many repos, each repo pins its own version: upgrade one at a time.\n\n## Move from a hand-made process\n\n1. List what the old process does that the skills do not. Each item becomes a setting, a doc that\n   `paths.importance_doc` points to, or a gap to report upstream.\n2. Copy the old values into the binding.\n3. Delete the old copies of the skills. A project replaces the binding, never the skills.\n\n## Recommended around the factory\n\nThe factory enforces only its checks and the binding. These help it:\n\n- **Repo:** rulesets as code, secret scanning with push protection, Actions pinned by commit SHA\n  (the installed workflows are; Dependabot's `github-actions` ecosystem keeps them fresh and `doctor` warns on one that is\n  not a SHA) and dependencies pinned, signed release tags, a `SECURITY.md` with a contact.\n- **Board:** limits on In progress and In review, a view of held tickets (`needs-human`), an aging\n  view, a time limit for triaging Signals.\n- **Operations:** service-level objectives beyond the change failure budget, release evidence\n  (`product.evidence`: SBOM, provenance, signatures), blameless postmortems whose actions return to\n  the Backlog.\n\nNext: [10. Learning](#10-learning).\n"},{"id":"10-learning","n":10,"file":"docs/guide/10-learning.md","title":"10. Learning","short":"Learning","group":"Operate","lead":"Optional. Off until you set learning.enabled: true and an agent_command for the bench. The factory then improves its own skills, one proven change at a time.","md":"# 10. Learning\n<!-- group: Operate -->\n\nOptional. Off until you set `learning.enabled: true` and an `agent_command` for the bench. The\nfactory then improves its own skills, one proven change at a time.\n\n```mermaid\nflowchart TB\n  runs[\"Runs<br/>(heartbeats)\"]:::board --> judge[\"judge-run:<br/>grade each run\"]:::agent\n  judge --> prop[\"improve-factory:<br/>one change\"]:::agent\n  prop --> bench[\"Bench: replay<br/>your merged work\"]:::ci\n  bench --> cr[\"Factory pull<br/>request\"]:::ci\n  cr -.->|\"review and checks\"| runs\n```\n\n1. `judge-run` grades each finished run with the scorers in `.agents/scorers/`, on a different model\n   than the run used. Your own grades always win over the judge's. Scorers cover shape quality and\n   triage accuracy as well as the code skills. A judge with missing or unreadable evidence grades\n   `unscorable` and says why; the run is counted as such in `ledger summary` and is no evidence for\n   a failure cluster.\n2. Every `learning.every_cycles` cycles, `improve-factory` finds the worst failure that repeats in at\n   least `learning.min_evidence_runs` runs.\n3. It proposes exactly one change: a skill sentence, a setting, a check or an executor.\n4. The bench replays cases built from your merged work, with the change and without it. The change\n   must not lower the pass rate (`learning.bench_min_cases`, `bench_trials`, a Wilson lower bound). `learning.bench_budget` caps a bench run: a plan over `max_runs` is refused, and after `max_minutes` no new case starts. Skipped cases make the result incomplete, which never counts as a pass.\n5. The change goes through review and the checks like any other. A `guardrail` change needs the\n   factory owner; a `tuning` change (the model map) may merge alone once a bench baseline exists.\n\nThe run rows behind all of this can also go to your own telemetry stack as OpenTelemetry GenAI spans\nand CDEvents; see [Send it to your telemetry](#9-run-it).\n\nNext: [11. The parts](#11-parts).\n"},{"id":"11-parts","n":11,"file":"docs/guide/11-parts.md","title":"11. The parts","short":"The parts","group":"Reference","lead":"How the factory is built. For the exact rules, read the contract, references/architecture.md.","md":"# 11. The parts\n<!-- group: Reference -->\n\nHow the factory is built. For the exact rules, read the contract,\n[`references/architecture.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/references/architecture.md).\n\n## Three layers\n\n| Layer | Where | Holds |\n|---|---|---|\n| Skills | the plugin (Claude, Codex, Cursor) or `.agents/skills/` | The process: every rule. The same for every project. |\n| Binding | `.agents/binding.yml` | Your project's values: board, owners, commands, environments, models. |\n| CLI | `agentic-sdlc` (and its MCP server) | The mechanism: board, forge and Git verbs, the checks, dispatch, the run ledger. The MCP server speaks both protocol eras: a client that opens with `initialize` is served as before (2025-11-25 and earlier), and a client that sends its version in each request's `_meta` (2026-07-28) is served without a handshake. |\n\nA project changes only its binding. A skill never calls a vendor tool: it calls the CLI.\n\nEach CLI verb takes only the flags it lists. An unknown flag, a flag with no value and a `--body-file` that cannot be read stop the verb with a usage error (exit 2). When GitHub answers a read with a rate limit or a server error, the CLI tries again up to three times and waits as long as GitHub asks. A write is tried again only on a rate limit, because a server error may follow a write that went through. Lists are bounded: `forge list` takes `--limit` and `--since`, and returns no check results unless asked with `--checks`.\n\n```mermaid\nflowchart LR\n  sk[\"Skills\"]:::agent --> cli[\"agentic-sdlc CLI<br/>and MCP server\"]:::ci\n  bd[\"Binding\"]:::board --> cli\n  cli --> b[(\"Board\")]:::board\n  cli --> f[(\"GitHub\")]:::board\n  cli --> g[(\"Git\")]:::board\n```\n\n## Eleven skills\n\nSeven run in every project. Four run only when the binding asks for them.\n\n| Stage | Skill | Does | Runs |\n|---|---|---|---|\n| Navigate | `sdlc` | Runs one cycle: routes each ticket to the next skill. | always |\n| Intake | `triage-signal` | Turns one raw signal into Backlog, Ideas or Cancelled. | always |\n| Intake | `backlog-grooming` | Sets Priority, merges duplicates, groups work. | always |\n| Plan | `shape` | Takes a Backlog ticket to Ready: size, criteria with proof, lane, spec. | always |\n| Build | `implement-spec` | Writes the proof first, then the code, then opens a draft pull request. | always |\n| Check | `review-pr` | Reviews the pull request against its ticket and CI, then merges it or sends it back. | always |\n| Check | `verify-ux` | Uses the running change as a user for `computer-use` criteria. Apart from `review-pr` because it runs the change's code. | a criterion names `computer-use` |\n| Ship | `release` | Chooses what ships, sets the version, cuts the release line. | release-line delivery |\n| People | `escalate-to-human` | Decides whether a person must act; holds the ticket with one question. | always |\n| Learn | `judge-run` | Grades each finished run. | `learning.enabled` |\n| Learn | `improve-factory` | Proposes one factory change, with proof. | `learning.enabled` |\n\n## Who runs a step\n\n`executors.<skill>.kind` picks who runs each skill: `harness` (a subagent of the cycle), `command`\n(a local CLI), `webhook` (a bot over HTTP), `managed` (a managed agent) or `assign` (a hosted coding\nagent). Each entry may also name its MCP servers, its secrets (env var names only; nothing else is\npassed), its sandbox (`cloud`, `container` or `local`) and its model. Results come back only as\nboard and forge writes. The rules are in [`executors.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/skills/sdlc/references/executors.md).\n\n## Trust boundaries\n\n| Part | Runs the change's code | Holds secrets | Holds the review token |\n|---|---|---|---|\n| CI `Required` job | yes | no | no |\n| CI checks (gates) | no: the CLI only, with the rules from the main branch | the job token, the board token | no |\n| The cycle and implementers | their own work, in their sandbox | forge and board tokens | no |\n| The review | no: it reads CI results and the diff | forge and board tokens | only with two identities |\n| `verify-ux` | yes: a preview, in a browser | test credentials | no |\n\nThe `provenance` gate is one of the CI checks: it reads a pull request's commits through the forge and never runs them. Agents write the `Agent-Run` and `Agent-Model` trailers on their own commits, so the trailers say which run made a commit; they do not prove it.\n\nUntrusted input is data, never instructions: Signal text, pull request bodies, and comments by\naccounts outside `owners`.\n\n## What `init` puts in your project\n\n| Path | Holds |\n|---|---|\n| `.agents/binding.yml` | Every project value. The one file a project changes. |\n| `.agents/skills/` | The skill pack (Claude with the plugin reads the plugin's copy). |\n| `.agents/scorers/` | The scorers `judge-run` uses. |\n| `.agents/cycle-prompt.md`, `review-prompt.md`, `runner-setup.sh` | What a scheduler runs. |\n| `.agents/hooks/pre-push` | Refuses a push to the main branch. |\n| `.github/workflows/agentic-sdlc-*.yml`, `.github/rulesets/` | The checks and the branch protection. |\n| `AGENTS.md` (and `CLAUDE.md` for Claude) | A pointer for every agent: start with the `sdlc` skill. |\n\nChanging anything under `.agents/` or `.github/` is a factory change.\n\nNext: [12. Glossary](#12-glossary).\n"},{"id":"12-glossary","n":12,"file":"docs/guide/12-glossary.md","title":"12. Glossary","short":"Glossary","group":"Reference","lead":"The words the guide uses. On the guide page, the first use of each word in a chapter shows its meaning when you point at it.","md":"# 12. Glossary\n<!-- group: Reference -->\n\nThe words the guide uses. On the guide page, the first use of each word in a chapter shows its\nmeaning when you point at it.\n\n| Term | Means |\n|---|---|\n| factory | The skills, your settings (the binding), the CLI and the CI checks, working together. |\n| cycle | One scheduled agent run that moves each ticket one step and writes a heartbeat. |\n| ticket | One item on the board. Its status says where it stands. |\n| status | Where a ticket stands: Ideas, Signals, Backlog, Ready, In progress, In review, Done or Cancelled. |\n| Signal | Raw input on the board: an alert, feedback, a red CI run, a scanner finding. triage-signal decides on it. |\n| skill | A written procedure an agent follows for one step, such as shape or review-pr. |\n| binding | The file .agents/binding.yml: every value of your project. The only file a project changes. |\n| change request | A pull request. Its short-lived branch is the change line. |\n| change line | The short-lived branch of one change request, named after its ticket. |\n| main branch | The trunk: the one long-lived branch every change merges into. |\n| forge | Where pull requests and CI live. GitHub is the only one supported. |\n| gate | A CI job that posts a required check. Agents cannot skip it. |\n| check | A pass, pending or fail result on a pull request. Six are required to merge. |\n| lane | Fast (small, low risk: merges on the agent review) or Full (also needs a human approval). |\n| proof | How a criterion is shown done: a test, an eval, a visual check, a data check, computer-use or manual. |\n| hold | The needs-human label: every skill skips the ticket until an owner replies. |\n| heartbeat | One comment per cycle on the heartbeat ticket: what ran, on which model, what failed. |\n| identity | The GitHub account the factory acts as. One identity is yours; two adds a separate review app. |\n| profile | Who pays for the agents: individual, individual-api or organization. |\n| executor | Who runs a skill: a subagent, a local CLI, a bot, a managed agent or a hosted coding agent. |\n| harness | The agent product that runs the cycle: Claude Code, Codex, Cursor or another. |\n| port | One group of CLI verbs the skills use: board, forge or Git. |\n| dispatch | Starting one skill on one ticket through its executor. |\n| Shipped | A ticket field, not a status: where the merged change runs (On staging, On production). |\n"}],"groups":["Understand","Adopt","Operate","Reference"],"glossary":[{"term":"factory","def":"The skills, your settings (the binding), the CLI and the CI checks, working together."},{"term":"cycle","def":"One scheduled agent run that moves each ticket one step and writes a heartbeat."},{"term":"ticket","def":"One item on the board. Its status says where it stands."},{"term":"status","def":"Where a ticket stands: Ideas, Signals, Backlog, Ready, In progress, In review, Done or Cancelled."},{"term":"Signal","def":"Raw input on the board: an alert, feedback, a red CI run, a scanner finding. triage-signal decides on it."},{"term":"skill","def":"A written procedure an agent follows for one step, such as shape or review-pr."},{"term":"binding","def":"The file .agents/binding.yml: every value of your project. The only file a project changes."},{"term":"change request","def":"A pull request. Its short-lived branch is the change line."},{"term":"change line","def":"The short-lived branch of one change request, named after its ticket."},{"term":"main branch","def":"The trunk: the one long-lived branch every change merges into."},{"term":"forge","def":"Where pull requests and CI live. GitHub is the only one supported."},{"term":"gate","def":"A CI job that posts a required check. Agents cannot skip it."},{"term":"check","def":"A pass, pending or fail result on a pull request. Six are required to merge."},{"term":"lane","def":"Fast (small, low risk: merges on the agent review) or Full (also needs a human approval)."},{"term":"proof","def":"How a criterion is shown done: a test, an eval, a visual check, a data check, computer-use or manual."},{"term":"hold","def":"The needs-human label: every skill skips the ticket until an owner replies."},{"term":"heartbeat","def":"One comment per cycle on the heartbeat ticket: what ran, on which model, what failed."},{"term":"identity","def":"The GitHub account the factory acts as. One identity is yours; two adds a separate review app."},{"term":"profile","def":"Who pays for the agents: individual, individual-api or organization."},{"term":"executor","def":"Who runs a skill: a subagent, a local CLI, a bot, a managed agent or a hosted coding agent."},{"term":"harness","def":"The agent product that runs the cycle: Claude Code, Codex, Cursor or another."},{"term":"port","def":"One group of CLI verbs the skills use: board, forge or Git."},{"term":"dispatch","def":"Starting one skill on one ticket through its executor."},{"term":"Shipped","def":"A ticket field, not a status: where the merged change runs (On staging, On production)."}],"blob":"https://github.com/dmitriywind/agentic-sdlc/blob/master/"};

    + '<li><b>Default</b>: #7 stays on hold; nothing is built until an owner replies.</li></ul>');

  function render(flash) {
    const owner = sent.length && sent[sent.length - 1].who === 'owner';
    const held = step >= 2 && !(step === 5 && owner);
    const status = step === 5 && owner ? 'Ready' : 'Backlog';
    card.innerHTML = '<div class="hd-top"><span class="hd-id">#7</span><span class="hd-t">Let users export their data</span></div>'
      + '<div class="hd-meta"><span>Status <span class="state">' + status + '</span></span><span>Priority <span class="tag">High</span></span>'
      + '<span>Labels ' + (held ? '<span class="tag hold">needs-human</span>' : '<span class="tag">feature</span>') + '</span>'
      + '<span>Assignee ' + (held ? '<i>none</i>' : 'shape') + '</span></div>';
    if (flash && !reduced) { card.classList.remove('hd-flash'); void card.offsetWidth; card.classList.add('hd-flash'); }
    el.querySelectorAll('.hd-track li').forEach((li, i) => { const at = [0, 1, 2, 2, 3, 4][step]; li.className = i < at ? 'done' : i === at ? 'now' : ''; if (i === at) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    el.querySelectorAll('#hd-chips li').forEach((li) => li.classList.toggle('on', step >= 1 && (li.dataset.k === 'ruling' || li.dataset.k === 'data')));

    const say = (who, role, p) => '<div><span class="actor ' + role + '">' + who + '</span></div><p>' + p + '</p>';
    if (step === 0) now.innerHTML = say('shape', 'agent', 'shape is writing the acceptance criteria for #7. One criterion needs a <b>product ruling</b>: which formats may a user export? shape may not pick that itself.')
      + '<ul class="hd-work"><li><span class="dot pass"></span><span>A signed-in user can ask for an export of all their data.</span></li>'
      + '<li class="hd-q"><span class="dot pend"></span><span>The export arrives as a file in format <b>?</b> (CSV, JSON, both)</span></li></ul>';
    if (step === 1) now.innerHTML = say('escalate-to-human', 'agent', 'Before it asks anyone, escalate-to-human searches. None of the sources settles it, and two triggers hold: a product ruling, and personal data.')
      + '<ul class="hd-work"><li><span class="dot na"></span><span><code>paths.importance_doc</code>: marks data export as important; silent on formats.</span></li>'
      + '<li><span class="dot na"></span><span><code>paths.sources_before_question</code>: the product doc names no export format.</span></li>'
      + '<li><span class="dot na"></span><span>Past answers: no owner reply on #7 after a Needs human comment.</span></li>'
      + '<li class="hd-q"><span class="dot fail"></span><span>Result: <b>escalate</b> (Ruling, Data).</span></li></ul>';
    if (step === 2) now.innerHTML = say('escalate-to-human', 'agent', 'It posts <b>one</b> comment headed "Needs human", adds the label <span class="tag hold">needs-human</span>, clears the assignee and stops. The status stays <b>Backlog</b>.');
    if (step === 3) now.innerHTML = say('you', 'you', 'The ticket now waits on you. Every skill skips it until an owner replies. Run the next cycle to see.');
    if (step === 4) now.innerHTML = say('cycle', 'agent', 'The next cycle routes the board and skips #7: it is on hold, and no owner has replied. Now reply as an owner, or as someone else.');
    if (step === 5 && owner) now.innerHTML = say('cycle', 'agent', 'Your reply is from <code>owners.product</code>, so it is trusted. The next cycle removes <span class="tag hold">needs-human</span>, and shape finishes the criteria with your answer. #7 moves on to <b>Ready</b>.');
    if (step === 5 && !owner) now.innerHTML = say('cycle', 'agent', OTHER + ' is not in <code>owners</code>, so the reply is untrusted and ignored. The hold stays and the next cycle skips #7 again. Reply as the owner to release it.');

    let t = '';
    if (step >= 2) t += ASK;
    if (step >= 4) t += event('10:00 <code>skipped #7: on hold</code>');
    sent.forEach((r, i) => {
      const own = r.who === 'owner';
      t += comment(own ? OWNER : OTHER, own ? 'you' : 'world', 'commented · ' + (10 + i) + ':20 ' + (own ? '<span class="tag">owners.product · trusted</span>' : '<span class="tag">not in owners · ignored</span>'), esc(r.text) || '<i>(empty)</i>', own ? '' : 'hd-ignored');
      t += own ? event((11 + i) + ':00 <code>#7: needs-human removed; shape resumes</code>') + event((11 + i) + ':12 <code>shape: criteria done (JSON and CSV) · Backlog → Ready</code>', 'hd-ok')
        : event((11 + i) + ':00 <code>skipped #7: on hold</code>');
    });
    thread.innerHTML = t;

    reply.hidden = !(step === 4 || (step === 5 && !owner));
    back.disabled = step === 0;
    next.textContent = step === 3 ? 'Run the next cycle' : 'Next step';
    next.disabled = step >= 4;
    next.hidden = step >= 4;
  }

  next.onclick = () => { step = Math.min(4, step + 1); render(step === 2); if (step === 4) text.focus({ preventScroll: true }); };
  back.onclick = () => { if (step === 5) { sent = []; step = 4; } else step = Math.max(0, step - 1); render(); (next.hidden ? back : next).focus({ preventScroll: true }); };
  $('#hd-reset', el).onclick = () => { step = 0; sent = []; text.value = 'JSON and CSV, as you propose. No other formats for now.'; $('#hd-as-owner', el).checked = true; render(); next.focus({ preventScroll: true }); };
  reply.onsubmit = (e) => {
    e.preventDefault();
    sent.push({ who: reply.elements['hd-as'].value, text: text.value.trim() });
    step = 5; render(true);
    if (reply.hidden) back.focus({ preventScroll: true });
  };
  render();
};

/* ---------- journey.js ---------- */
/* ---------- A ticket's journey: one ticket, six scenarios you step through ---------- */
// The facts come from docs/guide/2-a-ticket.md, 3-your-part.md, 5-review-and-merge.md and 6-shipping.md; the times are an example.
{
const COLS = ['Signals', 'Backlog', 'Ready', 'In progress', 'In review', 'Done'];
const CHECKS = ['Required', 'proofs-on-base', 'ticket-linkage', 'review', 'human-approval', 'skill-regression'];
const C = {
  run: ['pend', 'running'],
  req: ['pass', 'pass · commands.verify, no secrets'],
  red: ['fail', 'fail · a test is red on the new head'],
  proof: ['pass', 'pass · the new test fails on the old code'],
  link: ['pass', 'pass · closes one open ticket, #2'],
  revWait: ['pend', 'pending · waits for the review report'],
  revNew: ['pend', 'pending · needs a report on the new head'],
  revPass: ['pass', 'pass · built by CI from the report'],
  revFail: ['fail', 'fail · Verdict REMEDIATION REQUIRED'],
  fast: ['pass', 'pass · no human needed in the Fast lane'],
  humWait: ['pend', 'pending · waits for a human'],
  humPass: ['pass', 'pass · a person approved this head'],
  skill: ['pass', 'pass · only checks factory changes'],
};
const allRun = Object.fromEntries(CHECKS.map((c) => [c, C.run]));
const green = (human) => ({ Required: C.req, 'proofs-on-base': C.proof, 'ticket-linkage': C.link, review: C.revWait, 'human-approval': human, 'skill-regression': C.skill });
const CRIT = [
  ['Signing out shows “Goodbye, see you soon.”', 'test'],
  ['With a known first name it says “Goodbye, Ada.”; with none, just “Goodbye.”', 'test'],
  ['The message reads well in the light and the dark theme.', 'visual'],
];
const COMMITS = [['a41c9e2', 'test: goodbye on sign-out', 'fails on the old code'], ['7d03b51', 'feat: show the goodbye message', 'makes it pass']];

// Steps shared by the scenarios. A step: t (clock tick), who (actor chips), label (step chip), col (ticket status),
// focus (column to light, when not the ticket's), add (tags, only ever added), ck (check patches), commit, set (other state), art, say.
const signal = () => ({ t: 'Any time', who: [['world', 'A user']], label: 'Signal', col: 'Signals', add: ['signal:feedback'], art: 'signal',
  say: 'A user asks for a goodbye message when they sign out. The request lands on the board as a Signal labelled signal:feedback.' });
const triage = (t) => ({ t, who: [['agent', 'triage-signal']], label: 'Triage', col: 'Backlog', add: ['feature', 'Default'], art: 'triage',
  say: 'triage-signal reads the signal as data: it is real and wanted. It accepts it into Backlog as a feature with Priority Default.' });
const shape = (t) => ({ t, who: [['agent', 'shape']], label: 'Shape', col: 'Ready', add: ['XS', 'Fast'], art: 'shape',
  say: 'shape writes three acceptance criteria, each with the proof that will show it done, and sets Size XS and Lane Fast. The ticket is Ready.' });
const build = (t) => ({ t, who: [['agent', 'implement-spec']], label: 'Build', col: 'In progress', commit: COMMITS, art: 'branch',
  say: 'implement-spec claims the ticket and starts a change line named after it. It commits the failing test first, then the code.' });
const draft = (t) => ({ t, who: [['agent', 'implement-spec']], label: 'Draft CR', col: 'In review', ck: allRun, set: { cr: 'draft' }, art: 'cr',
  say: 'It opens draft change request #3 and moves the ticket to In review. CI starts on the new head.' });
const ci = (human = C.fast) => ({ t: 'CI', who: [['ci', 'CI gates']], label: 'CI', ck: green(human), art: 'cr',
  say: 'Required runs the tests with no secrets: green. The new test fails on the old code, so it proves the change. The change closes one open ticket. review waits for a report.' });
const review = (t) => ({ t, who: [['agent', 'review-pr']], label: 'Review', set: { verdict: 'PASS', finding: null }, art: 'review',
  say: 'review-pr starts in a fresh context. It grades each criterion against the diff and the CI results, without running the code: Verdict PASS.' });
const ready = (t) => ({ t, who: [['agent', 'review-pr']], label: 'Ready', set: { cr: 'ready' }, art: 'cr',
  say: 'review-pr marks the change ready and asks the forge to merge it once all six checks are green.' });
const merge = () => ({ t: 'CI', who: [['ci', 'CI gates']], label: 'Merge', ck: { review: C.revPass }, set: { cr: 'merged' }, art: 'cr',
  say: 'With one identity nothing may approve its own change, so CI turns the report into the review status. All six checks are green: the change merges.' });
const done = () => ({ t: 'CI', who: [['ci', 'merged gate']], label: 'Done', col: 'Done', set: { shipped: 'Not shipped' }, art: 'ticket',
  say: 'The merged gate moves the ticket to Done and sets Shipped to Not shipped. Done is final.' });
const staging = () => ({ t: 'Deploy', who: [['world', 'staging deploy'], ['ci', 'shipped gate']], label: 'Staging', set: { shipped: 'On staging' }, art: 'ticket',
  say: 'The staging deploy job reports to the shipped gate, which sets Shipped to On staging.' });
const prod = () => ({ t: 'Deploy', who: [['world', 'production deploy'], ['ci', 'shipped gate']], label: 'Production', set: { shipped: 'On production' }, art: 'ticket',
  say: 'The production deploy reports too: Shipped becomes On production. The ticket’s journey is over.' });
const c1 = 'Cycle 1 · 09:00', c2 = 'Cycle 2 · 10:00', c3 = 'Cycle 3 · 11:00', c4 = 'Cycle 4 · 12:00';
const upToCi = () => [signal(), triage(c1), shape(c1), build(c1), draft(c1), ci()];

const SCENARIOS = [
  ['happy', 'Happy path', [...upToCi(), review(c2), ready(c2), merge(), done(), staging(), prod()]],
  ['bug', 'Review finds a bug', [...upToCi(),
    { ...review(c2), set: { verdict: 'REMEDIATION REQUIRED', finding: 'Criterion 2 not met: with no name the message reads “Goodbye, undefined.”' }, ck: { review: C.revFail },
      say: 'review-pr grades the criteria against the diff and CI: criterion 2 is not met. Verdict REMEDIATION REQUIRED, with one finding.' },
    { t: c2, who: [['agent', 'review-pr']], label: 'Back', col: 'In progress', art: 'review',
      say: 'review-pr sends the ticket back to In progress with the finding. The change request stays a draft; nothing merges.' },
    { t: c2, who: [['agent', 'implement-spec']], label: 'Fix', col: 'In review', commit: [['c95e017', 'fix: no name, no comma', 'answers the finding']], art: 'branch',
      say: 'implement-spec reads the finding, fixes it on the same branch and pushes. The ticket returns to In review.' },
    { ...ci(), ck: { ...green(C.fast), review: C.revNew }, label: 'CI again',
      say: 'CI runs again on the new head: Required, proofs-on-base and ticket-linkage are green again. The old verdict does not count for a new head.' },
    { ...review(c3), set: { verdict: 'PASS', finding: null, cr: 'ready' }, say: 'review-pr grades the new head in a fresh context: every criterion is DONE, Verdict PASS. It marks the change ready.' },
    merge(), done()]],
  ['red', 'Red CI', [...upToCi(), review(c2), ready(c2),
    { t: 'CI', who: [['ci', 'CI gates']], label: 'Red', ck: { Required: C.red, review: C.revNew }, art: 'cr',
      say: 'The trunk moved, so the change is synced and CI runs on the new head. The review status does not carry over to a new head. Required goes red: a test fails. A red required check blocks the merge.' },
    { t: c3, who: [['agent', 'review-pr']], label: 'Back to draft', col: 'In progress', set: { cr: 'draft' }, art: 'cr',
      say: 'review-pr moves the change request back to draft. The cause is in the code, so the ticket goes to In progress. A cause outside the code would become a new Signal instead.' },
    { t: c3, who: [['agent', 'implement-spec']], label: 'Fix', col: 'In review', commit: [['e2b7f40', 'fix: goodbye after the trunk sync', 'makes Required green']], art: 'branch',
      say: 'implement-spec fixes the test failure on the same branch and pushes. The ticket returns to In review.' },
    { ...ci(), ck: { ...green(C.fast), review: C.revNew }, label: 'CI again', say: 'CI runs on the new head: every check is green again, and review needs a report on this head.' },
    { ...review(c4), set: { verdict: 'PASS', finding: null, cr: 'ready' }, say: 'review-pr grades the new head in a fresh context: Verdict PASS. It marks the change ready again.' },
    merge(), done()]],
  ['hold', 'Needs a human', [signal(), triage(c1),
    { t: c1, who: [['agent', 'shape'], ['agent', 'escalate-to-human']], label: 'Hold', set: { hold: true }, art: 'hold',
      say: 'shape is not sure it may decide criterion 2: may the goodbye show the user’s name? escalate-to-human finds no source that settles it, adds needs-human and posts one comment. The status stays Backlog.' },
    { t: c2, who: [['agent', 'sdlc']], label: 'Skipped', skip: true, art: 'hold', cap: 'Cycle 2: the cycle reads the board and skips every ticket that carries needs-human.',
      say: 'The next cycle reads the board, sees needs-human and skips the ticket. Other work goes on.' },
    { t: 'Any time', who: [['you', 'You']], label: 'You reply', set: { reply: true }, art: 'hold',
      say: 'You reply in a comment: first name only. Your reply counts because you are in owners. You need no label rights.' },
    { t: c3, who: [['agent', 'sdlc']], label: 'Unhold', set: { hold: false }, art: 'hold',
      say: 'The next cycle sees your trusted reply and removes needs-human. The hold is over.' },
    { ...shape(c3), say: 'shape continues with your ruling in criterion 2 and sets Size XS and Lane Fast. The ticket is Ready; from here it runs as in the happy path.' }]],
  ['full', 'Full lane', [signal(), triage(c1),
    { ...shape(c1), add: ['XS', 'Full'], set: { lane: 'Full', spec: true },
      say: 'Sign-out lives under auth/, a path listed in paths.lane_areas, so shape sets Lane Full and writes a spec next to the three criteria. Size XS.' },
    build(c1), { ...draft(c1), set: { cr: 'draft', cls: 'product-full' } },
    { ...ci(C.humWait), say: 'Required, proofs-on-base and ticket-linkage pass. human-approval waits: a product-full change needs a person.' },
    { ...review(c2), set: { verdict: 'PASS', finding: null, cr: 'ready' }, say: 'review-pr grades each criterion in a fresh context: Verdict PASS. It marks the change ready.' },
    { t: 'CI', who: [['ci', 'CI gates']], label: 'Waits', ck: { review: C.revPass }, art: 'cr',
      say: 'CI turns the report into the review status. Five checks are green; human-approval still waits, so nothing merges.' },
    { t: 'Any time', who: [['you', 'A collaborator']], label: 'Approve', art: 'cr',
      say: 'A collaborator approves the head (with one identity you cannot approve your own change; an admin merge is the fallback).' },
    { t: 'CI', who: [['ci', 'CI gates']], label: 'Merge', ck: { 'human-approval': C.humPass }, set: { cr: 'merged' }, art: 'cr',
      say: 'human-approval finds the collaborator’s approval on this head and passes. All six checks are green: the change merges.' },
    done()]],
  ['deploy', 'Deploy fails', [...upToCi(), review(c2), ready(c2), merge(), done(), staging(),
    { t: 'Deploy', who: [['world', 'production deploy'], ['ci', 'shipped gate']], label: 'Deploy fails', focus: 'Signals', set: { shipped: 'On staging', sig2: true }, art: 'signal2',
      say: 'The production deploy fails. The shipped gate keeps Shipped at the last good environment, On staging, and opens Signal #4 with the evidence and needs-human. Ticket #2 stays Done: a later failure never reopens it. #4 waits on hold for you; after an owner replies, triage-signal turns it into a new ticket with a regression case.' }]],
];

function stateAt(steps, i) {
  const s = { col: 'Signals', tags: [], hold: false, cr: null, cls: 'product-fast', lane: 'Fast', spec: false, ck: {}, commits: [], verdict: null, finding: null, shipped: null, reply: false, sig2: false };
  for (const st of steps.slice(0, i + 1)) {
    if (st.col) s.col = st.col;
    for (const t of st.add ?? []) if (!s.tags.includes(t)) s.tags.push(t);
    if (st.commit) s.commits = [...s.commits, ...st.commit];
    if (st.ck) s.ck = { ...s.ck, ...st.ck };
    Object.assign(s, st.set);
  }
  return s;
}
// Consecutive steps with the same tick share one tick on the clock; its caption names what runs there.
function ticks(steps) {
  const segs = [];
  steps.forEach((st, k) => { if (!segs.length || segs.at(-1).t !== st.t) segs.push({ t: st.t, steps: [] }); segs.at(-1).steps.push(st); st.seg = segs.length - 1; });
  for (const g of segs) {
    const name = g.t.split(' · ')[0], kind = g.steps[0].who[0][0];
    const skills = [...new Set(g.steps.flatMap((st) => st.who.filter((w) => w[0] === 'agent').map((w) => w[1])))];
    g.cap = g.steps.find((st) => st.cap)?.cap
      ?? (name.startsWith('Cycle') ? name + ': ' + skills.join(', then ') + (skills.length > 1 ? ': a finished step starts the next one while time is left.' : '. The scheduler starts one cycle at a time, for example every hour.')
      : g.t === 'CI' ? 'CI: runs on the forge on every push and every status change, between cycles. No agent runs it.'
      : g.t === 'Deploy' ? 'Deploy: your deploy jobs run after the merge and report each environment to the shipped gate.'
      : kind === 'you' ? 'Any time: you answer when you like; the next cycle reads your reply.'
      : 'Any time: input arrives on its own and waits on the board for the next cycle.');
  }
  return segs;
}

const tags = (list) => list.map((t) => '<span class="tag' + (t === 'needs-human' ? ' hold' : '') + '">' + esc(t) + '</span>').join('');
const comment = (by, body, you) => '<div class="jr-cm"><span class="jr-by"><i class="' + (you ? 'you' : '') + '"></i>' + by + '</span><div>' + body + '</div></div>';
const head = (kind, title) => '<div class="jr-ah"><span class="jr-kind">' + kind + '</span><b>' + title + '</b></div>';
const ART = {
  signal: (s) => head('Issue #2 · a Signal', 'Show a goodbye message')
    + comment('a user', 'When I sign out, the page just goes blank. Could it say goodbye?') + '<div class="jr-tags">' + tags(['signal:feedback']) + '</div>',
  triage: () => head('Comment on #2', 'Triage decision') + comment('factory bot · triage-signal', '<b>Accepted:</b> real and wanted. Label <code>feature</code>, Priority <code>Default</code>.'),
  shape: (s) => head('Comment on #2', 'Acceptance criteria') + comment('factory bot · shape', '<ol class="jr-crit">' + CRIT.map(([c, p]) =>
    '<li><span>' + esc(c) + '</span><span class="tag jr-proof">proof: ' + p + '</span></li>').join('') + '</ol>')
    + '<div class="jr-kv"><span>Size <b>XS</b></span><span>Lane <b>' + s.lane + '</b></span>' + (s.spec ? '<span>Spec <b>written</b> · touches <code>auth/</code></span>' : '') + '</div>',
  hold: (s) => head('Comment on #2', 'Needs human')
    + comment('factory bot · escalate-to-human', '<span class="tag hold">Needs human</span> Criterion 2 needs a product ruling: may the goodbye show the user’s first name on a shared screen? Reply here; every skill skips #2 until then.')
    + (s.reply ? comment('you · owner', 'Yes, first name only.', true) : '<p class="muted jr-p">No reply yet. The ticket waits in Backlog.</p>')
    + (s.reply && !s.hold ? '<p class="muted jr-p">The cycle removed <code>needs-human</code>.</p>' : ''),
  branch: (s) => head('Change line', '<code>feature/2-show-goodbye-message</code>') + '<ol class="jr-commits">' + s.commits.map(([h, m, n]) =>
    '<li><code>' + h + '</code><span>' + esc(m) + '</span><small class="muted">' + esc(n) + '</small></li>').join('') + '</ol>'
    + '<p class="muted jr-p">The proof comes first: the test is committed before the code that makes it pass.</p>',
  cr: (s) => head('Change request #3', 'Show a goodbye message') + '<div class="jr-kv"><span class="tag">' + s.cls + '</span><span class="jr-st ' + s.cr + '">' + s.cr + '</span><span class="muted">closes #2</span></div>'
    + '<ul class="jr-checks">' + CHECKS.map((c) => { const [st, txt] = s.ck[c] ?? ['na', 'not run']; return '<li><span class="dot ' + st + '"></span><code>' + c + '</code><small>' + esc(txt) + '</small></li>'; }).join('') + '</ul>',
  review: (s) => head('Comment on CR #3', 'Review report') + comment('factory bot · review-pr', '<ul class="jr-rows">' + CRIT.map(([c], k) => {
    const bad = s.finding && k === 1; return '<li><span>' + (k + 1) + '. ' + esc(c) + '</span><b class="' + (bad ? 'jr-bad' : 'jr-ok') + '">' + (bad ? 'NOT MET' : 'DONE') + '</b></li>'; }).join('') + '</ul>'
    + '<p class="jr-verdict ' + (s.finding ? 'jr-bad' : 'jr-ok') + '">Verdict: ' + s.verdict + '</p>' + (s.finding ? '<p class="jr-find">' + esc(s.finding) + '</p>' : '')),
  ticket: (s) => head('Ticket #2', 'Fields') + '<dl class="jr-fields"><dt>Status</dt><dd>' + s.col + '</dd><dt>Lane</dt><dd>' + s.lane + '</dd><dt>Change request</dt><dd>#3 · ' + s.cr + '</dd><dt>Shipped</dt><dd><b>' + esc(s.shipped ?? '—') + '</b></dd></dl>',
  signal2: (s) => head('Issue #4 · a new Signal', 'Production deploy failed') + comment('factory bot · shipped gate', 'The production deploy of the merge of #3 failed its health check on <code>/signout</code> (HTTP 500). Ticket #2 is back at its last good environment: On staging. Evidence: the deploy run log.')
    + '<div class="jr-tags">' + tags(['signal:deploy', 'env:production', 'needs-human']) + '</div><p class="muted jr-p">Ticket #2 stays Done. It waits on hold for you; after an owner replies, triage-signal turns #4 into a new ticket with a regression case.</p>',
};

      $('#rv-lanes', el).innerHTML = LANES.map(([k, n, c]) => '<li><span class="actor ' + c + '">' + esc(n) + '</span>'
        + (k === 'rev' ? '<small>' + (ids === 'one' ? 'in the cycle' : 'separate review run, holds the review token') + '</small>' : '') + '</li>').join('');
      const list = steps(ids, lane);
      $('#rv-steps', el).innerHTML = list.map(([key, from, to, text, note], i) => {
        const a = COL[from], b = COL[to], lo = Math.min(a, b), hi = Math.max(a, b), self = a === b;
        const start = self ? 4 : lo + 1, end = self ? 6 : hi + 2;
        const isNew = prevSteps && prevSteps.get(key) !== text + note;
        return '<li class="rv-step' + (isNew && !reduced ? ' rv-new' : '') + '"><span class="rv-n" aria-hidden="true">' + (i + 1) + '</span>'
          + '<span class="rv-who"><span class="actor ' + KIND[from] + '">' + esc(NAME[from]) + '</span>' + (self ? '' : '<span aria-hidden="true">→</span><span class="actor ' + KIND[to] + '">' + esc(NAME[to]) + '</span>') + '</span>'
          + '<div class="rv-txt rv-msg ' + (self ? 'rv-self' : a < b ? 'rv-r' : 'rv-l') + '" style="--c:' + start + ' / ' + end + ';--n:' + (end - start) + '">'
          + '<span class="rv-n" aria-hidden="true">' + (i + 1) + '</span>'
          + '<span class="rv-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">' + esc(NAME[from]) + (self ? '' : ' to ' + esc(NAME[to])) + ': </span>'
          + esc(text) + (note ? '<small>' + esc(note) + '</small>' : '') + '</div></li>';
      }).join('');
      prevSteps = new Map(list.map(([key, , , text, note]) => [key, text + note]));
      $('#rv-proves', el).innerHTML = '<b>What this proves.</b> ' + esc(PROVES[ids]);
      const cs = checks(ids, lane);
      $('#rv-checks', el).innerHTML = cs.map(([n, who]) => '<li class="' + (prevChecks && prevChecks.get(n) !== who && !reduced ? 'rv-new' : '') + '"><span class="dot pass"></span><code>' + esc(n) + '</code><span class="rv-who2">' + esc(who) + '</span></li>').join('');
      prevChecks = new Map(cs);
    }
    draw();
  };
}

      ['small', 'Small team', 'The lead owns the product, a second engineer the factory. A second person approves Full-lane changes.'],
      ['org', 'Organization', 'A product role and a platform team. A human approves every product change.'],
      ['steward', 'Non-developer owner with a steward', 'The owner acts only through board comments and Idea moves; a technical steward runs the factory.']]],
    ['ship', 'What you ship', 'Sets product.environments, delivery and proofs. The skills are the same for every product.', [
      ['webcd', 'Web service, continuous', 'Every merge deploys to staging, then production.'],
      ['webrel', 'Web product with approved releases', 'Production deploys from a release line the Product owner approves.'],

      ['lib', 'Library or package', 'Every merge publishes to the registry.'],
      ['data', 'Data or ML pipeline', 'Every merge deploys; proofs are evals and data checks.'],

  ];
  const DEF = { pays: 'sub', ids: 'one', repos: 'one', runs: 'claude', board: 'issues', agent: 'claude', team: 'solo', ship: 'webcd' };

    if (k === 'runs' && v === 'managed' && prof === 'individual') return 'needs API keys (individual-api or organization)';

  let pick = { ...DEF };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) for (const [k, , , o] of Q) if (o.some((x) => x[0] === s[k])) pick[k] = s[k]; } catch {}

    .su-blk { display: grid; gap: 6px; min-width: 0; }

    .su-out pre { margin: 0; background: var(--well); border-radius: var(--r); padding: 10px 12px; font: 13px/1.55 var(--mono); white-space: pre; overflow-x: auto; max-width: 100%; }

      .su-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }

    }`);

  el.className = 'panel su';
  el.innerHTML = '<div class="su-head"><h3>Answer eight questions, get your install</h3><button class="btn" type="button" id="su-reset">Reset</button></div>'
    + '<div class="su-grid"><form class="su-qs" id="su-form">' + Q.map(([k, leg, hint, opts]) =>
      '<fieldset class="su-q" id="su-q-' + k + '" aria-describedby="su-hint-' + k + '"><legend>' + esc(leg) + (k === 'pays' ? ' <span class="tag" id="su-profile"></span>' : '') + '</legend>'
      + '<p class="su-hint" id="su-hint-' + k + '">' + esc(hint) + '</p><div class="seg">' + opts.map(([v, t]) =>
        '<label id="su-l-' + k + '-' + v + '"><input type="radio" id="su-' + k + '-' + v + '" name="' + k + '" value="' + v + '"><span>' + esc(t) + '</span></label>').join('')
      + '</div><div id="su-why-' + k + '"></div><p class="su-when" id="su-when-' + k + '" aria-live="polite"></p></fieldset>').join('')
    + '</form><div class="su-out" id="su-out" aria-live="polite"></div></div>';
  const form = $('#su-form', el), out = $('#su-out', el);
  form.addEventListener('submit', (e) => e.preventDefault());

  let moved = [];
  form.addEventListener('change', (e) => {
    const k = e.target.name, before = profileOf(pick);
    pick[k] = e.target.value;
    moved = [];
    if (k === 'pays' && profileOf(pick) !== before) {
      const def = { individual: 'one', organization: 'two' }[profileOf(pick)];
      if (def && pick.ids !== def) { pick.ids = def; moved.push('Forge identities moved to ' + label('ids', def) + ', the default for ' + profileOf(pick) + '.'); }
    }

  $('#su-reset', el).onclick = () => { pick = { ...DEF }; moved = []; draw(); };
  out.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (b) copyText($('#' + b.dataset.copy, el).textContent, b);

  function resolve() {
    for (const [k, leg, , opts] of Q) {
      if (!why(k, pick[k], pick)) continue;
      const first = opts.find((o) => !why(k, o[0], pick));
      moved.push(leg + ' moved from ' + label(k, pick[k]) + ' (' + why(k, pick[k], pick) + ') to ' + first[1] + '.');
      pick[k] = first[0];

  function draw() {
    resolve();
    save();
    for (const [k, , , opts] of Q) {
      const whys = [];
      for (const [v, t, when] of opts) {
        const i = $('#su-' + k + '-' + v, el), w = why(k, v, pick);

        $('#su-l-' + k + '-' + v, el).title = w ? t + ': ' + w : '';

        else i.removeAttribute('aria-describedby');

  function output(prof) {
    const p = pick;
    const harness = { claude: 'claude', codex: 'codex', cursor: 'cursor', other: 'generic' }[p.agent];

    const owners = {

      org: ['product-role-login', 'platform-team-login', 'your-factory-bot'],

      docs: ['[production]', 'continuous', '[visual, manual]'],
    }[p.ship];
    const y = ['profile: ' + prof, 'owners:', '  product: ' + owners[0], '  factory: ' + owners[1], '  bots: [' + owners[2] + ']'];
    if (p.board === 'jira' || p.board === 'linear') y.push('  # names differ? product: { board: <account id>, forge: <login> }');
    // forge: token_env only where gh has no login of its own, or to keep the implementer off commit statuses.
    const forgeToken = p.ids === 'two' || ['vendor', 'actions', 'managed'].includes(p.runs);
    y.push('forge:', '  adapter: github', '  options:', '    repo: your-org/your-repo');
