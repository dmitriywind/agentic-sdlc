/* Layout: a docs app shell. A grouped chapter rail on the left, one reading column, an "On this page" list on wide screens.

/* Home */

<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs';

/* ---------- Component contract ----------
   Each file in scripts/guide/components/ adds one or more entries to VIZ: VIZ.<name> = (el) => { ... }.
   A chapter places it with the marker <!-- viz: <name> --> (the next ```mermaid block, if any, is the GitHub fallback and is dropped).
   Shell helpers available to components: $ (querySelector), esc (HTML escape), reduced (prefers-reduced-motion),
   addStyle(id, cssText) (adds a component's CSS once), copyText(text, button) (copy with a select fallback).
   Components style only with the tokens and shared classes in the stylesheet above, scroll only inside themselves,
   never call scrollIntoView on the page, and work from 360px wide in light and dark. */
const VIZ = {};
const GUIDE = {"chapters":[{"id":"1-what-it-is","n":1,"file":"docs/guide/1-what-it-is.md","title":"1. What it is","short":"What it is","group":"Understand","lead":"agentic-sdlc delivers a product for you with Claude Code agents. Your GitHub issues are the board. A scheduled cloud run, the cycle, moves each issue one step at a time, from a raw signal to a merged and shipped change. CI checks decide what may merge, and no agent can skip them. You act when a rule says a person must decide, and you can do that from a phone.","md":"# 1. What it is\n<!-- group: Understand -->\n\nagentic-sdlc delivers a product for you with Claude Code agents. Your GitHub issues are the board.\nA scheduled cloud run, the **cycle**, moves each issue one step at a time, from a raw signal to a\nmerged and shipped change. CI checks decide what may merge, and no agent can skip them. You act\nwhen a rule says a person must decide, and you can do that from a phone.\n\nThe skills (the process), your settings (the **binding**, `.agents/binding.yml`), the `agentic-sdlc`\nCLI and the CI checks together are the **factory**.\n\n```mermaid\nflowchart LR\n  you([\"You\"]):::you -->|\"ideas, signals\"| sig[\"Signals\"]:::board\n  sig --> bl[\"Backlog\"]:::board --> rd[\"Ready\"]:::board\n  rd --> b[\"Build\"]:::agent --> r[\"Review\"]:::agent\n  r --> m[\"Merge\"]:::ci --> l[\"Learn\"]:::agent\n  you -.->|\"answer holds\"| bl\n  you -.->|\"approved label\"| m\n```\n\n## What it guarantees\n\n| Guarantee | How |\n|---|---|\n| No change merges without its checks | Six required CI checks decide every merge. They read their rules from the main branch, never from the change. |\n| The reviewed code is the tested code | CI runs the tests with no secrets. The review reads the result and never runs the change's code. |\n| You are asked, not bypassed | A rule makes a step stop and ask you: a product ruling, security, money, something that cannot be undone. |\n| Every run leaves a record | Each cycle writes a heartbeat: what ran, on which model, what failed. A separate check notices when the cycle goes quiet. |\n\n## Is it for you\n\n<div class=\"callout ok\">\n\n**A good fit:** one developer with a product on GitHub, tests that run in CI, work you can write as\nissues, and a Claude subscription.\n\n<\/div>\n\n<div class=\"callout warn\">\n\n**Not a fit:** a forge other than GitHub, work with no automated checks, or a need for a second\nperson to approve every change. It is early (0.1): interfaces may change before 1.0, and no full\ncycle has run yet on a real repository in a cloud routine.\n\n<\/div>\n\nYou need: a GitHub repository with CI, Claude Code on your Claude subscription (no API key), and a\ncomputer once, to install it. After that, the cycle runs in a Claude cloud routine and you work from\nthe GitHub and Claude apps.\n\nNext: [2. A ticket's journey](#2-a-ticket).\n"},{"id":"2-a-ticket","n":2,"file":"docs/guide/2-a-ticket.md","title":"2. A ticket's journey","short":"A ticket's journey","group":"Understand","lead":"Follow one ticket from a request to production. Pick a scenario, then press Next or use the arrow keys. Each step shows who acts, what happens and what you would see.","md":"# 2. A ticket's journey\n<!-- group: Understand -->\n\nFollow one ticket from a request to production. Pick a scenario, then press **Next** or use the\narrow keys. Each step shows who acts, what happens and what you would see.\n\n<!-- viz: journey -->\n```mermaid\nflowchart LR\n  sig[\"Signals\"]:::board -->|\"plan/triage\"| bl[\"Backlog\"]:::board\n  bl -->|\"plan/shape\"| rd[\"Ready\"]:::board\n  rd -->|\"build\"| ip[\"In progress\"]:::board\n  ip -->|\"draft pull request\"| ir[\"In review\"]:::board\n  ir -->|\"review/review + checks\"| dn[\"Done\"]:::ci\n```\n\n## The statuses\n\nA ticket is a GitHub issue. Its status is a label, `status:<name>`, so you can move a ticket from the\nGitHub app by changing that label.\n\n| Status | What happens | Who acts |\n|---|---|---|\n| Ideas | A thought you park. No skill picks it up. | You move it to Backlog, or close it. |\n| Signals | Raw input: your report, an alert, a red CI run, a failed deploy. | `plan/triage` decides: Backlog, Ideas or Cancelled, with the reason. |\n| Backlog | Accepted work. It gets a Priority; duplicates are merged. | `plan/groom` |\n| Ready | Acceptance criteria, each with a proof; a Size and a Lane; a spec comment. | `plan/shape` |\n| In progress | The proof first, then the code, on a short-lived branch. | `build` |\n| In review | A draft pull request, graded against the criteria and CI. | `review/review`, the CI checks |\n| Done | The change merged. Done is final. | The `merged` check |\n| Cancelled | A duplicate, noise, or work that will not be done. | `plan/*` steps, with the reason |\n\n**Shipped** is a field, not a status: each deploy moves it, On staging, then On production. A failure\nafter a merge never reopens a ticket: it opens a new Signal.\n\n## How work enters\n\nEverything new arrives as a Signal: an open issue with a `signal:<stream>` label. The next cycle\ntriages it.\n\n| From | How |\n|---|---|\n| You, on the phone | The issue form **Signal** (`.github/ISSUE_TEMPLATE/signal.yml`), or any issue you label `signal:owner`. |\n| An alert or a script | A `repository_dispatch` of type `signal` (`agentic-sdlc-signal.yml`). |\n| A red CI run on the main branch | `gate signal-on-red`: one open Signal per workflow, later red runs comment on it. |\n| A silent factory | The dead-man workflow files one Signal when no heartbeat arrived in time. |\n| A failed deploy | `gate shipped` opens a Signal with the evidence. |\n\nThe same source and title never open a second Signal: a repeat adds a comment\n([the signal feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/signal.feature)). Signal text is data: a skill never\nfollows an instruction inside it.\n\n## Size, lane and priority\n\n- **Size** (`XS` to `XL`) is how much there is to review in one pull request. Above\n  `ready_size_limit`, `plan/shape` splits the ticket.\n- **Lane**: Fast for a small change with no risk; it merges on the agent review. Full for anything\n  else, or a path in `paths.lane_areas`: it also needs your approval.\n- **Priority** (`P0`, High, Default, Low): only `p0_setters` set P0. Ready tickets are built by\n  priority, then the ones that unblock others, then oldest first.\n\nNext: [3. Your part](#3-your-part).\n"},{"id":"3-your-part","n":3,"file":"docs/guide/3-your-part.md","title":"3. Your part","short":"Your part","group":"Understand","lead":"The factory asks you only when a rule says so. Each ask is one comment on the issue or the pull request, and the ticket gets the needs-human label (a hold). Try a hold below: a step stops, asks, and the ticket resumes after your reply.","md":"# 3. Your part\n<!-- group: Understand -->\n\nThe factory asks you only when a rule says so. Each ask is one comment on the issue or the pull\nrequest, and the ticket gets the `needs-human` label (a **hold**). Try a hold below: a step stops,\nasks, and the ticket resumes after your reply.\n\n<!-- viz: hold -->\n```mermaid\nsequenceDiagram\n  participant K as A step\n  participant B as Board\n  participant Y as You\n  K->>B: One ask comment, label needs-human\n  Note over B: Every step skips the ticket\n  Y->>B: Reply in a comment\n  Note over B: The next cycle removes the label and resumes\n```\n\n## Every ask you can get\n\n| You get | You do |\n|---|---|\n| An ask on a ticket (`needs-human`) | Reply in a comment. The next cycle releases the hold. |\n| A Full-lane pull request waiting for approval | Look at the change, then add the `approved` label (`forge.approval_label`) to the pull request. |\n| A factory change (class `guardrail`) | The same: review it, then add the `approved` label. |\n| A `manual` criterion to confirm | Reply that you checked it on this version. |\n| A release to approve (release-line delivery only) | Reply to the proposal, then approve the release workflow run. |\n\nThe approval label counts only for the commit you looked at: every push removes it, and a label\nadded before the latest push does not count. The agent cannot add it: the guard hook and the CLI\nrefuse. It counts only when the account that added it is an owner the change asks for\n([the approval feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/approval.feature), [the guard feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/guard/push-guard.feature)).\n\n## Who you are\n\nThe binding names you in three roles:\n\n| Setting | Means |\n|---|---|\n| `owners.product` | You decide the product: ideas, priorities, P0, Full-lane approvals. |\n| `owners.factory` | You own the skills, the binding and the checks, and approve factory changes. |\n| `owners.bots` | The account the factory acts as. In a cloud routine that is your own GitHub login. |\n\n<div class=\"callout warn\">\n\n**One account in every role.** Your replies still count, since a reply carries no factory marker.\nGitHub refuses your review of a pull request your account opened, so you approve with the `approved`\nlabel. The gate takes your label although the factory acts as your account: the guard hook and the\nCLI stop the agent from adding it. This is a deliberate act outside the agent's tools, not a second\nperson: an agent that got past the guard with a direct API call could add the label itself. For a\nharder wall, run the factory as a second GitHub account and leave yours out of `owners.bots`.\n\n<\/div>\n\nOptional roles (`owners.operator`, `owners.security`, `owners.compliance`) take asks of their kind;\nwithout them those asks come to you.\n\n## A day from the phone\n\n<div class=\"callout\">\n\n- **Morning.** GitHub notifications show new asks. Filter the issues on `needs-human`; reply to each.\n- **A pull request waits.** Open it in the GitHub app, read the diff and the review comment, add the\n  `approved` label.\n- **An idea.** New issue with the **Signal** form. It is triaged on the next cycle. A thought you want\n  to keep but not start: label it `status:Ideas`.\n- **What is going on?** In a Claude Code session on the repo, ask what waits on you. The `setup` skill\n  answers from `agentic-sdlc status`: holds, approvals, the next cycle, the last heartbeat, what is\n  broken ([the status feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/cycle/status.feature)). Not yet tried in a cloud session\n  from a phone.\n- **Silence.** If no cycle ran in time, the dead-man check files a Signal, and GitHub notifies you.\n\n<\/div>\n\nNext: [4. The cycle](#4-the-cycle).\n"},{"id":"4-the-cycle","n":4,"file":"docs/guide/4-the-cycle.md","title":"4. The cycle","short":"The cycle","group":"Understand","lead":"A Claude cloud routine starts one cycle on a schedule, at most once an hour. The cycle is one Claude Code session that loads the sdlc skill, the navigator. Fresh-context workers run the steps, and the cycle writes a heartbeat at the end. Step through one cycle below, and try the cases that stop or change it.","md":"# 4. The cycle\n<!-- group: Understand -->\n\nA Claude cloud routine starts one cycle on a schedule, at most once an hour. The cycle is one Claude\nCode session that loads the `sdlc` skill, the navigator. Fresh-context workers run the steps, and the\ncycle writes a heartbeat at the end. Step through one cycle below, and try the cases that stop or\nchange it.\n\nThe navigator does not read the board itself. It runs `agentic-sdlc next`, which reads the open\nissues, the holds, the open pull requests (`forge queue`) and the run ledger once, and prints the\nholds to release and the work in order. A quiet hour costs two commands: the claim and\n`next --idle-exit`, which writes the heartbeat itself.\n\n<!-- viz: cycle -->\n```mermaid\nflowchart LR\n  c1[\"1. Claim\"]:::agent --> c2[\"2. Read state\"]:::agent --> c3[\"3. Triage\"]:::agent\n  c3 --> c4[\"4. Route\"]:::agent --> c5[\"5. Review\"]:::agent --> c6[\"6. Heartbeat\"]:::board\n```\n\nA ticket routes by its status. A pull request routes by the one next action the queue gives it:\n`review` (no verdict for its latest commit), `rework` (a failed review or a red check: `build` fixes\nit), `sync` (behind the main branch), `land` (`forge land` merges it), `wait`, or `escalate` (stalled,\nor sent back `cycle.max_rework` times). The routes, their order and the caps are data in\n[`skills/sdlc/routes.yml`](https://github.com/dmitriywind/agentic-sdlc/blob/master/skills/sdlc/routes.yml). The behaviour is in\n[the next feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/cycle/next.feature) and [the queue feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/forge/queue.feature).\n\n## Rules that keep it safe\n\n| Rule | Why |\n|---|---|\n| One cycle at a time; a second start stops at the claim. | Two cycles never take the same ticket. |\n| A second start of the same step is skipped inside `cycle.dedupe_minutes`, and while the first run has not finished, until `stall_minutes`. | A double fire does no harm ([the idempotency feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/dispatch/idempotency.feature)). |\n| The claim ends with a done line on every exit, and goes stale after `cycle.time_budget_minutes`. | A cycle that died never blocks the next one. |\n| Nothing new starts after `cycle.time_budget_minutes`. | The heartbeat is written before the session ends. |\n| A step may carry caps (`executors.<step>.max_turns`, `max_tokens`, `max_minutes`); a run that hits one is `capped`, a failure. | A runaway run costs a bounded amount ([the limits feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/dispatch/limits.feature)). |\n| A ticket over `cycle.max_tokens_per_ticket` gets no further run and goes to you. | One ticket cannot spend without limit. |\n| A failed step goes into the heartbeat's `errors`; the cycle goes on. | One failure does not stop other work. |\n| A step that failed in the last `cycle.failure_limit` heartbeats on the same main-branch commit is held for you. | No endless retries; a factory fix gives it a fresh start. |\n\nNext: [5. Review and merge](#5-review-and-merge).\n"},{"id":"5-review-and-merge","n":5,"file":"docs/guide/5-review-and-merge.md","title":"5. Review and merge","short":"Review and merge","group":"Understand","lead":"build opens a draft pull request. CI and review/review then decide whether it merges. The review never runs the change's code: CI runs it, with no secrets, and the review reads the result. It publishes one verdict for the latest commit with forge verdict. On a pass it marks the pull request ready and calls forge land, the only way anything merges: it waits for the required checks, then turns on auto-merge, or reports who must approve. Switch the lane (Fast or Full) and the accounts (one, or a separate review account) below to see what changes.","md":"# 5. Review and merge\n<!-- group: Understand -->\n\n`build` opens a **draft** pull request. CI and `review/review` then decide whether it merges. The\nreview never runs the change's code: CI runs it, with no secrets, and the review reads the result.\nIt publishes one verdict for the latest commit with `forge verdict`. On a pass it marks the pull\nrequest ready and calls `forge land`, the only way anything merges: it waits for the required checks,\nthen turns on auto-merge, or reports who must approve. Switch the lane (Fast or Full) and the accounts\n(one, or a separate review account) below to see what changes.\n\n<!-- viz: review -->\n```mermaid\nsequenceDiagram\n  participant I as build\n  participant CI as CI checks\n  participant R as review/review\n  participant G as GitHub\n  I->>G: Draft pull request\n  G->>CI: Tests and checks\n  R->>G: forge verdict: report, Verdict PASS\n  CI->>G: review = success, from the report\n  R->>G: forge ready, then forge land\n  G->>G: Merge when all checks are green\n```\n\n## One account\n\nThe factory acts on GitHub as one account, yours. The review is a fresh agent context with no edit\ntools that may run only `agentic-sdlc` commands, not a second account. `forge verdict` posts the\nreport; the CR workflow's `review` gate turns it into the `review` status\n([the review gate feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/review.feature)). So the branch rules cannot prove that\nan agent did not post its own review. A separate review account (`forge.review_identity`, profile\n`organization`) closes that gap; this guide does not cover it, the contract does.\n\n## The six required checks\n\n| Check | Passes when |\n|---|---|\n| `Required` | `commands.install` and `commands.verify` pass on the change, in a job with no secrets. |\n| `proofs-on-base` | Every new or changed proof fails on the old code, so it proves the change ([feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/proofs-on-base.feature)). |\n| `ticket-linkage` | The pull request closes exactly one open ticket, named in its branch ([feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/linkage.feature)). |\n| `review` | The review verdict for the latest commit is PASS. |\n| `human-approval` | The approval its class needs is on the latest commit (below). |\n| `skill-regression` | A factory change keeps the skill pack valid. A product change passes it. |\n\nA seventh, `agent-provenance`, is off until you set `forge.provenance`: it lists each commit as agent\nor human from `Agent-Run` and `Agent-Model` trailers ([feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/provenance.feature)).\n\n## Who must approve\n\n| Class | Is | Needs |\n|---|---|---|\n| `product-fast` | A product change in the Fast lane. | Nothing more. |\n| `product-full` | A Full-lane change, or one that touches `paths.lane_areas`. | An approving review by a collaborator outside `owners.bots`, or the approval label from `owners.product`, unless `forge.human_approval: never`. |\n| `tuning` | A factory change to the model map, or to the tier of a skill with a bench suite. | Nothing when `learning.auto_merge_classes` lists it; else as `guardrail`. |\n| `guardrail` | Any other factory change, or one that mixes product and factory files. | An approval or the approval label from `owners.factory`. |\n\nWho may add the label, and what that means with one account, is in [3. Your part](#3-your-part)\n([the classify feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/classify.feature)).\n\n## When review says no\n\n| Finding | Where it goes |\n|---|---|\n| A criterion not met, a bug, a security issue | A fail verdict. The queue says `rework`: `build` fixes each finding and pushes. After `cycle.max_rework` reworks, you are asked. |\n| The spec or scope is wrong | The pull request goes back to draft; the ticket goes to Backlog. |\n| A pull request you opened | `build` never pushes to it: a note gives you the findings. |\n| A red check | `rework`. A cause in the change: `build` fixes it. A cause elsewhere becomes a Signal, and the pull request waits until it closes. |\n| Behind the main branch | `sync`: brought up to date, then reviewed again. |\n| A check pending past `stall_minutes` | `escalate`: you are asked. |\n\nA private repo on GitHub Free has no draft pull requests and no enforced ruleset: a draft is a pull\nrequest with the `draft` label, and the merge happens once every required check is green, with no\nrule to stop it. `doctor` warns ([the cloud feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/forge/cloud.feature)).\n\nNext: [6. Shipping](#6-shipping).\n"},{"id":"6-shipping","n":6,"file":"docs/guide/6-shipping.md","title":"6. Shipping","short":"Shipping","group":"Understand","lead":"A merge makes the ticket Done and \"Not shipped\". Your deploy workflows then report each environment to the shipped check, which moves the ticket's Shipped field. Merge, deploy, and make a deploy fail below.","md":"# 6. Shipping\n<!-- group: Understand -->\n\nA merge makes the ticket Done and \"Not shipped\". Your deploy workflows then report each environment\nto the `shipped` check, which moves the ticket's **Shipped** field. Merge, deploy, and make a deploy\nfail below.\n\n<!-- viz: ship -->\n```mermaid\nflowchart LR\n  m[\"Merge\"]:::ci --> s[\"On staging\"]:::board --> p[\"On production\"]:::board\n```\n\n`init` writes `product.delivery: continuous`: every merge ships, environment by environment, from the\nmain branch. Nobody starts a release. The delivery workflow (`agentic-sdlc-delivery.yml`) watches the\ndeploy workflows named in `forge.deploy_workflows` and the CI workflow in `forge.ci_workflow`\n([the shipped feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/shipped.feature), [the merged feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/gates/merged.feature)).\n\n<div class=\"callout warn\">\n\nThe delivery workflow reports the first and the last deploy under the fixed names `first-env` and\n`last-env`, not the names in `product.environments`. Until it reads them, rename those two words in\nthe installed workflow to your environment names.\n\n<\/div>\n\n## When a deploy fails\n\n- The tickets in that deploy go back to the last good environment, and one Signal opens with the\n  evidence. A failure in the last environment also puts a hold on that Signal.\n- A rollback reports `--result rolled-back`: tickets not in the running version step back.\n- With `product.evidence` set, a last deploy whose `commands.evidence_check` fails counts as failed.\n- If the delivery workflow itself fails, run it by hand with the commit's sha: it runs the `merged`\n  check again.\n\n## Release lines (opt in)\n\nSet `product.delivery: release-line` when you want to approve what reaches the last environment.\nThen the `ship` step proposes the contents of a release when you open a release request (a Backlog\nticket with the `release` label), cuts a release line on your go-ahead, and the release workflow runs\nafter you approve it in GitHub's Environment `agentic-release`. Agents never approve it.\n\nNext: [7. Install](#7-install).\n"},{"id":"7-install","n":7,"file":"docs/guide/7-install.md","title":"7. Install","short":"Install","group":"Adopt","lead":"Three steps, once, on a computer with Claude Code and Node 22.18 or later. After that you work from the phone.","md":"# 7. Install\n<!-- group: Adopt -->\n\nThree steps, once, on a computer with Claude Code and Node 22.18 or later. After that you work from\nthe phone.\n\n## 1. Add the plugin\n\nIn Claude Code:\n\n```text\n/plugin marketplace add dmitriywind/agentic-sdlc\n/plugin install agentic-sdlc@agentic-sdlc\n```\n\nThe plugin brings the skills, the guard hook, a session-start hook, the MCP server, a subagent per\nmodel tier, the read-only `sdlc-reviewer`, and `agentic-sdlc` on the Bash path.\n\n## 2. Run the setup skill\n\nOpen your repo in Claude Code and ask it to set up the factory. The `setup` skill:\n\n1. runs `agentic-sdlc init --no-plugin`, which writes `.agents/` (the binding, the CLI pin\n   `.agents/cli.json` and the launcher `.agents/bin/agentic-sdlc`), the workflows and rulesets under\n   `.github/`, and the skills, reviewer and hooks under `.claude/`, because a cloud routine loads\n   only the repo's own files;\n2. reads the project and `agentic-sdlc forge whoami`, and replaces each `unresolved: <hint>` in the\n   binding with what the project states, leaving the rest on your list;\n3. runs `agentic-sdlc board bootstrap`: the labels and the heartbeat issue\n   ([the bootstrap feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/board/bootstrap.feature));\n4. loops `validate --json` and `doctor` until they pass, or each line left is on your list;\n5. opens the install as a factory pull request, and ends with a checklist.\n\nThe behaviour is in [the init feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/install/init.feature) and\n[the validate feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/install/validate.feature). The CLI installs from Git only: the\nnpm package named `agentic-sdlc` is a different project.\n\n## 3. Do the checklist\n\nThe skill's checklist comes from the `person` list of `agentic-sdlc status`\n([the status feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/cycle/status.feature)): each item says where to do it, and the\nones the CLI can check are marked. Around it, merge the install pull request and write two docs.\n\n| Step | Where |\n|---|---|\n| Merge the install pull request. | GitHub. It is a factory change, so see [3. Your part](#3-your-part) for who can approve it. |\n| Install the Claude GitHub App on this repo only. | github.com/apps/claude |\n| Create the cloud routine that runs one cycle: this repo, an environment with `AGENTIC_SDLC_UNATTENDED=1` and the setup script from `templates/runner/claude-routine.md`, the model of `models.fast`, the prompt from `.agents/cycle-prompt.md`, and a schedule at least an hour apart (for example `7 */2 * * *`). | claude.ai/code/routines |\n| Optional: a GitHub event trigger on Issues (opened, labeled), so a new Signal starts a cycle. Not yet tried on a real routine. | the routine's triggers |\n| Protect the main branch: import `.github/rulesets/trunk.json`. A private repo on GitHub Free cannot enforce it. | the repo's Settings > Rules |\n| Write the two docs every ticket is judged against: `paths.importance_doc` and `paths.guiding_narrative`. Without them product questions become holds. | the repo |\n\n<div class=\"callout ok\">\n\n**Done when** a scheduled cycle writes a heartbeat with no `errors`, and a pull request merges through\nthe checks. Run the first cycles with two or three small tickets and read every comment they write.\n\n<\/div>\n\n## Try it with no accounts\n\nThe `local` board is a file, `.agents/board.json`:\n\n```bash\nmkdir try-agentic && cd try-agentic && git init -b main\nnpx --yes --allow-git=root github:dmitriywind/agentic-sdlc#v0.1.2 init --board local --no-plugin\nprintf 'Show a greeting on the home page.\\n' > body.md\n.agents/bin/agentic-sdlc board create --title \"Greeting\" --body-file body.md --status Backlog\n.agents/bin/agentic-sdlc dispatch plan/shape --ticket 2\n```\n\n`dispatch` prints the instruction an agent would follow and starts nothing. Open the folder in\nClaude Code and ask it to run the `sdlc` skill for one cycle. npm older than 12 does not know\n`--allow-git`: drop the flag there.\n\nNext: [8. Run it](#8-run-it).\n"},{"id":"8-run-it","n":8,"file":"docs/guide/8-run-it.md","title":"8. Run it","short":"Run it","group":"Operate","lead":"What you do after the first cycle: watch it, upgrade it, and, if you want, let it learn.","md":"# 8. Run it\n<!-- group: Operate -->\n\nWhat you do after the first cycle: watch it, upgrade it, and, if you want, let it learn.\n\n## Watch it\n\n```bash\n.agents/bin/agentic-sdlc status\n.agents/bin/agentic-sdlc ledger summary\n.agents/bin/agentic-sdlc ledger measures\n```\n\n`status` is the short answer: what waits on you, what the next cycle does, the last heartbeat, what is\nbroken. `ledger summary` reads the heartbeats: runs, outcomes, tokens per ticket and the failures that\nrepeat ([the summary feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/ledger/summary.feature)). `ledger measures` prints deploy\nfrequency, lead time, change failure rate, time to restore and rework rate over 30 days\n([the measures feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/ledger/measures.feature)); a measure the data cannot give is\n`null` with a reason.\n\nThe dead-man workflow (`agentic-sdlc-dead-man.yml`) runs every 3 hours outside the cycle and fails when\nno heartbeat arrived for `--max-hours` (6 as installed; keep it above your cadence). It catches what\nstops silently: runs rejected at the subscription usage limit, a routine switched off after 72 hours\nwithout a GitHub connection, a run that shows Succeeded and did nothing. It files one Signal; later\nfailures comment on it. In a public repo GitHub turns off scheduled workflows after 60 days with no\nactivity, and the dead-man check stops with them.\n\nSet `product.slo` (`change_failure_rate_max`, `window_days`) to give the factory an error budget. While\nit is spent, the cycle starts no new feature ticket and the heartbeat says `budget: exhausted`.\n\n## Upgrade\n\nAn upgrade is one factory change: the new package's `init --upgrade` rewrites the pin and the\ninstalled files together. Ask the `setup` skill, or by hand on a factory branch:\n\n```bash\nnpx --yes --allow-git=root github:dmitriywind/agentic-sdlc#v<new> init --upgrade\n```\n\n`init` keeps the hash of every file it installed in `.agents/install.lock.json`. A file still at its\nhash is updated, a file you edited is kept and named, a new file is written, and a file the package\ndropped is reported `stale` and left in place. No flag rewrites `.agents/binding.yml`; `validate` names\nthe keys the new template has and yours lacks ([the upgrade feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/install/upgrade.feature),\n[the pin feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/install/pin.feature)). Then run `validate`, `doctor` and one cycle, and\nmerge it like any factory change.\n\n## Learning (optional)\n\nOff until you set `learning.enabled: true` and `agent_command`. Then:\n\n1. `learn/judge` grades each finished run with the scorers in `.agents/scorers/`, on a different model\n   than the run used. Your own grade, a comment `agentic-sdlc:grade <run-id> <scorer> <value>`, wins.\n2. Every `learning.every_cycles` cycles, `learn/improve` takes the worst failure that repeats in at\n   least `learning.min_evidence_runs` runs and proposes one factory change.\n3. The bench replays cases built from your merged tickets with the change and without it. The change\n   must not lower the pass rate. With the defaults (20 cases, 3 trials) that is 60 replays per side,\n   inside your subscription's limits; `learning.bench_budget` caps it.\n4. The change goes through review and the checks like any other factory change.\n\nThe behaviour is in [the bench features](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/bench/) and\n[the record feature](https://github.com/dmitriywind/agentic-sdlc/blob/master/features/ledger/record.feature).\n\nNext: [9. The parts](#9-parts).\n"},{"id":"9-parts","n":9,"file":"docs/guide/9-parts.md","title":"9. The parts","short":"The parts","group":"Reference","lead":"How the factory is built. The exact rules are in the contract, references/architecture.md.","md":"# 9. The parts\n<!-- group: Reference -->\n\nHow the factory is built. The exact rules are in the contract,\n[`references/architecture.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/references/architecture.md).\n\n## Three layers\n\n| Layer | Where | Holds |\n|---|---|---|\n| Skills | the plugin, and copies in `.agents/skills/` and `.claude/skills/` | The process: every rule. The same for every project. |\n| Binding | `.agents/binding.yml` | Your project's values: owners, commands, environments, models. |\n| CLI | `agentic-sdlc` and its MCP server | The mechanism: board, forge and Git verbs, the checks, dispatch, the run ledger. |\n\nA project changes only its binding. A skill never calls `gh` or `git` directly: it calls the CLI.\n\n```mermaid\nflowchart LR\n  sk[\"Skills\"]:::agent --> cli[\"agentic-sdlc CLI<br/>and MCP server\"]:::ci\n  bd[\"Binding\"]:::board --> cli\n  cli --> b[(\"GitHub issues\")]:::board\n  cli --> f[(\"Pull requests and CI\")]:::board\n  cli --> g[(\"Git\")]:::board\n```\n\n## Seven skills, one per phase\n\nA step is what runs: `dispatch plan/shape --ticket 12`. A skill with one step runs by its name. The\ncycle runs every step in a fresh context.\n\n| Skill | Phase | Steps |\n|---|---|---|\n| `sdlc` | The navigator: one cycle, routing each ticket and pull request to its next step. | one |\n| `plan` | Signals, Ideas and Backlog to Ready. | `triage`, `groom`, `shape` |\n| `build` | Ready to In review: proof first, then code, then a draft pull request; every rework. | one |\n| `review` | In review to merged, or sent back. | `review`; `verify` (uses a preview as a user, for `computer-use` criteria) |\n| `ship` | Release lines (release-line delivery only). | one |\n| `escalate` | Decides whether you must act, and holds the ticket with one ask. | one, inside the calling step |\n| `learn` | The learning loop (`learning.enabled`). | `judge`, `improve` |\n\n`setup` is the eighth skill: it installs and repairs the factory and answers what waits on you. No\ncycle runs it. Under the plugin a skill is `agentic-sdlc:<skill>`; a copy is `sdlc-<skill>` (`sdlc`\nstays `sdlc`).\n\n## Trust boundaries\n\n| Part | Runs the change's code | Holds secrets |\n|---|---|---|\n| CI `Required` and `proofs-on-base` jobs | yes | no |\n| CI gates | no: the CLI only, with the rules from the main branch | the job token |\n| The cycle and `build` | their own work | the routine's GitHub access |\n| `review/review` | no: it reads CI results and the diff | the routine's GitHub access |\n| `review/verify` | yes: a preview, in a browser | test credentials, only if you give them |\n\nUntrusted input is data, never instructions: Signal text, pull request bodies, and comments by\naccounts outside `owners`. The guard hook refuses a push to the main branch and any agent write of the\napproval label.\n\n## What `init` puts in your project\n\n| Path | Holds |\n|---|---|\n| `.agents/binding.yml` | Every project value. |\n| `.agents/cli.json`, `.agents/bin/agentic-sdlc` | The CLI pin and the launcher that installs it in `.agents/.cli/` on first use. Every workflow, hook and runner calls the launcher. |\n| `.agents/skills/`, `.agents/scorers/` | The skill pack the gates read, and the scorers. |\n| `.agents/cycle-prompt.md`, `runner-setup.sh`, `hooks/` | What a scheduler runs; the hook scripts. |\n| `.claude/skills/`, `.claude/agents/`, `.claude/settings.json`, `.mcp.json` | What a cloud session loads: the skills, the tier agents and the reviewer, the hooks, the MCP server. |\n| `.github/workflows/agentic-sdlc-*.yml`, `.github/rulesets/`, `.github/ISSUE_TEMPLATE/signal.yml` | The checks, the branch protection, the Signal form. |\n| `AGENTS.md`, `CLAUDE.md` | A pointer for every agent: start with the `sdlc` skill. |\n\nA change under `.agents/`, `.github/` or `.claude/` is a factory change.\n\nNext: [10. Glossary](#10-glossary).\n"},{"id":"10-glossary","n":10,"file":"docs/guide/10-glossary.md","title":"10. Glossary","short":"Glossary","group":"Reference","lead":"The words the guide uses. On the guide page, the first use of each word in a chapter shows its meaning when you point at it.","md":"# 10. Glossary\n<!-- group: Reference -->\n\nThe words the guide uses. On the guide page, the first use of each word in a chapter shows its\nmeaning when you point at it.\n\n| Term | Means |\n|---|---|\n| factory | The skills, your settings (the binding), the CLI and the CI checks, working together. |\n| cycle | One scheduled agent run that moves each ticket one step and writes a heartbeat. |\n| routine | A Claude cloud scheduled task: it runs the cycle on Anthropic's cloud on your subscription. |\n| ticket | One GitHub issue on the board. Its status label says where it stands. |\n| status | Where a ticket stands: Ideas, Signals, Backlog, Ready, In progress, In review, Done or Cancelled. |\n| Signal | Raw input on the board, with a signal: label: your report, an alert, a red CI run, a failed deploy. plan/triage decides on it. |\n| skill | One phase of the process, written for agents: sdlc, plan, build, review, ship, learn, escalate, and setup. |\n| step | The unit that runs, named skill/step, such as plan/shape or review/review. A skill with one step runs by its name, such as build. |\n| navigator | The sdlc skill: it runs one cycle and routes each ticket and pull request to its next step. |\n| binding | The file .agents/binding.yml: every value of your project. |\n| change request | A pull request. Its short-lived branch is the change line. |\n| main branch | The trunk: the one long-lived branch every change merges into. |\n| gate | A CI job that posts a required check. Agents cannot skip it. |\n| check | A pass, pending or fail result on a pull request. Six are required to merge. |\n| verdict | The pass or fail that forge verdict publishes for the latest commit, with the review report. A new commit needs a new verdict. |\n| queue | The output of forge queue: every open pull request with its one next action. |\n| land | What forge land does: wait for the required checks, then turn on auto-merge, or report who must approve. The only way a change merges. |\n| lane | Fast (small, low risk: merges on the agent review) or Full (also needs an approval). |\n| approval label | The label (approved by default) an owner adds to a pull request to approve its latest commit. A push removes it. |\n| proof | How a criterion is shown done: a test, an eval, a visual check, a data check, computer-use or manual. |\n| hold | The needs-human label with one ask: every step skips the ticket until an owner replies. |\n| heartbeat | One comment per cycle on the heartbeat issue: what ran, on which model, what failed. |\n| dead-man check | A scheduled workflow outside the cycle that files a Signal when no heartbeat arrived in time. |\n| Shipped | A ticket field, not a status: where the merged change runs (On staging, On production). |\n| pin | The file .agents/cli.json: the tag or commit of agentic-sdlc the project runs. |\n| launcher | The script .agents/bin/agentic-sdlc: it installs the pinned CLI on first use and runs it. |\n"}],"groups":["Understand","Adopt","Operate","Reference"],"glossary":[{"term":"factory","def":"The skills, your settings (the binding), the CLI and the CI checks, working together."},{"term":"cycle","def":"One scheduled agent run that moves each ticket one step and writes a heartbeat."},{"term":"routine","def":"A Claude cloud scheduled task: it runs the cycle on Anthropic's cloud on your subscription."},{"term":"ticket","def":"One GitHub issue on the board. Its status label says where it stands."},{"term":"status","def":"Where a ticket stands: Ideas, Signals, Backlog, Ready, In progress, In review, Done or Cancelled."},{"term":"Signal","def":"Raw input on the board, with a signal: label: your report, an alert, a red CI run, a failed deploy. plan/triage decides on it."},{"term":"skill","def":"One phase of the process, written for agents: sdlc, plan, build, review, ship, learn, escalate, and setup."},{"term":"step","def":"The unit that runs, named skill/step, such as plan/shape or review/review. A skill with one step runs by its name, such as build."},{"term":"navigator","def":"The sdlc skill: it runs one cycle and routes each ticket and pull request to its next step."},{"term":"binding","def":"The file .agents/binding.yml: every value of your project."},{"term":"change request","def":"A pull request. Its short-lived branch is the change line."},{"term":"main branch","def":"The trunk: the one long-lived branch every change merges into."},{"term":"gate","def":"A CI job that posts a required check. Agents cannot skip it."},{"term":"check","def":"A pass, pending or fail result on a pull request. Six are required to merge."},{"term":"verdict","def":"The pass or fail that forge verdict publishes for the latest commit, with the review report. A new commit needs a new verdict."},{"term":"queue","def":"The output of forge queue: every open pull request with its one next action."},{"term":"land","def":"What forge land does: wait for the required checks, then turn on auto-merge, or report who must approve. The only way a change merges."},{"term":"lane","def":"Fast (small, low risk: merges on the agent review) or Full (also needs an approval)."},{"term":"approval label","def":"The label (approved by default) an owner adds to a pull request to approve its latest commit. A push removes it."},{"term":"proof","def":"How a criterion is shown done: a test, an eval, a visual check, a data check, computer-use or manual."},{"term":"hold","def":"The needs-human label with one ask: every step skips the ticket until an owner replies."},{"term":"heartbeat","def":"One comment per cycle on the heartbeat issue: what ran, on which model, what failed."},{"term":"dead-man check","def":"A scheduled workflow outside the cycle that files a Signal when no heartbeat arrived in time."},{"term":"Shipped","def":"A ticket field, not a status: where the merged change runs (On staging, On production)."},{"term":"pin","def":"The file .agents/cli.json: the tag or commit of agentic-sdlc the project runs."},{"term":"launcher","def":"The script .agents/bin/agentic-sdlc: it installs the pinned CLI on first use and runs it."}],"blob":"https://github.com/dmitriywind/agentic-sdlc/blob/master/"};

    const say = (who, role, p) => '<div><span class="actor ' + role + '">' + who + '</span></div><p>' + p + '</p>';
    if (step === 0) now.innerHTML = say('plan/shape', 'agent', 'plan/shape is writing the acceptance criteria for #7. One criterion needs a <b>product ruling</b>: which formats may a user export? plan/shape may not pick that itself.')
      + '<ul class="hd-work"><li><span class="dot pass"></span><span>A signed-in user can ask for an export of all their data.</span></li>'
      + '<li class="hd-q"><span class="dot pend"></span><span>The export arrives as a file in format <b>?</b> (CSV, JSON, both)</span></li></ul>';
    if (step === 1) now.innerHTML = say('escalate', 'agent', 'Before it asks anyone, escalate searches. None of the sources settles it, and two triggers hold: a product ruling, and personal data.')
      + '<ul class="hd-work"><li><span class="dot na"></span><span><code>paths.importance_doc</code>: marks data export as important; silent on formats.</span></li>'
      + '<li><span class="dot na"></span><span><code>paths.sources_before_question</code>: the product doc names no export format.</span></li>'
      + '<li><span class="dot na"></span><span>Past answers: no owner reply on #7 after a Needs human comment.</span></li>'
      + '<li class="hd-q"><span class="dot fail"></span><span>Result: <b>escalate</b> (Ruling, Data).</span></li></ul>';
    if (step === 2) now.innerHTML = say('escalate', 'agent', 'It runs <code>board hold</code>: <b>one</b> comment headed "Needs human" and the label <span class="tag hold">needs-human</span>. It clears the assignee and stops. The status stays <b>Backlog</b>.');
    if (step === 3) now.innerHTML = say('you', 'you', 'The ticket now waits on you. Every step skips it until an owner replies. Run the next cycle to see.');
    if (step === 4) now.innerHTML = say('cycle', 'agent', 'The next cycle routes the board and skips #7: it is on hold, and no owner has replied. Now reply as an owner, or as someone else.');
    if (step === 5 && owner) now.innerHTML = say('cycle', 'agent', 'Your reply is from <code>owners.product</code>, so it is trusted. The next cycle sees it in <code>board holds</code> and runs <code>board release</code>, which removes <span class="tag hold">needs-human</span>; plan/shape finishes the criteria with your answer. #7 moves on to <b>Ready</b>.');
    if (step === 5 && !owner) now.innerHTML = say('cycle', 'agent', OTHER + ' is not in <code>owners</code>, so the reply is untrusted and ignored. The hold stays and the next cycle skips #7 again. Reply as the owner to release it.');

    let t = '';
    if (step >= 2) t += ASK;
    if (step >= 4) t += event('10:00 <code>skipped #7: on hold</code>');
    sent.forEach((r, i) => {
      const own = r.who === 'owner';
      t += comment(own ? OWNER : OTHER, own ? 'you' : 'world', 'commented · ' + (10 + i) + ':20 ' + (own ? '<span class="tag">owners.product · trusted</span>' : '<span class="tag">not in owners · ignored</span>'), esc(r.text) || '<i>(empty)</i>', own ? '' : 'hd-ignored');
      t += own ? event((11 + i) + ':00 <code>board release #7: needs-human removed; plan/shape resumes</code>') + event((11 + i) + ':12 <code>plan/shape: criteria done (JSON and CSV) · Backlog → Ready</code>', 'hd-ok')
        : event((11 + i) + ':00 <code>skipped #7: on hold</code>');
    });
    thread.innerHTML = t;

    reply.hidden = !(step === 4 || (step === 5 && !owner));
    back.disabled = step === 0;
    next.textContent = step === 3 ? 'Run the next cycle' : 'Next step';
    next.disabled = step >= 4;
    next.hidden = step >= 4;
  }

  next.onclick = () => { step = Math.min(4, step + 1); render(step === 2); if (step === 4) text.focus({ preventScroll: true }); };
  back.onclick = () => { if (step === 5) { sent = []; step = 4; } else step = Math.max(0, step - 1); render(); (next.hidden ? back : next).focus({ preventScroll: true }); };
  $('#hd-reset', el).onclick = () => { step = 0; sent = []; text.value = 'JSON and CSV, as you propose. No other formats for now.'; $('#hd-as-owner', el).checked = true; render(); next.focus({ preventScroll: true }); };
  reply.onsubmit = (e) => {
    e.preventDefault();
    sent.push({ who: reply.elements['hd-as'].value, text: text.value.trim() });
    step = 5; render(true);
    if (reply.hidden) back.focus({ preventScroll: true });
  };
  render();
};

/* ---------- journey.js ---------- */
/* ---------- A ticket's journey: one ticket, six scenarios you step through ---------- */
// The facts come from docs/guide/2-a-ticket.md, 3-your-part.md, 5-review-and-merge.md and 6-shipping.md; the times are an example.
{
const COLS = ['Signals', 'Backlog', 'Ready', 'In progress', 'In review', 'Done'];
const CHECKS = ['Required', 'proofs-on-base', 'ticket-linkage', 'review', 'human-approval', 'skill-regression'];
const C = {
  run: ['pend', 'running'],
  req: ['pass', 'pass · commands.verify, no secrets'],
  red: ['fail', 'fail · a test is red on the new head'],
  proof: ['pass', 'pass · the new test fails on the old code'],
  link: ['pass', 'pass · closes one open ticket, #2'],
  revWait: ['pend', 'pending · waits for a verdict'],
  revNew: ['pend', 'pending · needs a verdict on the new head'],
  revPass: ['pass', 'pass · from the verdict on this head'],
  revFail: ['fail', 'fail · Verdict REMEDIATION REQUIRED'],
  fast: ['pass', 'pass · no human needed in the Fast lane'],
  humWait: ['pend', 'pending · waits for a human'],
  humPass: ['pass', 'pass · a person approved this head'],
  skill: ['pass', 'pass · only checks factory changes'],
};
const allRun = Object.fromEntries(CHECKS.map((c) => [c, C.run]));
const green = (human) => ({ Required: C.req, 'proofs-on-base': C.proof, 'ticket-linkage': C.link, review: C.revWait, 'human-approval': human, 'skill-regression': C.skill });
const CRIT = [
  ['Signing out shows “Goodbye, see you soon.”', 'test'],
  ['With a known first name it says “Goodbye, Ada.”; with none, just “Goodbye.”', 'test'],
  ['The message reads well in the light and the dark theme.', 'visual'],
];
const COMMITS = [['a41c9e2', 'test: goodbye on sign-out', 'fails on the old code'], ['7d03b51', 'feat: show the goodbye message', 'makes it pass']];

// Steps shared by the scenarios. A step: t (clock tick), who (actor chips), label (step chip), col (ticket status),
// focus (column to light, when not the ticket's), add (tags, only ever added), ck (check patches), commit, set (other state), art, say.
const signal = () => ({ t: 'Any time', who: [['world', 'A user']], label: 'Signal', col: 'Signals', add: ['signal:feedback'], art: 'signal',
  say: 'A user asks for a goodbye message when they sign out. The request lands on the board as a Signal labelled signal:feedback.' });
const triage = (t) => ({ t, who: [['agent', 'plan/triage']], label: 'Triage', col: 'Backlog', add: ['feature', 'Default'], art: 'triage',
  say: 'plan/triage reads the signal as data: it is real and wanted. It accepts it into Backlog as a feature with Priority Default.' });
const shape = (t) => ({ t, who: [['agent', 'plan/shape']], label: 'Shape', col: 'Ready', add: ['XS', 'Fast'], art: 'shape',
  say: 'plan/shape writes three acceptance criteria, each with the proof that will show it done, and sets Size XS and Lane Fast. The ticket is Ready.' });
const build = (t) => ({ t, who: [['agent', 'build']], label: 'Build', col: 'In progress', commit: COMMITS, art: 'branch',
  say: 'build claims the ticket and starts a change line named after it. It commits the failing test first, then the code.' });
const draft = (t) => ({ t, who: [['agent', 'build']], label: 'Draft CR', col: 'In review', ck: allRun, set: { cr: 'draft' }, art: 'cr',
  say: 'It opens draft change request #3 and moves the ticket to In review. CI starts on the new head.' });
const ci = (human = C.fast) => ({ t: 'CI', who: [['ci', 'CI gates']], label: 'CI', ck: green(human), art: 'cr',
  say: 'Required runs the tests with no secrets: green. The new test fails on the old code, so it proves the change. The change closes one open ticket. review waits for a verdict.' });
const review = (t) => ({ t, who: [['agent', 'review/review']], label: 'Review', set: { verdict: 'PASS', finding: null }, art: 'review',
  say: 'review/review starts in a fresh context. It grades each criterion against the diff and the CI results, without running the code, and publishes Verdict PASS for this head with forge verdict.' });
const ready = (t) => ({ t, who: [['agent', 'review/review']], label: 'Land', set: { cr: 'ready' }, art: 'cr',
  say: 'review/review marks the change ready and calls forge land: it waits for the required checks, then turns on auto-merge.' });
const merge = () => ({ t: 'CI', who: [['ci', 'CI gates']], label: 'Merge', ck: { review: C.revPass }, set: { cr: 'merged' }, art: 'cr',
  say: 'The review status turns green for this head, from the report. All six checks are green: the change merges.' });
const done = () => ({ t: 'CI', who: [['ci', 'merged gate']], label: 'Done', col: 'Done', set: { shipped: 'Not shipped' }, art: 'ticket',
  say: 'The merged gate moves the ticket to Done and sets Shipped to Not shipped. Done is final.' });
const staging = () => ({ t: 'Deploy', who: [['world', 'staging deploy'], ['ci', 'shipped gate']], label: 'Staging', set: { shipped: 'On staging' }, art: 'ticket',
  say: 'The staging deploy job reports to the shipped gate, which sets Shipped to On staging.' });
const prod = () => ({ t: 'Deploy', who: [['world', 'production deploy'], ['ci', 'shipped gate']], label: 'Production', set: { shipped: 'On production' }, art: 'ticket',
  say: 'The production deploy reports too: Shipped becomes On production. The ticket’s journey is over.' });
const c1 = 'Cycle 1 · 09:00', c2 = 'Cycle 2 · 10:00', c3 = 'Cycle 3 · 11:00', c4 = 'Cycle 4 · 12:00';
const upToCi = () => [signal(), triage(c1), shape(c1), build(c1), draft(c1), ci()];

const SCENARIOS = [
  ['happy', 'Happy path', [...upToCi(), review(c2), ready(c2), merge(), done(), staging(), prod()]],
  ['bug', 'Review finds a bug', [...upToCi(),
    { ...review(c2), set: { verdict: 'REMEDIATION REQUIRED', finding: 'Criterion 2 not met: with no name the message reads “Goodbye, undefined.”' }, ck: { review: C.revFail },
      say: 'review/review grades the criteria against the diff and CI: criterion 2 is not met. It publishes Verdict REMEDIATION REQUIRED, with one finding. The change request stays a draft; nothing merges.' },
    { t: c3, who: [['agent', 'sdlc'], ['agent', 'build']], label: 'Rework', col: 'In progress', art: 'review',
      say: 'The next cycle reads forge queue: change request #3 has action rework. build reads the finding and sends the ticket back to In progress.' },
    { t: c3, who: [['agent', 'build']], label: 'Fix', col: 'In review', commit: [['c95e017', 'fix: no name, no comma', 'answers the finding']], art: 'branch',
      say: 'build fixes the finding on the same branch, test first, and pushes. The ticket returns to In review.' },
    { ...ci(), ck: { ...green(C.fast), review: C.revNew }, label: 'CI again',
      say: 'CI runs again on the new head: Required, proofs-on-base and ticket-linkage are green again. The old verdict does not count for a new head.' },
    { ...review(c4), set: { verdict: 'PASS', finding: null, cr: 'ready' }, say: 'The queue asks for a review of the new head. review/review grades it in a fresh context: every criterion is DONE, Verdict PASS. It marks the change ready and lands it.' },
    merge(), done()]],
  ['red', 'Red CI', [...upToCi(), review(c2), ready(c2),
    { t: 'CI', who: [['ci', 'CI gates']], label: 'Red', ck: { Required: C.red, review: C.revNew }, art: 'cr',
      say: 'The trunk moved, so the queue says sync: the change is brought up to date and CI runs on the new head. The review status does not carry over to a new head. Required goes red: a test fails. A red required check blocks the merge.' },
    { t: c3, who: [['agent', 'sdlc'], ['agent', 'build']], label: 'Rework', col: 'In progress', set: { cr: 'draft' }, art: 'cr',
      say: 'forge queue says rework: a required check is red. build reads the failed run; the cause is in the change, so it posts a note naming it, returns the change request to draft and the ticket to In progress. A cause outside the change would become a new Signal instead.' },
    { t: c3, who: [['agent', 'build']], label: 'Fix', col: 'In review', commit: [['e2b7f40', 'fix: goodbye after the trunk sync', 'makes Required green']], art: 'branch',
      say: 'build fixes the test failure on the same branch and pushes. The ticket returns to In review.' },
    { ...ci(), ck: { ...green(C.fast), review: C.revNew }, label: 'CI again', say: 'CI runs on the new head: every check is green again, and the queue asks for a verdict on this head.' },
    { ...review(c4), set: { verdict: 'PASS', finding: null, cr: 'ready' }, say: 'review/review grades the new head in a fresh context: Verdict PASS. It marks the change ready again and lands it.' },
    merge(), done()]],
  ['hold', 'Needs a human', [signal(), triage(c1),
    { t: c1, who: [['agent', 'plan/shape'], ['agent', 'escalate']], label: 'Hold', set: { hold: true }, art: 'hold',
      say: 'plan/shape is not sure it may decide criterion 2: may the goodbye show the user’s name? escalate finds no source that settles it and holds the ticket: board hold adds needs-human and posts one ask. The status stays Backlog.' },
    { t: c2, who: [['agent', 'sdlc']], label: 'Skipped', skip: true, art: 'hold', cap: 'Cycle 2: the cycle reads the board and skips every ticket that carries needs-human.',
      say: 'The next cycle reads the board, sees needs-human and skips the ticket. Other work goes on.' },
    { t: 'Any time', who: [['you', 'You']], label: 'You reply', set: { reply: true }, art: 'hold',
      say: 'You reply in a comment: first name only. Your reply counts because you are in owners. You need no label rights.' },
    { t: c3, who: [['agent', 'sdlc']], label: 'Unhold', set: { hold: false }, art: 'hold',
      say: 'The next cycle reads board holds: your trusted reply is there, so board release removes needs-human. The hold is over.' },
    { ...shape(c3), say: 'plan/shape continues with your ruling in criterion 2 and sets Size XS and Lane Fast. The ticket is Ready; from here it runs as in the happy path.' }]],
  ['full', 'Full lane', [signal(), triage(c1),
    { ...shape(c1), add: ['XS', 'Full'], set: { lane: 'Full', spec: true },
      say: 'Sign-out lives under auth/, a path listed in paths.lane_areas, so plan/shape sets Lane Full and writes a spec next to the three criteria. Size XS.' },
    build(c1), { ...draft(c1), set: { cr: 'draft', cls: 'product-full' } },
    { ...ci(C.humWait), say: 'Required, proofs-on-base and ticket-linkage pass. human-approval waits: a product-full change needs a person.' },
    { ...review(c2), set: { verdict: 'PASS', finding: null, cr: 'ready' }, ck: { review: C.revPass }, say: 'review/review grades each criterion in a fresh context: Verdict PASS. It marks the change ready. The review status turns green; five checks are green.' },
    { t: c2, who: [['agent', 'review/review'], ['agent', 'escalate']], label: 'Ask', set: { hold: true }, art: 'cr',
      say: 'forge land finds only human-approval missing and reports who must approve. escalate holds the ticket with one ask to that person. Nothing merges.' },
    { t: 'Any time', who: [['you', 'A product owner']], label: 'Approve', art: 'cr',
      say: 'A person who may approve approves the head of #3 and replies on the ticket.' },
    { t: 'CI', who: [['ci', 'CI gates']], label: 'Green', ck: { 'human-approval': C.humPass }, art: 'cr',
      say: 'human-approval finds the approval on this head and passes. All six checks are green.' },
    { t: c3, who: [['agent', 'sdlc']], label: 'Merge', set: { hold: false, cr: 'merged' }, art: 'cr',
      say: 'The next cycle releases the hold. forge queue says land; forge land sees every check green and the change merges.' },
    done()]],
  ['deploy', 'Deploy fails', [...upToCi(), review(c2), ready(c2), merge(), done(), staging(),
    { t: 'Deploy', who: [['world', 'production deploy'], ['ci', 'shipped gate']], label: 'Deploy fails', focus: 'Signals', set: { shipped: 'On staging', sig2: true }, art: 'signal2',
      say: 'The production deploy fails. The shipped gate keeps Shipped at the last good environment, On staging, and opens Signal #4 with the evidence and needs-human. Ticket #2 stays Done: a later failure never reopens it. #4 waits on hold for you; after an owner replies, plan/triage turns it into a new ticket with a regression case.' }]],
];

function stateAt(steps, i) {
  const s = { col: 'Signals', tags: [], hold: false, cr: null, cls: 'product-fast', lane: 'Fast', spec: false, ck: {}, commits: [], verdict: null, finding: null, shipped: null, reply: false, sig2: false };
  for (const st of steps.slice(0, i + 1)) {
    if (st.col) s.col = st.col;
    for (const t of st.add ?? []) if (!s.tags.includes(t)) s.tags.push(t);
    if (st.commit) s.commits = [...s.commits, ...st.commit];
    if (st.ck) s.ck = { ...s.ck, ...st.ck };
    Object.assign(s, st.set);
  }
  return s;
}
// Consecutive steps with the same tick share one tick on the clock; its caption names what runs there.
function ticks(steps) {
  const segs = [];
  steps.forEach((st, k) => { if (!segs.length || segs.at(-1).t !== st.t) segs.push({ t: st.t, steps: [] }); segs.at(-1).steps.push(st); st.seg = segs.length - 1; });
  for (const g of segs) {
    const name = g.t.split(' · ')[0], kind = g.steps[0].who[0][0];
    const skills = [...new Set(g.steps.flatMap((st) => st.who.filter((w) => w[0] === 'agent').map((w) => w[1])))];
    g.cap = g.steps.find((st) => st.cap)?.cap
      ?? (name.startsWith('Cycle') ? name + ': ' + skills.join(', then ') + (skills.length > 1 ? ': a finished step starts the next one while time is left.' : '. The scheduler starts one cycle at a time, for example every hour.')
      : g.t === 'CI' ? 'CI: runs on the forge on every push and every status change, between cycles. No agent runs it.'
      : g.t === 'Deploy' ? 'Deploy: your deploy jobs run after the merge and report each environment to the shipped gate.'
      : kind === 'you' ? 'Any time: you answer when you like; the next cycle reads your reply.'
      : 'Any time: input arrives on its own and waits on the board for the next cycle.');
  }
  return segs;
}

const tags = (list) => list.map((t) => '<span class="tag' + (t === 'needs-human' ? ' hold' : '') + '">' + esc(t) + '</span>').join('');
const comment = (by, body, you) => '<div class="jr-cm"><span class="jr-by"><i class="' + (you ? 'you' : '') + '"></i>' + by + '</span><div>' + body + '</div></div>';
const head = (kind, title) => '<div class="jr-ah"><span class="jr-kind">' + kind + '</span><b>' + title + '</b></div>';
const ART = {
  signal: (s) => head('Issue #2 · a Signal', 'Show a goodbye message')
    + comment('a user', 'When I sign out, the page just goes blank. Could it say goodbye?') + '<div class="jr-tags">' + tags(['signal:feedback']) + '</div>',
  triage: () => head('Comment on #2', 'Triage decision') + comment('factory bot · plan/triage', '<b>Accepted:</b> real and wanted. Label <code>feature</code>, Priority <code>Default</code>.'),
  shape: (s) => head('Comment on #2', 'Acceptance criteria') + comment('factory bot · plan/shape', '<ol class="jr-crit">' + CRIT.map(([c, p]) =>
    '<li><span>' + esc(c) + '</span><span class="tag jr-proof">proof: ' + p + '</span></li>').join('') + '</ol>')
    + '<div class="jr-kv"><span>Size <b>XS</b></span><span>Lane <b>' + s.lane + '</b></span>' + (s.spec ? '<span>Spec <b>written</b> · touches <code>auth/</code></span>' : '') + '</div>',
  hold: (s) => head('Comment on #2', 'Needs human')
    + comment('factory bot · escalate', '<span class="tag hold">Needs human</span> Criterion 2 needs a product ruling: may the goodbye show the user’s first name on a shared screen? Reply here; every skill skips #2 until then.')
    + (s.reply ? comment('you · owner', 'Yes, first name only.', true) : '<p class="muted jr-p">No reply yet. The ticket waits in Backlog.</p>')
    + (s.reply && !s.hold ? '<p class="muted jr-p">The cycle removed <code>needs-human</code>.</p>' : ''),
  branch: (s) => head('Change line', '<code>feature/2-show-goodbye-message</code>') + '<ol class="jr-commits">' + s.commits.map(([h, m, n]) =>
    '<li><code>' + h + '</code><span>' + esc(m) + '</span><small class="muted">' + esc(n) + '</small></li>').join('') + '</ol>'
    + '<p class="muted jr-p">The proof comes first: the test is committed before the code that makes it pass.</p>',
  cr: (s) => head('Change request #3', 'Show a goodbye message') + '<div class="jr-kv"><span class="tag">' + s.cls + '</span><span class="jr-st ' + s.cr + '">' + s.cr + '</span><span class="muted">closes #2</span></div>'
    + '<ul class="jr-checks">' + CHECKS.map((c) => { const [st, txt] = s.ck[c] ?? ['na', 'not run']; return '<li><span class="dot ' + st + '"></span><code>' + c + '</code><small>' + esc(txt) + '</small></li>'; }).join('') + '</ul>',
  review: (s) => head('Comment on CR #3', 'Review report') + comment('factory bot · review/review', '<ul class="jr-rows">' + CRIT.map(([c], k) => {
    const bad = s.finding && k === 1; return '<li><span>' + (k + 1) + '. ' + esc(c) + '</span><b class="' + (bad ? 'jr-bad' : 'jr-ok') + '">' + (bad ? 'NOT MET' : 'DONE') + '</b></li>'; }).join('') + '</ul>'
    + '<p class="jr-verdict ' + (s.finding ? 'jr-bad' : 'jr-ok') + '">Verdict: ' + s.verdict + '</p>' + (s.finding ? '<p class="jr-find">' + esc(s.finding) + '</p>' : '')),
  ticket: (s) => head('Ticket #2', 'Fields') + '<dl class="jr-fields"><dt>Status</dt><dd>' + s.col + '</dd><dt>Lane</dt><dd>' + s.lane + '</dd><dt>Change request</dt><dd>#3 · ' + s.cr + '</dd><dt>Shipped</dt><dd><b>' + esc(s.shipped ?? '—') + '</b></dd></dl>',
  signal2: (s) => head('Issue #4 · a new Signal', 'Production deploy failed') + comment('factory bot · shipped gate', 'The production deploy of the merge of #3 failed its health check on <code>/signout</code> (HTTP 500). Ticket #2 is back at its last good environment: On staging. Evidence: the deploy run log.')
    + '<div class="jr-tags">' + tags(['signal:deploy', 'env:production', 'needs-human']) + '</div><p class="muted jr-p">Ticket #2 stays Done. It waits on hold for you; after an owner replies, plan/triage turns #4 into a new ticket with a regression case.</p>',
};

  card2.className = 'jr-card new';
  card2.innerHTML = '<span class="jr-id">#4</span><b>Production deploy failed</b><span class="jr-tags">' + tags(['signal:deploy', 'env:production', 'needs-human']) + '</span>';
  const cell = (c) => el.querySelector('[data-col="' + c + '"] .jr-cell');
  let sc = 0, steps = SCENARIOS[0][2], segs = ticks(steps), i = 0, timer = null;

  function load(n) {
    sc = n; steps = SCENARIOS[n][2]; segs = ticks(steps); i = 0;
    $('.jr-steps', el).innerHTML = steps.map((st, k) => '<li><button class="jr-chip" type="button" data-step="' + k + '"><b>' + (k + 1) + '</b>' + esc(st.label) + '</button></li>').join('');
    $('.jr-ticks', el).innerHTML = segs.map((g) => '<li><span class="jr-tick">' + esc(g.t) + '</span></li>').join('');

      if (dx || dy) card.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.7,.2,1)' });
    }
    const focus = st.focus ?? s.col;
    el.querySelectorAll('.jr-col').forEach((c) => c.classList.toggle('on', c.dataset.col === focus));
    el.querySelectorAll('.jr-tick').forEach((t, k) => { t.classList.toggle('on', k === st.seg); t.classList.toggle('past', k < st.seg); });
    $('.jr-cap', el).textContent = segs[st.seg].cap;
    $('.jr-now', el).innerHTML = '<span class="jr-meta">Step ' + (i + 1) + ' of ' + steps.length + ' · ' + esc(st.t) + '</span>'
      + '<div class="jr-who">' + st.who.map(([k, n]) => '<span class="actor ' + k + '">' + esc(n) + '</span>').join('<span aria-hidden="true">→</span>') + '</div>'
      + '<p>' + esc(st.say) + '</p>';

    // A button that turns disabled while focused would drop focus to the page: hand it to the other one first.
    if (i === 0 && document.activeElement === prevB) nextB.focus({ preventScroll: true });
    if (i === steps.length - 1 && document.activeElement === nextB) prevB.focus({ preventScroll: true });
    prevB.disabled = i === 0;
    nextB.disabled = i === steps.length - 1;
  }
  const go = (n) => { const m = Math.max(0, Math.min(steps.length - 1, n)); if (m !== i) { i = m; render(); } };
  function stop() { clearInterval(timer); timer = null; const p = $('[data-play]', el); p.textContent = 'Play'; p.setAttribute('aria-pressed', 'false'); }

  const outside = (e) => { if (!el.isConnected) return document.removeEventListener('pointerdown', outside, true); if (timer && !e.target.closest?.('[data-play]')) stop(); };
  document.addEventListener('pointerdown', outside, true);
  el.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]'), k = e.target.closest('[data-step]');
    if (g) { stop(); go(i + Number(g.dataset.go)); }

    if (e.target.closest('[data-play]')) { if (timer) stop(); else play(); }

    if (e.target.matches('input') || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    e.preventDefault(); stop(); go(i + (e.key === 'ArrowRight' ? 1 : -1));
  });
  load(0);
};

function glossaryTerms(root) {

  const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    const m = re.exec(n.nodeValue);
    if (!m) continue;
    const g = left.get(m[1].toLowerCase());
    if (!g) continue;
    left.delete(m[1].toLowerCase());

      + '<p class="source">Source: <a href="' + blob + c.file + '">' + c.file + '</a></p>';
    const heads = [...main.querySelectorAll('.prose h2')];
    for (const h of heads) h.id = slug(h.textContent);
    otp.innerHTML = heads.length ? '<b>On this page</b>' + heads.map((h) => '<a href="#' + h.id + '" data-to="' + h.id + '">' + esc(h.textContent) + '</a>').join('') : '';
    if (!c.id.endsWith('glossary')) glossaryTerms($('.prose', main));
  }
  for (const el of main.querySelectorAll('[data-viz]')) {
    const f = VIZ[el.dataset.viz];
    if (f) { try { f(el); } catch (e) { el.textContent = 'This part did not load: ' + e.message; } }
  }
  for (const p of main.querySelectorAll('pre.mermaid')) p.dataset.src = p.textContent;
  await drawDiagrams();
  scrollTo(0, 0);
}
// Diagrams take their colours from the tokens at render time, so a theme change redraws only them from the kept source.
// Runs are queued, so a theme change during a page change never draws into a replaced page.
let drawing = Promise.resolve();
function drawDiagrams() {
  return (drawing = drawing.then(async () => {
    const nodes = main.querySelectorAll('pre.mermaid');
    for (const p of nodes) { p.removeAttribute('data-processed'); p.textContent = p.dataset.src; }
    initMermaid();
    await mermaid.run({ nodes, suppressErrors: true });
  }).catch(() => {}));
}
otp.addEventListener('click', (e) => { const a = e.target.closest('[data-to]'); if (a) { e.preventDefault(); document.getElementById(a.dataset.to)?.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); } });
addEventListener('popstate', () => show());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawDiagrams);
new MutationObserver(drawDiagrams).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
// The theme button cycles System, Light, Dark; the choice is remembered in this browser only.
const THEMES = ['system', 'light', 'dark'], LABEL = { system: '◐ System', light: '☀ Light', dark: '☾ Dark' };
const themeBtn = $('#theme');
let theme = 'system';
try { theme = localStorage.getItem('guide-theme') || 'system'; } catch {}
if (!THEMES.includes(theme)) theme = 'system';
function setTheme(t, save) {
  if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  themeBtn.textContent = LABEL[t];
  themeBtn.setAttribute('aria-label', 'Colour theme: ' + t + '. Change');
  if (save) { try { localStorage.setItem('guide-theme', t); } catch {} }
}
setTheme(theme, false);
themeBtn.addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; setTheme(theme, true); });
show();
</script>
