  --pass: #5fd08a; --pend: #f0b25a; --fail: #f17a7a; --idle: #6f7786; color-scheme: dark; } }
:root[data-theme="dark"] {

  --accent: #8ea2ff; --accent-ink: #0f1217; --accent-soft: #232b4d;
  --you: #f0b25a; --you-soft: #3a2c17; --agent: #8ea2ff; --agent-soft: #232b4d; --ci: #5fd08a; --ci-soft: #183526;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--font); }

a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.diagram pre.mermaid { background: none; padding: 0; margin: 0; }
.diagram svg { max-width: 100%; height: auto; }

/* Setup chooser */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.q { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }

.out h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.cmd pre { margin: 0; background: var(--well); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }

/* Home */

.card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); text-decoration: none; color: var(--ink); }

  .rail ol { display: none; }

}

<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.esm.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs';

const GUIDE = {"chapters":[{"id":"1-what-it-is","file":"docs/guide/1-what-it-is.md","title":"1. What it is","lead":"agentic-sdlc runs software delivery with agents. You put work on a board. A scheduled agent run, the cycle, moves each ticket one step: it shapes the ticket, builds it, reviews it and merges it. CI gates decide what may merge, and no agent can skip them. You act only when the factory asks you, or when you want to steer it.","md":"# 1. What it is\n\nagentic-sdlc runs software delivery with agents. You put work on a board. A scheduled agent run,\nthe **cycle**, moves each ticket one step: it shapes the ticket, builds it, reviews it and merges it.\nCI **gates** decide what may merge, and no agent can skip them. You act only when the factory asks\nyou, or when you want to steer it.\n\n```mermaid\nflowchart TD\n  you([\"You\"]):::you -->|\"ideas, priorities,<br/>answers\"| board[(\"Board\")]:::board\n  board --> cycle[\"Cycle<br/>(scheduled agents)\"]:::agent\n  cycle -->|\"draft change request\"| forge[\"GitHub<br/>pull request\"]:::board\n  forge --> gates[\"CI gates\"]:::ci\n  gates -->|\"merge\"| trunk[(\"Trunk\")]:::board\n  gates -->|\"ticket Done\"| board\n  cycle -.->|\"asks when it must\"| you\n  classDef you fill:#fde68a,stroke:#b45309,color:#111\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n## Three layers\n\n| Layer | Where | Holds |\n|---|---|---|\n| Skills | the plugin (Claude) or `.agents/skills/` | The process: every rule. The same for every project. |\n| Binding | `.agents/binding.yml` | Your project's values: board, owners, commands, environments, models. |\n| CLI | `agentic-sdlc` (and its MCP server) | The mechanism: board, forge and Git verbs, the gates, dispatch, the run ledger. |\n\nA project changes only its binding. A skill never calls a vendor tool: it calls the CLI.\n\n## Eleven skills\n\nSeven run in every project. Four run only when the binding asks for them.\n\n| Stage | Skill | Does | Runs |\n|---|---|---|---|\n| Navigate | `sdlc` | Runs one cycle: routes each ticket to the next skill. | always |\n| Intake | `triage-signal` | Turns one raw signal into Backlog, Ideas or Cancelled. | always |\n| Intake | `backlog-grooming` | Sets Priority, merges duplicates, groups work. | always |\n| Plan | `shape` | Takes a Backlog ticket to Ready: size, criteria with proof, lane, spec. | always |\n| Build | `implement-spec` | Writes the proof first, then the code, then opens a draft change request. | always |\n| Check | `review-pr` | Reviews the change request against its ticket and CI, then merges or sends it back. | always |\n| Check | `verify-ux` | Uses the running change as a user for `computer-use` criteria. Apart from `review-pr` because it runs the change's code. | a criterion names `computer-use` |\n| Ship | `release` | Chooses what ships, sets the version, cuts the release line. | release-line delivery |\n| People | `escalate-to-human` | Decides whether a person must act; holds the ticket with one question. | always |\n| Learn | `judge-run` | Grades each finished run. | `learning.enabled` |\n| Learn | `improve-factory` | Proposes one factory change, with proof. | `learning.enabled` |\n\n## Words\n\n| Word | Means |\n|---|---|\n| Ticket | One item on the board. Its **status** says where it stands. |\n| Change request (CR) | A pull request. A **change line** is its short-lived branch. |\n| Lane | Fast (small, low risk: merges on the agent review) or Full (also needs a human approval). |\n| Proof | How a criterion is shown done: a test, an eval, a visual check, a data check, `computer-use` or `manual`. |\n| Gate | A CI job that posts a required check. Agents cannot skip it. |\n| Hold | The `needs-human` label: every skill skips the ticket until a person answers. |\n| Heartbeat | One comment per cycle on the heartbeat ticket: what ran and what failed. |\n\nNext: [2. Choose your setup](#2-choose).\n"},{"id":"2-choose","file":"docs/guide/2-choose.md","title":"2. Choose your setup","lead":"Make four decisions before you install. Each one is a binding value or an init flag, so you can change it later.","md":"# 2. Choose your setup\n\nMake four decisions before you install. Each one is a binding value or an `init` flag, so you can\nchange it later.\n\n<!-- viz: setup -->\n```mermaid\nflowchart LR\n  p[\"1. Who pays<br/>for the agents?\"]:::q --> i[\"2. One forge identity<br/>or two?\"]:::q\n  i --> r[\"3. One repo per board,<br/>or many?\"]:::q\n  r --> w[\"4. Where does<br/>the cycle run?\"]:::q\n  classDef q fill:#c7d2fe,stroke:#4f46e5,color:#111\n```\n\n## 1. Who pays: the profile\n\n| `profile` | Pick it when | Agents run on | Identities |\n|---|---|---|---|\n| `individual` | One person or a small team on agent subscriptions. | Subscriptions only. No API key. | One (default) |\n| `individual-api` | As individual, plus some stages on managed agents or bots. | Subscriptions, plus API keys for those stages. | One (default), or two |\n| `organization` | A team that pays per use and wants runs owned by service accounts. | API keys and managed agents. | Two (required) |\n\nSet it with `init --profile <p>`. The runner refuses `ANTHROPIC_API_KEY` under both individual\nprofiles, because that key would bill the cycle to the API.\n\n## 2. One forge identity or two\n\n`forge.review_identity` decides it.\n\n| | One identity (default for individual) | Two identities (required for organization) |\n|---|---|---|\n| Accounts | Yours. On a Claude cloud routine, the routine's GitHub login. | An implementer account and a separate review app. |\n| Who reviews | `review-pr` in the cycle, as a fresh subagent. | `review-pr` in a separate review run that holds the review token. |\n| Review status | CI posts it from the review report. | The review app posts it, and approves the change. |\n| Human approval of a Full-lane change | A collaborator approves it, or you merge it as admin. | A human approves the head. |\n| What it proves | The review is a separate agent context. | No implementer can approve its own change. |\n\n## 3. One repo or many\n\n| Setup | Board | Binding |\n|---|---|---|\n| One repo | The repo's issues (`github-issues`), or its own Jira project, Linear team or GitHub Project. | Nothing extra. |\n| Many repos, one GitHub Project | One Project. | Each repo sets its own `board.options.repo`. |\n| Many repos, one Jira project, Linear team or hub repo | One shared board. | Each repo sets `board.scope.label: repo:<name>`. One repo sets `home: true` and lists every label in `repos`; it triages new work to a repo. |\n\nEvery repo has its own install, binding, cycle and pinned version.\n\n## 4. Where the cycle runs\n\n| Runtime | Pick it when | Limits |\n|---|---|---|\n| Claude cloud routine | You want no machine of your own; subscription usage. | Board: `github-issues`, Jira or Linear (not a GitHub Project). No Docker: `commands.verify` runs in CI. At most hourly. |\n| GitHub Actions | Any board, a GitHub Project included. | A subscription token or an API key in a secret. |\n| Your own machine | Code, tools or a network only your machine reaches. | No sandbox: opt in with `sandbox: local` and `AGENTIC_SDLC_LOCAL=1`. The machine must be on. |\n| Managed agents | `individual-api` or `organization`. | API billing. |\n\nThe templates are in [`templates/runner/`](https://github.com/dmitriywind/agentic-sdlc/blob/master/templates/runner/routine.md). Gates run in CI\nwhatever the runtime.\n\n## Who owns what\n\n| Team shape | `owners` | `forge.human_approval` | Notes |\n|---|---|---|---|\n| Solo | You are product, factory and bot. | `full-lane` | One identity: you merge Full-lane changes as admin. |\n| Small team | Product: the lead. Factory: a second engineer. | `full-lane` | A second person approves Full-lane changes. |\n| Organization | Product: a product role. Factory: a platform team. | `always` | Two identities; a human approves every product change. |\n| Non-developer owner | Product: the owner. Factory: a technical steward. | `full-lane` or `always` | The owner acts only through board comments and Idea moves. |\n\n## What your product ships\n\nThe skills are the same for every product. The binding says what an environment and a proof are.\n\n| Product | `product.environments` | `product.delivery` | Typical proofs |\n|---|---|---|---|\n| Web service, continuous | `[staging, production]` | continuous | test, visual, computer-use |\n| Web product with approved releases | `[staging, production]` | release-line | test, visual, computer-use |\n| Mobile app | `[internal, beta, store]` | release-line | test, visual, manual |\n| Library or package | `[registry]` | continuous | test |\n| Data pipeline or ML model | `[staging, production]` | continuous | eval, data-check |\n| Docs or content site | `[production]` | continuous | visual, manual |\n\nNext: [3. Install](#3-install).\n"},{"id":"3-install","file":"docs/guide/3-install.md","title":"3. Install","lead":"The local board is a file, .agents/board.json. No board account and no forge are needed.","md":"# 3. Install\n\n```mermaid\nflowchart TD\n  a[\"1. Install<br/>the CLI\"]:::you --> b[\"2. init\"]:::you --> c[\"3. Fill in<br/>the binding\"]:::you --> d[\"4. doctor\"]:::you\n  d --> e[\"5. One cycle<br/>by hand\"]:::agent --> f[\"6. Schedule<br/>the cycle\"]:::agent\n  classDef you fill:#fde68a,stroke:#b45309,color:#111\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n```\n\n## Try it first, with no accounts\n\nThe `local` board is a file, `.agents/board.json`. No board account and no forge are needed.\n\n```bash\nmkdir try-agentic && cd try-agentic && git init -b main && npm init -y\nnpm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v2.0.0-alpha.5\nnpx --no agentic-sdlc init --board local --forge github --harness generic\nprintf 'Show a greeting on the home page.\\n' > body.md\nnpx --no agentic-sdlc board create --title \"Greeting\" --body-file body.md --status Backlog\nnpx --no agentic-sdlc dispatch shape --ticket 2\n```\n\n`dispatch` prints the instruction your agent would follow and starts nothing. Open the folder in\nyour agent and ask it to run the `sdlc` skill for one cycle.\n\n## Install on a real repo\n\n1. Install the CLI as a devDependency, pinned to a tag:\n   `npm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v2.0.0-alpha.5`.\n   It installs from Git only. Warning: the npm package `agentic-sdlc` is a different project.\n2. Run `init` with your choices from [chapter 2](#2-choose), for example:\n   `npx --no agentic-sdlc init --profile individual --harness claude --board github-issues`.\n   For a Claude cloud routine, add `--no-plugin`: a cloud session loads `.claude/skills/`, not plugins.\n3. Fill in `.agents/binding.yml`. The file documents every key. Set at least the owners,\n   `commands.*`, `product.environments`, `product.delivery` and `models`.\n4. Write the two docs the skills judge every ticket against: `paths.importance_doc` (what matters)\n   and `paths.guiding_narrative` (where the product goes). Without them, product questions become holds.\n5. Run `npx --no agentic-sdlc doctor` until every port is ok. Import `.github/rulesets/trunk.json` in the\n   repo settings. A private repo on GitHub Free cannot enforce a ruleset; `doctor` warns about it.\n6. Create the heartbeat ticket on the board and put its id in `heartbeat.ticket`.\n7. Put two or three real tickets in Backlog. Run one cycle by hand and read every comment it writes.\n   Repeat until three cycles in a row need no correction.\n8. Schedule the cycle from [`templates/runner/`](https://github.com/dmitriywind/agentic-sdlc/blob/master/templates/runner/routine.md), and the\n   dead-man check (`agentic-sdlc ledger stale --max-hours <h>`).\n\nDone when a scheduled cycle writes a heartbeat with no `errors` and a change request merges through the gates.\n\n`init` flags: `--profile`, `--harness` (`claude`, `codex`, `cursor`, `generic`), `--board`\n(`github`, `github-issues`, `jira`, `linear`, `local`), `--forge github`, `--vcs git`, `--force`\n(overwrite files `init` keeps; it also overwrites the binding), `--no-plugin`. The init log lists\nevery file it wrote. The per-harness setup is in [docs/ecosystems/](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/claude-code.md).\n\n## Claude Code plugin\n\nFor Claude Code the skills, the guard hook and the MCP server ship as a plugin, named\n`/agentic-sdlc:<skill>`:\n\n```text\n/plugin marketplace add dmitriywind/agentic-sdlc\n/plugin install agentic-sdlc@agentic-sdlc\n```\n\nA scheduled run loads the repo's pinned copy instead: `claude --plugin-dir ./node_modules/agentic-sdlc`.\n\n## Upgrade\n\n1. Read `git log v<yours>..v<new>` and the contract diff.\n2. Run `npm uninstall agentic-sdlc`, then the `npm i` line with the new tag. npm 12 refuses to change\n   a Git dependency in place (`EALLOWGIT`).\n3. Run `init` again without `--force`. It keeps your files and logs what it skipped.\n4. Run `validate` and `doctor`, then one cycle by hand.\n\n## Move from a hand-made process\n\n1. List what the old process does that the skills do not. Each item becomes a binding value, a doc\n   that `paths.importance_doc` points to, or a gap to report upstream.\n2. Copy the old values into the binding.\n3. Delete the old copies of the skills. A project replaces the binding, never the skills.\n\n## Recommended around the factory\n\nThe factory enforces only its gates and the binding. These help it:\n\n- Repo: trunk rulesets as code, secret scanning with push protection, Actions and dependencies\n  pinned by digest, signed release tags, a `SECURITY.md` with a contact.\n- Board: work-in-progress limits on In progress and In review, a view of held tickets\n  (`needs-human`), an aging view, and a time limit for triaging Signals.\n- Operations: service-level objectives with an error budget, release evidence (`product.evidence`:\n  SBOM, provenance, signatures; enforced by the release ready check), blameless postmortems whose\n  actions return to the Backlog.\n\nNext: [4. A ticket's journey](#4-a-ticket).\n"},{"id":"4-a-ticket","file":"docs/guide/4-a-ticket.md","title":"4. A ticket's journey","lead":"Follow one ticket from a thought to production. Each box is a board status. Each arrow names the skill or gate that moves the ticket.","md":"# 4. A ticket's journey\n\nFollow one ticket from a thought to production. Each box is a board status. Each arrow names the\nskill or gate that moves the ticket.\n\n<!-- viz: journey -->\n```mermaid\nflowchart TD\n  sig[\"Signals\"]:::board -->|\"triage-signal\"| bl[\"Backlog\"]:::board\n  idea[\"Ideas\"]:::you -->|\"you move it\"| bl\n  bl -->|\"shape\"| rd[\"Ready\"]:::board\n  rd -->|\"implement-spec\"| ip[\"In progress\"]:::board\n  ip -->|\"implement-spec:<br/>draft CR\"| ir[\"In review\"]:::board\n  ir -->|\"review-pr + gates:<br/>merge\"| dn[\"Done\"]:::ci\n  dn -->|\"deploys report\"| sh[\"Shipped<br/>(a field)\"]:::ci\n  classDef you fill:#fde68a,stroke:#b45309,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n```\n\n| Status | What happens | Who acts | What you see |\n|---|---|---|---|\n| Ideas | A thought you park. Skills never touch it. | You | Your note. |\n| Signals | Raw input: an alert, feedback, a red CI run, a scanner finding. | `triage-signal` | A decision comment: accepted, parked or rejected, with the reason. |\n| Backlog | Accepted work. `backlog-grooming` sets a Priority and merges duplicates. | `backlog-grooming` | A Priority, sometimes children under an initiative. |\n| Ready | `shape` wrote acceptance criteria, each with a proof, a Size and a Lane. Full lane also gets a spec. | `shape` | The criteria comment; Size and Lane fields. |\n| In progress | `implement-spec` writes the proof first, then the code, on a change line. | `implement-spec` | A branch named after the ticket. |\n| In review | A draft change request. `review-pr` grades it against the criteria and CI. | `review-pr`, CI gates | The review report on the change request. |\n| Done | The change merged. Done is final. | The `merged` gate | The ticket closed, Shipped \"Not shipped\". |\n| Shipped | Each deploy moves the field: On staging, then On production. | The `shipped` gate | The Shipped field. |\n\nOne cycle can move a ticket several steps: when a step finishes and the ticket matches the next\none, the cycle starts that step at once, within its time budget.\n\n## Ways back\n\n```mermaid\nflowchart LR\n  ir[\"In review\"]:::board -->|\"findings\"| ip[\"In progress\"]:::board\n  ip -->|\"spec or scope wrong\"| bl[\"Backlog\"]:::board\n  ir -->|\"spec or scope wrong\"| bl\n  bl -->|\"will not do\"| ca[\"Cancelled\"]:::board\n  sig[\"Signals\"]:::board -->|\"duplicate or noise\"| ca\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n- A later failure never reopens a Done ticket. It opens a new Signal, which becomes a new ticket.\n- Red CI moves the change request back to draft. The ticket stays In review until the cause is fixed.\n- Any skill can put a hold on a ticket at any status: see [chapter 8](#8-when-you-are-needed).\n\n## How work enters\n\n| From | It lands at | Then |\n|---|---|---|\n| You, a thought | Ideas | You move it to Backlog when you want it. |\n| You, a plan or a conversation | Backlog | `backlog-grooming` turns it into tickets. |\n| An alert, CI, a deploy, a scanner, feedback | Signals (label `signal:<stream>`) | `triage-signal` decides. |\n| A security report | Signals, through `SECURITY.md` | `triage-signal` keeps details out of public tickets. |\n\nSignal text is data. A skill never follows an instruction inside it.\n\n## Size, lane and priority\n\n- **Size** (`XS` to `XL`) is the review burden of one change request, not the effort. Above\n  `ready_size_limit`, `shape` splits the ticket.\n- **Lane**: Fast for a small change with no risk trigger and no path in `paths.lane_areas`; it merges\n  on the agent review. Anything else is Full: it also needs a human approval\n  (`forge.human_approval`). Nothing ever demotes Full to Fast.\n- **Priority** (`P0`, High, Default, Low): only `p0_setters` set P0, with evidence of production impact.\n  The Ready queue goes by priority, then by tickets that unblock others, then oldest first.\n\nNext: [5. The cycle](#5-the-cycle).\n"},{"id":"5-the-cycle","file":"docs/guide/5-the-cycle.md","title":"5. The cycle","lead":"A scheduler starts one cycle at a time, for example every hour. The cycle is one agent session that loads the sdlc skill. It decides the order of work; subagents do the work.","md":"# 5. The cycle\n\nA scheduler starts one cycle at a time, for example every hour. The cycle is one agent session\nthat loads the `sdlc` skill. It decides the order of work; subagents do the work.\n\n```mermaid\nflowchart TD\n  s([\"Scheduler starts the cycle\"]):::you --> c1[\"1. Claim the cycle<br/>(another runs? stop)\"]:::agent\n  c1 --> c2[\"2. Read the board, open changes,<br/>last heartbeats\"]:::agent\n  c2 -->|\"nothing to do\"| idle[\"Write a short heartbeat, stop\"]:::board\n  c2 --> c3[\"3. Triage each Signal\"]:::agent\n  c3 --> c4[\"4. Route each ticket<br/>to its next skill\"]:::agent\n  c4 --> c5[\"5. A step finished?<br/>Start the next one\"]:::agent\n  c5 -->|\"time left\"| c4\n  c5 --> c6[\"6. Write the heartbeat\"]:::board\n  classDef you fill:#fde68a,stroke:#b45309,color:#111\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n## Route: the order\n\n1. Release requests, and P0 fixes that are ready to release.\n2. Change requests a person opened (hand-offs).\n3. Tickets In progress (rework, or work that stopped).\n4. Ready tickets, from the top, at most `cycle.max_implementations` new ones.\n5. Backlog: grooming for tickets with no Priority, then shaping while fewer than `cycle.min_ready` are Ready.\n6. Change requests that need a review (with one identity; with two, a separate review run does it).\n\nThe full routing table is in [`skills/sdlc/SKILL.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/skills/sdlc/SKILL.md). With learning on,\nthe cycle also grades the last runs and, every `learning.every_cycles` cycles, proposes one factory\nchange ([chapter 9](#9-learning)).\n\n## Rules that keep it safe\n\n| Rule | Why |\n|---|---|\n| One cycle at a time; a second start stops at step 1. | Two cycles never claim the same ticket. |\n| A second dispatch of the same step inside `cycle.dedupe_minutes` is skipped. | A scheduler that fires twice does no harm. |\n| Nothing new starts after `cycle.time_budget_minutes`. | The heartbeat is always written before the job times out. |\n| A failed step goes into the heartbeat's `errors`; the cycle goes on. | One failure does not stop other work. |\n| A step that failed in the last `cycle.failure_limit` heartbeats on the same trunk commit is held for a person. | No endless retries; a factory fix gives the step a fresh start. |\n\n## The heartbeat\n\nEach cycle writes one comment on the heartbeat ticket: when it ran, the trunk commit it read its\nskills from, one row per run (skill, ticket, model, outcome) and its errors. The heartbeats are the\nrun ledger: `agentic-sdlc ledger summary` reads them, and the dead-man check\n(`ledger stale --max-hours <h>`) fails when none arrived in time.\n\nNext: [6. Review and merge](#6-review-and-merge).\n"},{"id":"6-review-and-merge","file":"docs/guide/6-review-and-merge.md","title":"6. Review and merge","lead":"implement-spec opens a draft change request. From there, CI and review-pr decide whether it merges. The review never runs the change's code: CI runs it, with no secrets, and the review reads the result.","md":"# 6. Review and merge\n\n`implement-spec` opens a **draft** change request. From there, CI and `review-pr` decide whether it\nmerges. The review never runs the change's code: CI runs it, with no secrets, and the review reads the result.\n\n## With one identity (the individual default)\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant I as implement-spec\n  participant CI as CI gates\n  participant R as review-pr (cycle)\n  participant G as GitHub\n  I->>G: Open draft change request\n  G->>CI: Run tests and gates\n  CI-->>G: Required, proofs-on-base, ticket-linkage\n  R->>G: Read diff, criteria and CI results\n  R->>G: Post the review report (Verdict PASS)\n  G->>CI: review-gate reads the report\n  CI-->>G: review = success\n  R->>G: Mark ready, merge when all checks are green\n```\n\nThe factory acts as your account. GitHub refuses an approval from a change's author, so nothing\napproves: the `review` status comes from CI, built from the report. A Full-lane change waits until a\ncollaborator approves it, or until you merge it as admin.\n\n## With two identities (organization)\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant I as implement-spec\n  participant CI as CI gates\n  participant R as review-pr (review run)\n  participant H as Human owner\n  participant G as GitHub\n  I->>G: Open draft change request\n  G->>CI: Run tests and gates\n  R->>G: Review status and approval, as the review app\n  H->>G: Approve the head (Full lane only)\n  CI-->>G: human-approval = success\n  R->>G: Mark ready and auto-merge\n```\n\nThe review runs in its own scheduled run and is the only run that holds the review token. No\nimplementer can post `review` or approve its own change.\n\n## The required checks\n\n| Check | Posted by | Passes when |\n|---|---|---|\n| `Required` | CI job with no secrets | `commands.install` and `commands.verify` pass on the head. |\n| `proofs-on-base` | CI gate | Every new or changed proof fails on the merge base (it proves the change). |\n| `ticket-linkage` | CI gate | The change closes exactly one open ticket, named in its branch. |\n| `review` | `review-pr`, or CI from its report | The review verdict is PASS. |\n| `human-approval` | CI gate | The approvals its class needs are on the head (below). |\n| `skill-regression` | CI gate | A factory change keeps the skill pack valid. |\n\n| Class | Is | Needs |\n|---|---|---|\n| `product-fast` | A product change in the Fast lane. | Nothing more. |\n| `product-full` | A product change in the Full lane, or one that touches `paths.lane_areas`. | A human approval (per `forge.human_approval`). |\n| `tuning` | A factory change to the model map or a benched skill's tier. | Nothing, when `learning.auto_merge_classes` lists it; else the factory owner. |\n| `guardrail` | Any other factory change. | The factory owner. |\n\n## When review says no\n\n| Finding | Where it goes |\n|---|---|\n| A criterion not met, a bug, a security issue | The ticket goes back to In progress with the findings. |\n| The spec or scope is wrong | The change goes back to draft; the ticket goes to Backlog. |\n| A change a person opened | Back to draft with the report; the person fixes it. |\n| A red check | Back to draft. A cause in the code goes to In progress; a cause elsewhere becomes a Signal. |\n| The change is behind the trunk | It is synced and reviewed again. |\n\nGitHub specifics (rulesets, tokens, private repos on GitHub Free) are in [forges.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md).\n\nNext: [7. Shipping](#7-shipping).\n"},{"id":"7-shipping","file":"docs/guide/7-shipping.md","title":"7. Shipping","lead":"A merge makes the ticket Done and \"Not shipped\". Your deploy jobs then report each environment to the shipped gate, which moves the ticket's Shipped field. product.delivery picks one of two ways.","md":"# 7. Shipping\n\nA merge makes the ticket Done and \"Not shipped\". Your deploy jobs then report each environment\nto the `shipped` gate, which moves the ticket's **Shipped** field. `product.delivery` picks one of two ways.\n\n## Continuous: every merge ships\n\n```mermaid\nflowchart LR\n  m[\"Merge to trunk\"]:::ci --> d1[\"Deploy staging\"]:::ci --> d2[\"Deploy production\"]:::ci\n  m -.->|\"merged gate\"| t1[\"Done,<br/>Not shipped\"]:::board\n  d1 -.->|\"shipped gate\"| t2[\"On staging\"]:::board\n  d2 -.->|\"shipped gate\"| t3[\"On production\"]:::board\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n## Release line: the Product owner approves what ships\n\n```mermaid\nflowchart TD\n  req[\"Release request<br/>(a labelled ticket)\"]:::you --> rel[\"release skill:<br/>pick commit, version\"]:::agent\n  rel --> ok[\"Product owner<br/>approves\"]:::you --> cut[\"Cut the<br/>release line\"]:::ci\n  cut --> d[\"Deploy production\"]:::ci -.->|\"shipped gate\"| t[\"On production,<br/>tag created\"]:::board\n  classDef you fill:#fde68a,stroke:#b45309,color:#111\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n- You open a release request (a Backlog ticket with the `release` label). A P0 fix on the first\n  environment opens one by itself.\n- Agents never approve the last environment. On GitHub you approve the release workflow run.\n- With release evidence (`product.evidence`), the release is ready only when `commands.evidence_check` passes.\n\n## When something fails\n\n```mermaid\nflowchart LR\n  red[\"Red trunk CI,<br/>or a failed deploy\"]:::ci --> sig[\"New Signal<br/>(evidence attached)\"]:::board\n  sig -->|\"triage-signal\"| nt[\"New ticket with<br/>a regression case\"]:::board\n  red -.->|\"never reopens\"| done[\"The original ticket:<br/>stays Done\"]:::board\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n- A failed deploy moves its tickets back to the last good environment and opens one Signal.\n- A rollback reports `--result rolled-back`: tickets not in the running revision step back.\n- A failed release line is left as it is. The fix ships under the next version.\n- If the delivery run itself fails, start the delivery workflow by hand with the commit's sha: it\n  runs the `merged` gate again.\n\nNext: [8. When you are needed](#8-when-you-are-needed).\n"},{"id":"8-when-you-are-needed","file":"docs/guide/8-when-you-are-needed.md","title":"8. When you are needed","lead":"The factory asks a person only when a rule says so. Each ask is one comment that you answer on the board or on the change request.","md":"# 8. When you are needed\n\nThe factory asks a person only when a rule says so. Each ask is one comment that you answer on the\nboard or on the change request.\n\n## The hold\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant K as A skill\n  participant E as escalate-to-human\n  participant B as Board\n  participant Y as You (an owner)\n  K->>E: Not sure it may decide\n  E->>E: Check the importance doc and past answers\n  alt A source settles it\n    E-->>K: Proceed\n  else A person must decide\n    E->>B: One \"Needs human\" comment, label needs-human\n    Note over B: The status stays. Every skill skips the ticket.\n    Y->>B: Reply in a comment\n    Note over B: The next cycle removes the label and resumes.\n  end\n```\n\nA hold is a label, not a status. Your reply counts only when you are in `owners` (a trusted comment).\nYou need no label rights: the cycle removes `needs-human` after your reply.\n\nWhat makes a skill ask: an architecture or scope change, something that cannot be undone, security,\npersonal data, money, a legal duty, a sign-off, missing access or a credential, a product ruling, a\nregression, the same failure twice, or a P0.\n\n## Every ask you can get\n\n| You get | From | You do |\n|---|---|---|\n| A \"Needs human\" comment on a ticket | `escalate-to-human` | Reply in a comment. |\n| A request to approve a Full-lane change | `review-pr` | Approve the head on GitHub, or merge it as admin with one identity. |\n| A request to confirm a `manual` criterion | `review-pr` | Reply that you checked it on this head. |\n| A release ready for approval | `release` | Approve the release workflow run. |\n| A factory change of class `guardrail` | `improve-factory` | Review and approve the change as the factory owner. |\n| A question when an idea's outcome is unclear | `backlog-grooming` | Answer it, or leave the ticket in Ideas. |\n\n## Who you are\n\n| Role | Binding | Acts through |\n|---|---|---|\n| Product owner | `owners.product` | Ideas, Priority and P0, answers to holds, Full-lane and release approvals. |\n| Factory owner | `owners.factory` | The binding, the skills and the gates; approves `guardrail` factory changes. |\n| The factory | `owners.bots` | The cycle and the review run. Only these accounts' heartbeats count as state. |\n| Anyone else | | A change request like any other; the same gates apply. A Signal or `SECURITY.md` to report. |\n\nNext: [9. Learning](#9-learning).\n"},{"id":"9-learning","file":"docs/guide/9-learning.md","title":"9. Learning","lead":"Optional. Off until you set learning.enabled: true and an agent_command for the bench.","md":"# 9. Learning\n\nOptional. Off until you set `learning.enabled: true` and an `agent_command` for the bench.\n\nThe factory can improve its own skills, one proven change at a time.\n\n```mermaid\nflowchart TD\n  runs[\"Runs<br/>(heartbeats)\"]:::board --> judge[\"judge-run:<br/>grade each run\"]:::agent\n  judge --> worst[\"Worst repeated<br/>failure\"]:::agent\n  worst --> prop[\"improve-factory:<br/>one change\"]:::agent\n  prop --> bench[\"Bench: replay<br/>your merged work\"]:::ci\n  bench --> cr[\"Factory change<br/>request\"]:::ci\n  cr -->|\"review and gates\"| runs\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n1. `judge-run` grades each finished run with the scorers in `.agents/scorers/`, on a different model\n   than the run used. Your own grades always win over the judge's.\n2. Every `learning.every_cycles` cycles, `improve-factory` finds the worst failure that repeats in at\n   least `learning.min_evidence_runs` runs.\n3. It proposes exactly one change: a skill sentence, a binding value, a gate or an executor.\n4. The bench replays cases built from your merged work, with the change and without it. The change\n   must not lower the pass rate (`learning.bench_min_cases`, `bench_trials`, a Wilson lower bound).\n5. The change goes through review and the gates like any other. A `guardrail` change needs the factory\n   owner; a `tuning` change (the model map) may merge alone once a bench baseline exists.\n\nNext: [10. The parts](#10-parts).\n"},{"id":"10-parts","file":"docs/guide/10-parts.md","title":"10. The parts","lead":"How the factory is built. The normative contract is [references/architecture.md](../../references/architecture.md); this chapter only draws it.","md":"# 10. The parts\n\nHow the factory is built. The normative contract is\n[`references/architecture.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/references/architecture.md); this chapter only draws it.\n\n## Layers and ports\n\n```mermaid\nflowchart LR\n  sk[\"Skills<br/>(process)\"]:::agent --> cli[\"agentic-sdlc CLI<br/>and MCP server\"]:::ci\n  bd[\"Binding<br/>(your values)\"]:::board --> cli\n  cli -->|\"board verbs\"| b[(\"GitHub Projects, GitHub issues,<br/>Jira, Linear, local file\")]:::board\n  cli -->|\"forge verbs\"| f[(\"GitHub\")]:::board\n  cli -->|\"vcs verbs\"| g[(\"Git\")]:::board\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n  classDef board fill:#e2e8f0,stroke:#64748b,color:#111\n```\n\n- A skill calls `agentic-sdlc board|forge|vcs <verb>`, never a vendor CLI. Agents with no shell use\n  the same verbs through the MCP server.\n- The board and the forge are the only hand-off between parts. There is no other channel.\n\n## Who runs a step: executors\n\n```mermaid\nflowchart LR\n  o[\"Cycle\"]:::agent -->|\"dispatch skill, ticket\"| d{\"executors.&lt;skill&gt;.kind\"}:::ci\n  d -->|\"harness\"| h[\"Subagent of the cycle\"]:::agent\n  d -->|\"command\"| c[\"A local CLI\"]:::agent\n  d -->|\"webhook\"| w[\"A bot over HTTP\"]:::agent\n  d -->|\"managed\"| m[\"A managed agent\"]:::agent\n  d -->|\"assign\"| a[\"A hosted coding agent\"]:::agent\n  classDef agent fill:#c7d2fe,stroke:#4f46e5,color:#111\n  classDef ci fill:#bbf7d0,stroke:#15803d,color:#111\n```\n\nEach executor entry may also name its MCP servers, its secrets (env var names only; nothing else is\npassed), its sandbox (`cloud`, `container` or `local`) and its model. Results come back only as board\nand forge writes. The rules are in [`executors.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/skills/sdlc/references/executors.md).\n\n## Trust boundaries\n\n| Part | Runs | Holds | Never |\n|---|---|---|---|\n| CI `Required` job | The change's code (install, tests) | No secrets | Posts a status a gate owns |\n| CI gates | The CLI only, with the binding from the target branch | The job token, the board token | Reads the binding from the change |\n| The cycle and implementers | Agents and their tools, in their sandbox | Forge and board tokens | Holds the review token |\n| The review | Reads CI results and the diff | The review token (two identities only) | Runs the change's code |\n| `verify-ux` | The change's preview, in a browser | Test credentials | Holds the review token |\n\nUntrusted input is data, never instructions: Signal text, change request bodies, and comments by\naccounts outside `owners`.\n\n## What `init` puts in your project\n\n| Path | Holds |\n|---|---|\n| `.agents/binding.yml` | Every project value. The one file a project changes. |\n| `.agents/skills/` | The skill pack (Claude with the plugin reads the plugin's copy). |\n| `.agents/scorers/` | The scorers `judge-run` uses. |\n| `.agents/cycle-prompt.md`, `review-prompt.md`, `runner-setup.sh` | What a scheduler runs. |\n| `.agents/hooks/pre-push` | Refuses a push to the trunk. |\n| `.github/workflows/agentic-sdlc-*.yml`, `.github/rulesets/` | The gates and the trunk protection. |\n| `AGENTS.md` (and `CLAUDE.md` for Claude) | A pointer for every agent: start with the `sdlc` skill. |\n\nChanging anything under `.agents/` or `.github/` is a factory change.\n\nBack to the start: [1. What it is](#1-what-it-is). Full behaviour, scenario by scenario:\n[docs/behaviour](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/behaviour/README.md).\n"}],"blob":"https://github.com/dmitriywind/agentic-sdlc/blob/master/"};

/* ---------- A ticket's journey: an example you step through ---------- */
const COLS = [['Signals', '--you'], ['Backlog', '--idle'], ['Ready', '--idle'], ['In progress', '--pend'], ['In review', '--ci'], ['Done', '--agent']];
const CHECKS = ['Required', 'proofs-on-base', 'ticket-linkage', 'review', 'human-approval', 'skill-regression'];
const P = 'pass', W = 'pend';
const STEPS = [
  { col: 'Signals', who: ['you', 'A user'], say: 'A user asks for a goodbye message. The request lands on the board as a Signal.', see: 'A ticket labelled <b>signal:feedback</b>.', log: 'Signal opened', tags: ['signal:feedback'] },
  { col: 'Backlog', who: ['agent', 'triage-signal'], say: 'The cycle triages it: real and wanted. It goes to Backlog as a feature, with a priority.', see: 'A decision comment and <b>Priority: Default</b>.', log: 'triage-signal: accepted', tags: ['feature', 'Default'] },
  { col: 'Ready', who: ['agent', 'shape'], say: 'shape writes three acceptance criteria, each with the proof that will show it done, and picks the size and lane.', see: 'The criteria comment, <b>Size XS</b>, <b>Lane Fast</b>.', log: 'shape: 3 criteria, XS, Fast', tags: ['feature', 'Default', 'XS', 'Fast'] },
  { col: 'In progress', who: ['agent', 'implement-spec'], say: 'implement-spec claims the ticket. It writes the failing test first, then the code, on a short-lived branch.', see: 'Branch <b>feature/2-farewell-function</b>.', log: 'implement-spec: test, then code', tags: ['feature', 'XS', 'Fast'] },
  { col: 'In review', who: ['agent', 'implement-spec'], say: 'It opens draft change request #3. CI starts: the tests run with no secrets, and the gates check the change.', see: 'Draft CR <b>#3</b> with checks running.', log: 'draft CR #3 opened', tags: ['feature', 'XS', 'Fast'], cr: 'draft', checks: [W, W, W, W, W, P] },
  { col: 'In review', who: ['ci', 'CI gates'], say: 'The tests pass. The new test fails on the old code, so it proves the change. The CR closes exactly one ticket.', see: '<b>Required</b>, <b>proofs-on-base</b> and <b>ticket-linkage</b> green.', log: 'CI: tests and gates green', tags: ['feature', 'XS', 'Fast'], cr: 'draft', checks: [P, P, P, W, P, P] },
  { col: 'In review', who: ['agent', 'review-pr'], say: 'review-pr grades each criterion against the diff and the CI results, in a fresh context. Verdict: PASS.', see: 'The review report, then the <b>review</b> check green.', log: 'review-pr: PASS', tags: ['feature', 'XS', 'Fast'], cr: 'ready', checks: [P, P, P, P, P, P] },
  { col: 'Done', who: ['ci', 'merged gate'], say: 'Every check is green, so the change merges. A Fast-lane change needs no human approval. The ticket is Done.', see: 'CR merged. <b>Shipped: Not shipped</b>.', log: 'merged; ticket Done', tags: ['feature', 'XS'], cr: 'merged', checks: [P, P, P, P, P, P], shipped: 'Not shipped' },
  { col: 'Done', who: ['ci', 'shipped gate'], say: 'Your deploy reports to the shipped gate. The ticket records where the change runs.', see: '<b>Shipped: On production</b>.', log: 'deploy: On production', tags: ['feature', 'XS'], cr: 'merged', checks: [P, P, P, P, P, P], shipped: 'On production' },
];
function journey(el) {
  el.className = 'panel';
  el.innerHTML = '<div class="legend"><span class="actor you">you</span><span class="actor agent">agents</span><span class="actor ci">CI gates</span><span class="example">Example, based on ticket #2 of a pilot run.</span></div>'
    + '<div class="board-wrap"><div class="board">' + COLS.map(([c, color]) => '<section class="col" data-col="' + c + '"><header style="color:var(' + color + ')"><i></i>' + c + '</header></section>').join('') + '</div></div>'
    + '<div class="journey-body"><div class="now" aria-live="polite"></div><div class="cr"></div></div>'
    + '<div class="controls"><button class="btn" data-go="-1">Back</button><button class="btn primary" data-go="1">Next step</button><button class="btn" data-play>Play</button><div class="steps"></div></div>'
    + '<ol class="log" aria-label="What happened"></ol>';
  const card = document.createElement('article');
  card.className = 'ticket';
  const steps = $('.steps', el);
  STEPS.forEach((_, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Step ' + (i + 1)); b.onclick = () => go(i); steps.append(b); });
  let i = 0, timer = null;
  function go(n) {
    i = Math.max(0, Math.min(STEPS.length - 1, n));
    const s = STEPS[i];
    const col = el.querySelector('[data-col="' + s.col + '"]');
    const before = card.isConnected ? card.getBoundingClientRect() : null;
    card.innerHTML = '<span class="id">#2</span><span class="t">Add a farewell function</span><span class="tags">' + s.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</span>';
    if (card.parentElement !== col) col.append(card);
    if (before && !reduced) {
      const after = card.getBoundingClientRect();
      card.animate([{ transform: 'translate(' + (before.left - after.left) + 'px,' + (before.top - after.top) + 'px)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.7,.2,1)' });
    }
    el.querySelectorAll('.col').forEach((c) => c.classList.toggle('on', c === col));
    col.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    $('.now', el).innerHTML = '<span class="eyebrow">Step ' + (i + 1) + ' of ' + STEPS.length + ' · ' + esc(s.col) + '</span><span class="actor ' + s.who[0] + '">' + esc(s.who[1]) + '</span><p>' + esc(s.say) + '</p><p class="see">You see: ' + s.see + '</p>';
    const state = s.cr ?? 'none';
    $('.cr', el).innerHTML = '<div class="head"><span>Change request #3</span><span class="state ' + state + '">' + (state === 'none' ? 'not yet' : state) + '</span></div>'
      + '<ul class="checks">' + CHECKS.map((c, k) => { const st = s.checks?.[k]; return '<li><span class="dot ' + (st ?? '') + '"></span><span>' + c + '</span><small>' + (st === P ? 'pass' : st === W ? 'pending' : '') + '</small></li>'; }).join('') + '</ul>'
      + '<div class="shipped">Shipped: <b>' + (s.shipped ?? 'not shipped') + '</b></div>';
    $('.log', el).innerHTML = STEPS.slice(0, i + 1).map((x, k) => '<li class="' + (k === i ? 'last' : '') + '"><span>' + String(k + 1).padStart(2, '0') + '</span><span>' + esc(x.log) + '</span></li>').join('');
    steps.querySelectorAll('button').forEach((b, k) => { if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    $('[data-go="-1"]', el).disabled = i === 0;
    $('[data-go="1"]', el).disabled = i === STEPS.length - 1;
  }
  function stop() { clearInterval(timer); timer = null; $('[data-play]', el).textContent = 'Play'; }
  el.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g) { stop(); go(i + Number(g.dataset.go)); }
    if (e.target.closest('[data-play]')) {
      if (timer) return stop();
      if (i === STEPS.length - 1) go(0);
      $('[data-play]', el).textContent = 'Pause';
      timer = setInterval(() => (i === STEPS.length - 1 ? stop() : go(i + 1)), 2600);
    }
  });
  el.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { stop(); go(i + 1); } if (e.key === 'ArrowLeft') { stop(); go(i - 1); } });
  el.tabIndex = 0;
  el.setAttribute('aria-label', 'A ticket\'s journey, step by step. Use the left and right arrow keys.');
  go(0);
}

/* ---------- Choose your setup: answers in, init command and binding out ---------- */
const QUESTIONS = [
  ['pays', 'Who pays for the agents?', [['sub', 'Subscriptions'], ['mix', 'Subscriptions + API keys'], ['api', 'API keys']]],
  ['ids', 'Forge identities', [['one', 'One: mine'], ['two', 'Two: plus a review app']]],
  ['repos', 'Repos per board', [['one', 'One repo'], ['many', 'Many repos, one board']]],
  ['runs', 'Where the cycle runs', [['cloud', 'Agent vendor cloud'], ['actions', 'GitHub Actions'], ['local', 'My machine'], ['managed', 'Managed agents']]],
  ['board', 'Where tickets live', [['issues', 'GitHub issues'], ['project', 'GitHub Project'], ['jira', 'Jira'], ['linear', 'Linear'], ['local', 'A local file']]],
  ['agent', 'Which agent', [['claude', 'Claude Code'], ['codex', 'Codex'], ['cursor', 'Cursor'], ['other', 'Another agent']]],
];
const RUNNER = 'https://github.com/dmitriywind/agentic-sdlc/blob/master/templates/runner/';
function setup(el) {
  el.className = 'panel';
  const pick = { pays: 'sub', ids: 'one', repos: 'one', runs: 'cloud', board: 'issues', agent: 'claude' };
  el.innerHTML = '<div class="setup"><form class="qs" style="display:grid;gap:16px">' + QUESTIONS.map(([k, label, opts]) =>
    '<fieldset class="q"><legend>' + label + '</legend><div class="seg">' + opts.map(([v, t]) =>
      '<label><input type="radio" id="q-' + k + '-' + v + '" name="' + k + '" value="' + v + '"' + (pick[k] === v ? ' checked' : '') + '><span>' + t + '</span></label>').join('') + '</div></fieldset>').join('')
    + '</form><div class="out" aria-live="polite"></div></div>';
  const form = $('form', el);
  form.addEventListener('submit', (e) => e.preventDefault());
  form.addEventListener('change', (e) => { pick[e.target.name] = e.target.value; draw(); });
  el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    const text = $('.cmd pre', el).textContent;
    try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents($('.cmd pre', el)); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected'; }
    setTimeout(() => (b.textContent = 'Copy'), 1600);
  });
  function setDisabled(name, value, off) { const i = form.querySelector('#q-' + name + '-' + value); i.disabled = off; if (off && i.checked) { const first = [...form.querySelectorAll('input[name="' + name + '"]')].find((x) => !x.disabled); first.checked = true; pick[name] = first.value; } }
  function draw() {
    const profile = { sub: 'individual', mix: 'individual-api', api: 'organization' }[pick.pays];
    setDisabled('ids', 'one', profile === 'organization');
    setDisabled('runs', 'managed', profile === 'individual');
    const harness = { claude: 'claude', codex: 'codex', cursor: 'cursor', other: 'generic' }[pick.agent];
    const board = { issues: 'github-issues', project: 'github', jira: 'jira', linear: 'linear', local: 'local' }[pick.board];
    const cloudClaude = pick.runs === 'cloud' && pick.agent === 'claude';
    const cmd = 'npx --no agentic-sdlc init --profile ' + profile + ' --harness ' + harness + ' --board ' + board + (cloudClaude ? ' --no-plugin' : '');
    const kv = ['profile: ' + profile];
    if (pick.ids === 'one') kv.push('forge.review_identity: ""');
    else kv.push('forge.review_identity: your-review-app[bot]', 'forge.options.review_token_env: AGENTIC_REVIEW_TOKEN');
    kv.push('executors.default.sandbox: ' + (pick.runs === 'local' ? 'local' : profile === 'organization' ? 'container' : 'cloud'));
    if (pick.repos === 'many' && pick.board === 'project') kv.push('board.options.repo: <owner>/<this repo>');
    if (pick.repos === 'many' && ['issues', 'jira', 'linear'].includes(pick.board)) kv.push('board.scope.label: repo:<this repo>', 'board.scope.home: true   (one repo only)', 'board.scope.repos: [repo:a, repo:b]');
    const notes = [], warn = [];
    if (cloudClaude && pick.board === 'project') warn.push('A Claude cloud routine cannot reach a GitHub Project: its GitHub proxy refuses GraphQL. Pick GitHub issues, Jira or Linear, or run the cycle in GitHub Actions.');
    if (pick.runs === 'cloud' && pick.agent === 'other') warn.push('Another agent has no vendor cloud here. Run the cycle in GitHub Actions or on your machine.');
    if (pick.board === 'local' && pick.runs !== 'local') warn.push('The local board is a file in the repo. Use it to try the factory, not with a scheduler.');
    if (pick.board === 'local' && pick.repos === 'many') warn.push('A local board cannot be shared by many repos.');
    if (cloudClaude && ['jira', 'linear'].includes(pick.board)) notes.push('Add the board host to the cloud environment\'s allowed domains and its token as a network secret, with NODE_USE_ENV_PROXY=1.');
    if (pick.runs === 'local') notes.push('Run it in a separate clone, with AGENTIC_SDLC_UNATTENDED=1 and AGENTIC_SDLC_LOCAL=1 in the scheduler\'s environment. Agents run with your account and files.');
    if (profile !== 'individual' && pick.runs !== 'managed') notes.push('Give a managed executor\'s API key a name other than ANTHROPIC_API_KEY, so the cycle stays on the subscription.');
    if (pick.ids === 'one') notes.push('One identity: review-pr runs in the cycle and CI posts the review status. A Full-lane change waits for a collaborator\'s approval or your admin merge.');
    else notes.push('Two identities: schedule a second run with review-prompt.md. Only that run gets AGENTIC_REVIEW_TOKEN.');
    if (['jira', 'linear'].includes(pick.board)) notes.push('Set board.options for ' + (pick.board === 'jira' ? 'Jira: base_url, project_key, email_env, token_env.' : 'Linear: team_key, token_env.'));
    const tpl = pick.runs === 'local' ? 'local.md' : pick.runs === 'actions' ? (pick.agent === 'codex' ? 'github-actions-codex.yml' : 'github-actions-claude.yml')
      : pick.runs === 'managed' ? 'routine.md' : pick.agent === 'cursor' ? 'cursor-automation.md' : pick.agent === 'codex' ? 'routine.md' : 'claude-routine.md';
    $('.out', el).innerHTML = '<h4>1 · Run</h4><div class="cmd"><pre>' + esc(cmd) + '</pre><button class="btn" type="button" data-copy>Copy</button></div>'
      + '<h4>2 · Check in .agents/binding.yml</h4><pre class="kv">' + esc(kv.join('\n')) + '</pre>'
      + '<h4>3 · Schedule the cycle</h4><p style="margin:0;font-size:14px">Template: <a href="' + RUNNER + tpl + '">templates/runner/' + tpl + '</a></p>'
      + (warn.length || notes.length ? '<h4>Notes</h4><ul class="notes">' + warn.map((w) => '<li class="warn">' + esc(w) + '</li>').join('') + notes.map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '');
  }
  draw();
}

/* ---------- Pages ---------- */
const toc = $('#toc'), select = $('#pick'), main = $('#main');
select.add(new Option('Overview', 'overview'));
for (const c of chapters) {
  const n = parseInt(c.id);
  toc.insertAdjacentHTML('beforeend', '<li><a class="ch" href="#' + c.id + '"><small>' + String(n).padStart(2, '0') + '</small><span>' + esc(c.title.replace(/^\d+\.\s*/, '')) + '</span></a></li>');
  select.add(new Option(c.title, c.id));
}
select.onchange = () => go(select.value);
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (id !== 'overview' && !chapters.some((c) => c.id === id)) return;
  e.preventDefault(); go(id);
});
function go(id) { try { history.pushState(null, '', '#' + id); } catch {} show(id); }
const VIZ = { journey, setup };
async function show(id = location.hash.slice(1)) {
  const c = chapters.find((x) => x.id === id);
  for (const a of toc.querySelectorAll('a')) { if (a.getAttribute('href') === '#' + (c?.id)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  select.value = c ? c.id : 'overview';
  if (!c) {
    main.innerHTML = '<header class="hero"><span class="eyebrow">agentic-sdlc · how it works</span><h1>Watch one ticket go from a signal to production</h1>'
      + '<p class="lead">You put work on a board. A scheduled agent run moves each ticket one step. CI gates decide what merges. Step through a real example, then pick your setup.</p></header>'
      + '<div data-viz="journey"></div>'
      + '<section><h2>Read the guide</h2><div class="cards">' + chapters.map((x) => '<a class="card" href="#' + x.id + '"><small>' + String(parseInt(x.id)).padStart(2, '0') + '</small><b>' + esc(x.title.replace(/^\d+\.\s*/, '')) + '</b><span>' + esc(x.lead) + '</span></a>').join('') + '</div></section>';
  } else {
    const i = chapters.indexOf(c), prev = chapters[i - 1], next = chapters[i + 1];
    const md = c.md.replace(/<!-- viz: (\w+) -->\n```mermaid\n[\s\S]*?```/g, '<div data-viz="$1"></div>').replace(/\nNext: \[[^\n]*\n?$/, '\n');
    main.innerHTML = '<article class="prose">' + marked.parse(md) + '</article>'
      + '<nav class="pager" aria-label="Chapters">' + (prev ? '<a href="#' + prev.id + '"><small>Previous</small>' + esc(prev.title) + '</a>' : '<span></span>')
      + (next ? '<a class="next" href="#' + next.id + '"><small>Next</small>' + esc(next.title) + '</a>' : '') + '</nav>'
      + '<p class="source">Source: <a href="' + blob + c.file + '">' + c.file + '</a></p>';
  }
  main.querySelectorAll('[data-viz]').forEach((el) => VIZ[el.dataset.viz]?.(el));
  await mermaid.run({ nodes: main.querySelectorAll('pre.mermaid') });
  scrollTo(0, 0);
}
addEventListener('popstate', () => show());
show();
</script>
