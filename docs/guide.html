const docs = [{"id":"start","label":"Start","file":"README.md","md":"# agentic-sdlc\n\n> **Alpha (2.0.0-alpha).** The interfaces still change between alphas. The board and forge adapters\n> are unit-tested against a fake process runner, not yet against live services. Try it on a\n> sandbox repo before you point it at one that matters.\n\nA skill pack plus ports for running delivery with agents. The skills describe the process:\ntriage, shape, build, review, release, escalate and learn. The `agentic-sdlc` CLI gives those\nskills one set of verbs for the board, the forge and Git, and the CI gates that agents must not\nbe trusted to keep. Your agent harness and scheduler run the skills. The package ships no agent\nrunner of its own.\n\n- **Boards:** GitHub Projects, the repo's GitHub issues (`github-issues`, over REST), Jira, Linear, or a local JSON file.\n- **Forge:** GitHub. **VCS:** Git, trunk-based.\n- **Harnesses:** Claude Code (as a plugin), Codex, Cursor, or any agent with a\n  shell or MCP.\n- **Executors per stage:** a harness subagent, a command bot, a webhook bot, a managed agent, or\n  a hosted coding agent by assignment.\n- **Profiles:** `individual` runs on subscriptions only; `individual-api` adds API keys and managed\n  agents to it; `organization` runs on API keys and managed agents, with trace storage and a separate review app.\n- **Identities:** one (the default for both individual profiles: the factory acts as your account) or\n  two (a separate review identity; required for `organization`).\n- **Repos:** one repo per board, or many repos on one board (`board.scope`).\n\n| Start here | |\n|---|---|\n| [Guide page](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/guide.html) | One HTML page: set up, every flow and every part, with the diagrams drawn. Open it in a browser. |\n| [Docs index](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/README.md) | Every guide. |\n| [Components](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/architecture/components.md) and [flows](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/architecture/flows.md) | Diagrams of the parts, trust boundaries, the cycle, review, release and learning. |\n| [Claude](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/claude-code.md), [Codex](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/codex.md), [Cursor](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/cursor.md), [any other](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/generic.md) | Install and run in each ecosystem. |\n| [Individual and individual-api](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/profiles/individual.md) and [organization](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/profiles/organization.md) | Pick a profile. |\n| [Forge](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md) | GitHub checks, approval, tokens and one-time setup. |\n| [The contract](https://github.com/dmitriywind/agentic-sdlc/blob/master/references/architecture.md) | Normative: ports, gates, binding, executors, runtimes. |\n\n## How it fits together\n\n| Layer | Where | Holds |\n|---|---|---|\n| Process | the plugin (Claude) or `.agents/skills/` | Every rule: statuses, routing, the cycle, lanes, review, release, escalation, learning. |\n| Binding | `.agents/binding.yml` | Every project value: board, forge, commands, paths, owners, model tiers, executors. |\n| Ports | `agentic-sdlc` CLI and MCP server | Board, forge and Git verbs, CI gates, dispatch, the run ledger, the bench. |\n\nA scheduled agent loads the `sdlc` skill and runs one cycle; the skill routes each ticket to a\nstep skill. Every hand-off goes through the board and the forge. CI runs the CR's code with no\nsecrets (the `Required` check); `review-pr`, in a fresh agent context, reads that result and never\nruns CR code. With two identities it runs in a separate review runtime under its own account. A\nFull-lane CR also needs one human approval.\n\n## Skills\n\nEleven skills, each with a model tier in `metadata.tier`. Seven run in every project; four run only\nwhen the binding asks for them (the last column).\n\n| Skill | Tier | Does | Runs |\n|---|---|---|---|\n| `sdlc` | fast | The navigator: routing, the cycle, the hold, branches. | always |\n| `triage-signal` | fast | One raw signal to one decision: Backlog, Ideas or Cancelled. | always |\n| `backlog-grooming` | balanced | Priority, dedupe, initiatives, decluttering. | always |\n| `shape` | deep | Backlog to Ready: size, split, criteria with proof, lane, spec. | always |\n| `implement-spec` | balanced | Proof first on one change line, then a draft CR. | always |\n| `review-pr` | balanced | Independent review from CI results, then ready and auto-merge (an approving review only with two identities), or send back. | always |\n| `verify-ux` | balanced | Uses the running CR head as a user for `computer-use` criteria and posts evidence. Apart from `review-pr` because it runs CR code, which the review never does. | a criterion names `computer-use` and `commands.preview` is set |\n| `release` | balanced | Choose what ships, set the version, cut the release branch. | `product.delivery: release-line` |\n| `escalate-to-human` | fast | Decide whether a person must act; hold the ticket with one structured ask. | always |\n| `judge-run` | fast (dispatch picks `learning.judge_tier`) | Grade one finished run with the scorers `ledger plan` names. | `learning.enabled` |\n| `improve-factory` | deep | Find the worst repeated failure and propose one factory change, with bench proof. | `learning.enabled` |\n\nThe self-improvement loop is described in the contract, section 6. In short: every run is a\nledger row, scorers grade it, and `improve-factory` proposes one change at a time, proved on a\nbench built from your own merged work. Until a bench baseline exists, nothing merges without the\nfactory owner. Learning is off until you set `learning.enabled: true` and an\n`agent_command` for the bench.\n\n## Install\n\n```bash\nnpm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v2.0.0-alpha.5\nnpx --no agentic-sdlc init --profile individual --harness claude --board github --forge github --vcs git\nnpx --no agentic-sdlc doctor\n```\n\nThe CLI installs from Git only. Warning: the npm package `agentic-sdlc` is a different project; do not install it.\nTo move to another revision, run `npm uninstall agentic-sdlc` first, then the `npm i` line above with the new ref, then `init`\nagain. npm 12 refuses to change an installed Git dependency in place (`EALLOWGIT`).\n\n`init` flags:\n\n| Flag | Values | Default |\n|---|---|---|\n| `--profile` | `individual`, `individual-api`, `organization` | `individual` |\n| `--harness` | `claude`, `codex`, `cursor`, `generic` | `generic` |\n| `--board` | `github`, `github-issues`, `jira`, `linear`, `local` | `github` |\n| `--forge` | `github` | `github` |\n| `--vcs` | `git` | `git` |\n| `--force` | overwrite files `init` would keep | off |\n| `--no-plugin` | with `--harness claude`: copy skills to `.claude/skills` and write `.mcp.json` instead of using the plugin | off |\n\nWhat `init` writes, for every harness: `.agents/binding.yml`, `.agents/scorers/`, the gate\ntemplates for your forge (GitHub: workflows, `pull_request_template.md` and\n`.github/rulesets/trunk.json` and `release.json`, and the release workflow for release-line delivery), `.agents/hooks/pre-push`, `.agents/runner-setup.sh`, the cycle and\nreview prompts in `.agents/`, and a pointer block in `AGENTS.md`. Per harness:\n\n| Harness | Skills | Instructions | MCP server |\n|---|---|---|---|\n| `claude` | none: install the plugin (`--no-plugin`: `.claude/skills/`) | `@AGENTS.md` import in `CLAUDE.md`; tier subagents in `.claude/agents/` | the plugin's (`--no-plugin`: `.mcp.json`) |\n| `codex` | `.agents/skills/` | `AGENTS.md` | `.codex/config.toml` |\n| `cursor` | `.agents/skills/` | `AGENTS.md` | `.cursor/mcp.json` |\n| `generic` | `.agents/skills/` (see the ecosystem guide) | `AGENTS.md` | printed for you to add |\n\nThe init log is the exact list. Then fill in the binding and run `doctor` until every port is ok.\nPrerequisites for the GitHub adapters: `gh` logged in (or a Claude cloud session), and a token with\nProjects v2 scope for a `github` board. The `organization` profile also needs a review GitHub App.\n\n### Claude Code plugin\n\nFor Claude Code the skills, hooks and MCP server are a plugin, so skills are named\n`/agentic-sdlc:<skill>`. Install it from this repo's marketplace, or load it for one session from\nthe installed package:\n\n```text\n/plugin marketplace add dmitriywind/agentic-sdlc\n/plugin install agentic-sdlc@agentic-sdlc\n```\n\n```bash\nclaude --plugin-dir ./node_modules/agentic-sdlc\n```\n\nSee [docs/ecosystems/claude-code.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/ecosystems/claude-code.md) for the headless flags a\nscheduled run needs.\n\n## Try it locally\n\nNo board account and no forge needed for this part. The `local` board is `.agents/board.json`.\n\n```bash\nmkdir try-agentic && cd try-agentic && git init -b main && npm init -y\nnpm i -D --allow-git=root github:dmitriywind/agentic-sdlc#v2.0.0-alpha.5\nnpx --no agentic-sdlc init --board local --forge github --harness generic\nprintf 'Show a greeting on the home page.\\n' > body.md\nnpx --no agentic-sdlc board create --title \"Greeting\" --body-file body.md --status Backlog\nnpx --no agentic-sdlc board list\nnpx --no agentic-sdlc dispatch shape --ticket 2\n```\n\n`dispatch` with the default `harness` executor prints the instruction your agent would follow; it\nstarts nothing. Open the folder in your agent and ask it to run the `sdlc` skill for one cycle.\n`board create` and `board comment` take bodies only from `--body-file`; `board close` needs\n`--reason completed|not_planned`. Forge verbs and gates need a real forge.\n\n## This repository\n\nThis repo does not run its own factory yet: it has no `.agents/`, no board and no factory gates (`.github/workflows/ci.yml` only builds and tests), and changes\nare made by hand. The reason is order: the gates and the review runtime have to be proved on\nsandbox repos first, and a broken factory gating its own repo could not be fixed through itself.\nContributing: [CONTRIBUTING.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/CONTRIBUTING.md). Security: [SECURITY.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/SECURITY.md).\n\n## CLI\n\n`npx --no agentic-sdlc --help` lists every group and verb. Every verb prints JSON. Exit 0 is success,\n1 is a refused or failed action, 2 is a usage error.\n\n## License\n\nApache-2.0\n"},{"id":"setup","label":"Set up","file":"docs/adoption.md","md":"# Adoption\n\nHow to put the factory on a repo, and on many repos. The install commands are in the\n[README](https://github.com/dmitriywind/agentic-sdlc/blob/master/README.md#install); this guide says which choices to make and in what order.\n\n## Choose the setup\n\n```mermaid\nflowchart TD\n  A[\"Who pays for the agents?\"] -->|\"subscriptions only\"| IND[\"--profile individual\"]\n  A -->|\"subscriptions, plus API keys for some stages\"| API[\"--profile individual-api\"]\n  A -->|\"API keys, managed agents\"| ORG[\"--profile organization<br/>(two identities)\"]\n  IND --> ID[\"One identity, or a review identity?<br/>forge.review_identity\"]\n  API --> ID\n  ID --> H[\"Which agent runs the cycle?\"]\n  ORG --> H\n  H --> HC[\"--harness claude | codex | cursor |<br/>generic\"]\n  HC --> B[\"Where do tickets live?\"]\n  B --> BC[\"--board github | github-issues | jira | linear | local\"]\n  BC --> F[\"Where do CRs live?\"]\n  F --> FG[\"--forge github<br/>(the one supported forge)\"]\n  FG --> S[\"Which scheduler?\"]\n  S --> SC[\"templates/runner/routine.md<br/>picks the template\"]\n```\n\nThe forge is GitHub only. See [forges.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md).\n\nA Claude cloud scheduled task on a subscription is a full runtime, with three choices fixed by it:\n`--harness claude --no-plugin` (a cloud session loads `.claude/skills`, not repo plugins); a\n`github-issues`, `jira` or `linear` board, never `github` (Projects v2 is out of reach of the cloud's\nGitHub proxy); and `commands.verify` in CI (no Docker, 10-minute foreground limit). See\n[`templates/runner/claude-routine.md`](https://github.com/dmitriywind/agentic-sdlc/blob/master/templates/runner/claude-routine.md).\n\n## Adopt on one repo\n\n1. Install the CLI as a devDependency, pinned to a tag. The repo then owns its version.\n2. Run `init` with the flags from the chart above.\n3. Fill in `.agents/binding.yml`: owners, statuses, `commands.*`, `product.environments`,\n   `product.delivery` (`release-line` or `continuous`), `product.evidence` (`sbom`, `provenance`,\n   `signature`; set `commands.evidence_check` with it), `product.proofs`, `models`. The template\n   documents every key. On GitHub with `release-line` delivery, also set up Environment `agentic-release`\n   and the release workflow (see [forges.md](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/forges.md#github)).\n4. Write `paths.importance_doc` and `paths.guiding_narrative`. The skills judge every ticket\n   against them; without them every product question becomes a hold.\n5. Run `doctor` until every port is ok. A warning that no gate blocks a merge means the trunk has no\n   enforced ruleset or branch protection (a private repo on GitHub Free cannot enforce one).\n6. Put two or three real tickets in Backlog with a Priority.\n7. Run one cycle by hand: open the repo in the agent and run the `sdlc` skill for one cycle.\n   Read the heartbeat and every comment it wrote.\n8. Repeat step 7 until three cycles in a row need no correction from you.\n9. Install the cycle and review schedulers from `templates/runner/`. Add the dead-man check\n   (`ledger stale`).\n10. Apply the [repo baseline](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/operating-baseline.md#repo-baseline) and the\n    [board baseline](https://github.com/dmitriywind/agentic-sdlc/blob/master/docs/operating-baseline.md#board-baseline).\n\nDone when a scheduled cycle writes a heartbeat with no `errors`, and a CR merges through the gates.\n\n## Product types\n\nThe skills are the same for every product; the binding says what an environment and a proof are.\n\n| Product | `product.environments` | `product.delivery` | Proofs | How it reports |\n|---|---|---|---|---|\n| Web service with continuous delivery | `[staging, production]` or `[production]` | continuous | test, visual, computer-use | Each deploy runs `gate shipped <env>`; a flag kill or rollback runs `--result rolled-back`. |\n| Web or API product with approved releases | `[staging, production]` | release-line | test, visual, computer-use | `release` cuts; the production deploy from the release line reports. |\n| Mobile app | `[internal, beta, store]` | release-line | test, visual, manual | The store step reports when review approves: `gate shipped store --result success` from the store webhook or by a person; a halted phased rollout reports `rolled-back`. |\n| Library or package | `[registry]` | continuous | test | The publish job runs `gate shipped registry --version <published version>`; the gate tags it. |\n| Data pipeline or ML model | `[staging, production]` (registry stages) | continuous | eval, data-check | A promotion runs `gate shipped <stage> --version <model version>`; a version pin runs `--result rolled-back`. |\n| Docs or content site | `[production]` | continuous | visual, manual | `paths.no_proof` covers the content paths. |\n\n## Move from a hand-made process\n\n1. List what the old process does that the skills do not. Each item is a binding value, a\n   doc that `paths.importance_doc` routes to, or a gap to report on this repo.\n2. Run `init --force` on a branch, then copy the old values into the binding.\n3. Delete the old copies of the skills. A project replaces the binding, never the skills.\n4. Continue at step 5 of \"Adopt on one repo\".\n\n## Many repos\n\n```mermaid\nflowchart LR\n  REL[\"agentic-sdlc tag<br/>v&lt;version&gt;\"] --> R1[\"Repo A<br/>binding A, pin v1\"]\n  REL --> R2[\"Repo B<br/>binding B, pin v1\"]\n  REL --> R3[\"Repo C<br/>binding C, pin v2\"]\n  FO((\"Factory owner\")) -.-> R1\n  FO -.-> R2\n  FO -.-> R3\n  R1 --> BA[\"Board scope A\"]\n  R2 --> BB[\"Board scope B\"]\n  R3 --> BC[\"Board scope C\"]\n```\n\n- Each repo has its own binding and its own pinned version. Upgrade one repo at a time.\n- Each repo has its own cycle and review schedulers, and its own heartbeat ticket.\n- One board per repo: a Jira `project_key`, a Linear `team_key` or a `github-issues` board of its own.\n- Or one board for many repos:\n  - A GitHub Project: each repo sets its own `board.options.repo`; each adapter reads only that repo's issues.\n  - A shared Jira project, Linear team or hub repo's issues: each repo sets `board.scope.label: repo:<name>`.\n    One repo sets `home: true` and every label in `repos`; its `triage-signal` gives each new\n    ticket its repo label. Every other repo lists only its own label.\n- One person or team can be the Factory owner of many repos.\n- `improve-factory` changes the copy of the skills in its own repo only. A change that should\n  reach every repo goes upstream to this repo, then out with the next tag.\n- Claude Code: the marketplace plugin has one version per user. A scheduled run should load the\n  repo's pinned copy: `claude --plugin-dir ./node_modules/agentic-sdlc`.\n\n## Upgrade\n\n1. Read `git log v<yours>..v<new>` and the contract diff for the new tag.\n2. Bump the pinned version, then run `npm ci`.\n3. Run `init` again without `--force`. It keeps your files and logs what it skipped.\n4. Run `validate` and `doctor`.\n5. Run one cycle by hand before the scheduler takes over.\n\nReleases are tags. A pushed tag never moves.\n"},{"id":"flows","label":"Flows","file":"docs/architecture/flows.md","md":"# Flows\n\nHow work moves through the agentic-sdlc factory. The contract is `references/architecture.md`;\nthe process rules are in `skills/sdlc/SKILL.md` and the common contract in `skills/sdlc/references/contract.md`.\n\n## 1. Ticket lifecycle\n\nPurpose: show every status a ticket can hold and how it moves.\n\n```mermaid\nstateDiagram-v2\n  state \"In progress\" as InProgress\n  state \"In review\" as InReview\n\n  [*] --> Signals: intake\n  [*] --> Ideas: parked\n  Signals --> Ideas: snooze\n  Signals --> Backlog: accept\n  Signals --> Cancelled: reject\n  Ideas --> Backlog: human accepts\n  Ideas --> Cancelled: human rejects\n  Backlog --> Ready: shaped\n  Backlog --> Cancelled: will not fix\n  Ready --> InProgress: claimed\n  Ready --> Backlog: bad spec or scope\n  InProgress --> InReview: draft CR opened\n  InProgress --> Backlog: bad spec or scope\n  InReview --> InProgress: review sends back\n  InReview --> Backlog: bad spec or scope\n  InReview --> Done: merged\n  Done --> [*]\n  Cancelled --> [*]\n\n  note right of InReview\n    needs-human is a label, not a status.\n    A held ticket keeps its status and\n    every skill skips it.\n    Red CI returns the CR to draft;\n    the status stays In review.\n  end note\n```\n\n- Done is final. A later failure opens a new Signal, never reopens the ticket.\n- Humans own Ideas. Skills never pick one up.\n- Removing the `needs-human` label releases a hold. A trusted owner reply releases it too: the cycle removes the label.\n\n## 2. One cycle\n\nPurpose: show the order of work in one scheduled run, and the review run after it.\n\n```mermaid\nsequenceDiagram\n  participant S as Scheduler\n  participant O as Orchestrator (sdlc)\n  participant W as Subagents\n  participant B as Board\n  participant R as Review runtime\n  S->>O: load sdlc, run one cycle\n  O->>O: 1. Claim: dispatch sdlc (skipped means another cycle runs: stop)\n  O->>B: 1. board list, forge list, trusted heartbeats, ledger summary\n  alt 2. Idle: nothing to dispatch, no CR needs a review, nothing to judge or learn\n    O->>B: Heartbeat with at, factory, empty runs and errors, then stop\n  end\n  O->>W: 3. Judge: judge-run per unscored run\n  W->>B: One scores comment per run\n  opt 4. Learn: ledger summary shows learning.due\n    O->>W: improve-factory\n    W->>B: One draft factory CR and its own learn heartbeat\n  end\n  O->>W: 5. Triage each Signal\n  W->>B: Move to Ideas, Backlog or Cancelled\n  O->>W: 6. Route: releases, hand-offs, rework, Ready, Backlog\n  W->>B: Draft CR, ticket In review, shaped ticket Ready\n  loop While the time budget lasts: a finished ticket that matches another row\n    O->>W: Dispatch its next step (groomed to shape, shaped to implement)\n  end\n  O->>B: 7. Report: write the cycle heartbeat with ledger rows\n  opt 8. Review hand-off (two identities only): forge list shows a CR that needs a review\n    O->>R: Fire the review runtime once\n    R->>B: review-pr per CR, a review heartbeat\n  end\n```\n\n- The orchestrator routes, waits and reports. Subagents do the work.\n- An idle cycle writes a minimal heartbeat and fires no review.\n- A CR needs a review when a `review-pr` routing row matches it and, if it is draft, its newest review report is not for its head.\n- A second dispatch of the same skill and subject inside `cycle.dedupe_minutes` is a double fire. It is skipped.\n- After `time_budget_minutes` nothing new starts.\n- The heartbeat has a `kind`: `cycle`, `review` or `learn`. Only `cycle` heartbeats count cycles.\n- A failed step goes in the heartbeat `errors`. The cycle goes on.\n\n## 3. Change request hand-off\n\nPurpose: show how a draft CR becomes a merged change and a Done ticket.\n\n```mermaid\nsequenceDiagram\n  participant I as implement-spec\n  participant F as Forge\n  participant C as CI (no secrets)\n  participant G as Gates\n  participant R as review-pr\n  participant U as verify-ux\n  participant H as Human approver\n  participant B as Board\n  I->>F: Open draft CR, Closes id\n  F->>G: branch-names, linkage, approval\n  I->>B: Ticket In review (--only-from In progress)\n  F->>C: pull_request\n  C->>F: Required (install + verify), proofs-on-base\n  R->>F: Read diff, ticket, spec and CI results\n  opt computer-use proof\n    R->>U: dispatch verify-ux\n    U->>F: Evidence from a preview of the head\n  end\n  R->>F: review status and approval as review identity\n  opt Full lane, or guardrail factory CR\n    R->>F: Ask a human owner to approve\n    H->>F: Approving review on the head\n    F->>G: approval (review submitted)\n  end\n  G->>F: human-approval\n  R->>F: Mark ready, turn on automerge\n  F->>F: Merge to trunk when every required check is green\n  F->>G: merged (trunk push)\n  G->>B: Ticket Done, Not shipped\n```\n\n- No CR-pipeline gate writes the board. implement-spec moves the ticket to In review; the trunk-push\n  `merged` gate moves it to Done.\n- The implementer never reviews its own CR. The review runtime never runs CR code.\n- The diagram shows two identities. With one identity (`forge.review_identity` empty) there is no\n  review runtime: the cycle dispatches `review-pr` as a fresh subagent in the same cycle. It posts its\n  report and no approval; CI's `review` gate turns the report into the `review` status.\n- A Fast-lane product CR merges on the agent review. A Full-lane one also needs a human\n  approval when `forge.human_approval` is `full-lane` or `always`.\n- Red or missing checks send the CR back to draft. The cause decides who fixes it.\n- A CR behind the trunk is synced and reviewed again.\n\n## 4. Delivery and release\n\nPurpose: show how a merge reaches the last environment.\n\n```mermaid\nflowchart TD\n  M[\"Merge to trunk\"] --> MG[\"Gate merged:<br/>ticket Done, Not shipped\"]\n  M --> D1[\"Deploy first env\"]\n  D1 --> SG[\"Gate shipped: On first env\"]\n  SG --> MODE{\"product.delivery\"}\n  MODE -->|\"continuous\"| DC[\"Deploy each later env<br/>from the trunk\"]\n  DC --> OKC[\"Gate shipped: On each env<br/>with --version\"]\n  MODE -->|\"release-line\"| RL[\"Release request (labelled Backlog ticket)<br/>or P0 fix On first env\"]\n  RL --> RS[\"release skill picks SHA<br/>and version\"]\n  RS --> IR[\"release skill:<br/>Shipped In release\"]\n  IR --> WF[\"Release workflow:<br/>Product owner approves the<br/>agentic-release Environment\"]\n  WF --> CUT[\"forge cut: release line\"]\n  CUT --> D2[\"Deploy last env\"]\n  D2 -->|\"success\"| OK[\"Gate shipped: On last env,<br/>tag created\"]\n  D2 -->|\"failure\"| FAIL[\"Tickets back to previous env,<br/>version cleared\"]\n  FAIL --> SIG[\"Held Signal opened<br/>(needs-human)\"]\n  SIG --> TR[\"triage-signal makes<br/>a new ticket\"]\n  OKC -->|\"a bad deploy is rolled back\"| RB[\"Gate shipped --result rolled-back:<br/>tickets not in the running revision<br/>step back one env\"]\n  OK -->|\"a bad deploy is rolled back\"| RB\n```\n\n- Agents never approve the last environment. The Product owner does.\n- The release skill sets In release before the cut. On GitHub the Product owner approves the release workflow run. The release bot token cuts the line; the cycle never holds it.\n- Continuous delivery has no release line and no In release.\n- Each failed deploy opens one Signal with its environment label.\n- A failed release line is left untouched. The fix ships under the next version.\n- The tag is created at success in the last environment.\n\n## 5. Self-improvement loop\n\nPurpose: show how runs become one proven factory change.\n\n```mermaid\nflowchart TD\n  RUN[\"Runs\"] --> LED[\"Ledger\"]\n  LED --> SCO[\"Scorers + judge-run\"]\n  HG[\"Human grades\"] -->|\"win over judge\"| SCO\n  SCO --> CL[\"Clusters with counts\"]\n  CL --> IMP[\"improve-factory:<br/>one proposal\"]\n  IMP --> BEN[\"bench compare:<br/>min cases, trials, Wilson bound\"]\n  BEN --> PAR[\"bench report:<br/>Pareto front\"]\n  PAR --> CR[\"Factory CR with proof\"]\n  CR --> RV[\"review-pr\"]\n  RV --> FC[\"Gate approval\"]\n  FC -->|\"tuning, if auto_merge_classes\"| AM[\"Auto-merge\"]\n  FC -->|\"guardrail\"| OWN[\"Factory owner approval\"]\n  AM --> NV[\"New factory version\"]\n  OWN --> NV\n  NV --> RUN\n```\n\n- One change per proposal, from `improve-factory` only.\n- The change must not lower the bench pass rate.\n- Any change to skill text is `guardrail`. `tuning` is only the `models` map and a benched\n  skill's tier.\n- Learning runs only when `learning.enabled` is true.\n- Unknown paths and deletions count as guardrail.\n\n## 6. Signal on red\n\nPurpose: show how a failure becomes a new ticket without reopening Done work.\n\n```mermaid\nflowchart TD\n  RED[\"Red CI run on the trunk<br/>or a release line\"] --> SOR[\"Gate signal-on-red\"]\n  SOR -->|\"redacted evidence\"| SIG[\"New Signal on board\"]\n  SIG --> TRI[\"triage-signal\"]\n  TRI -->|\"accept\"| NT[\"New ticket with<br/>regression case\"]\n  TRI -->|\"park\"| ID[\"Ideas\"]\n  TRI -->|\"reject\"| CA[\"Cancelled\"]\n  NT --> NORM[\"Normal path to Done\"]\n  DONE[\"Original ticket stays Done\"]\n  RED -.->|\"never reopens\"| DONE\n```\n\n- Only CI runs on the trunk and release lines open a Signal. Other refs are ignored.\n- A failed deploy opens its own Signal through `gate shipped`, one per failure, with its environment label.\n- The fix is always a new ticket with a regression case in its criteria.\n- A failure in the last environment adds the `needs-human` hold to the Signal.\n\n## 7. Which skill acts at each status\n\nPurpose: show the routing table of `skills/sdlc/SKILL.md` as one picture. The table is the rule.\n\n```mermaid\nflowchart LR\n  ID[\"Ideas<br/>(humans only)\"]\n  SG[\"Signals\"] -->|\"triage-signal\"| BL\n  SG -->|\"triage-signal\"| ID\n  SG -->|\"triage-signal\"| CA[\"Cancelled\"]\n  ID -->|\"Product owner moves it\"| BL[\"Backlog\"]\n  BL -->|\"backlog-grooming<br/>(no Priority)\"| BL\n  BL -->|\"shape<br/>(Priority, no blocker,<br/>no children)\"| RD[\"Ready\"]\n  BL -->|\"release<br/>(release request label,<br/>release-line only)\"| REL[\"Release line\"]\n  RD -->|\"implement-spec\"| IP[\"In progress\"]\n  IP -->|\"implement-spec<br/>(draft CR)\"| IR[\"In review\"]\n  IR -->|\"review-pr<br/>(+ verify-ux)\"| IR\n  IR -->|\"review-pr sends back\"| IP\n  IR -->|\"merge (gates)\"| DN[\"Done\"]\n  DN -->|\"gates write Shipped\"| DN\n  DN -->|\"release<br/>(P0 on first env)\"| REL\n  LED[\"ledger: learning.due\"] -->|\"improve-factory\"| FCR[\"Factory CR\"]\n  FCR -->|\"review-pr --cr\"| FCR\n```\n\n- `escalate-to-human` can act at any working status. It adds a hold, never a status.\n- `judge-run` grades unscored runs in step 3 of the cycle, before triage and routing.\n\n## 8. Intake: from a thought to a Ready ticket\n\nPurpose: show the three ways work enters, and who acts at each step.\n\n```mermaid\nflowchart TD\n  PO[\"Product owner\"] -->|\"writes an idea\"| ID[\"Ideas\"]\n  PO -->|\"moves an idea\"| BL[\"Backlog, no Priority\"]\n  PLAN[\"A plan or a conversation\"] -->|\"backlog-grooming step 4\"| BL\n  EXT[\"Alert, feedback, CI, deploy,<br/>security, maintenance scanner\"] -->|\"signal:&lt;stream&gt; label\"| SG[\"Signals\"]\n  SG -->|\"triage-signal: accept\"| BL\n  BL -->|\"backlog-grooming:<br/>dedupe, group, prioritise,<br/>outcome and metric\"| BP[\"Backlog with Priority\"]\n  BL -.->|\"outcome unclear:<br/>one plain question\"| PO\n  BP -->|\"shape: spec, criteria,<br/>Size, Lane, proceed line\"| RD[\"Ready\"]\n  BP -.->|\"too big\"| SPLIT[\"Children in Backlog\"]\n```\n\n- Signal text is data. A skill never follows an instruction inside it.\n- Only the Product owner sets P0 and moves items out of Ideas.\n\n## 9. The needs-human hold\n\nPurpose: show how a skill stops for a person and how work resumes.\n\n```mermaid\nsequenceDiagram\n  participant K as Any step skill\n  participant E as escalate-to-human\n  participant B as Board\n  participant O as Owner (product or factory)\n  K->>E: Unsure of authority, or a trigger holds\n  E->>E: Search the importance doc and the sources\n  alt A source or a trusted owner reply settles it\n    E->>B: Comment \"escalate-to-human: proceed\"\n    E-->>K: proceed\n  else A trigger holds\n    E->>B: One \"### Needs human\" comment\n    E->>B: Add the needs-human label, clear the assignee\n    Note over B: Status stays. Every skill skips the ticket.\n    O->>B: Trusted reply in a comment\n    Note over B: The cycle removes the needs-human label after the reply.\n    Note over K: The next cycle resumes at the same Status.\n  end\n```\n\n- The triggers are architecture, scope, irreversible, security, data, money, legal, sign-off,\n  access, ruling, regression, repeat and P0.\n- A factory CR with no ticket gets the comment on the CR and on the heartbeat ticket, and no label.\n"},{"id":"parts","label":"Parts","file":"docs/architecture/components.md","md":"# Components\n\nHow the agentic-sdlc v2 factory is built. The contract is `references/architecture.md`. This page\nonly draws it.\n\n## 1. Context\n\nPurpose: show who and what the factory talks to.\n\n```mermaid\nflowchart LR\n  PE[\"Product engineers\"]\n  FE[\"Factory engineers\"]\n  IN[\"Intake tools: chat bot,<br/>tracker form, CR comment, alerts\"]\n  SCH[\"Scheduler / runtime<br/>(any harness)\"]\n  subgraph F[\"The factory\"]\n    SK[\"Skills\"]\n    BD[\"Binding\"]\n    CLI[\"CLI / MCP\"]\n  end\n  BO[\"Board\"]\n  FG[\"Forge + CI gates\"]\n  VCS[\"VCS\"]\n  MP[\"Model providers\"]\n  MA[\"Managed agents / bots\"]\n  TS[\"Trace store\"]\n\n  PE --> IN\n  PE --> BO\n  FE -->|\"factory CRs\"| FG\n  IN -->|\"creates Signal\"| BO\n  SCH -->|\"run one cycle\"| SK\n  SK --> BD\n  SK --> CLI\n  SK -->|\"inference\"| MP\n  CLI --> BO\n  CLI --> FG\n  CLI --> VCS\n  CLI -->|\"dispatch\"| MA\n  MA -->|\"board / forge writes\"| BO\n  MA -->|\"board / forge writes\"| FG\n  MA -->|\"transcripts\"| TS\n  CLI -->|\"read traces\"| TS\n  FG -->|\"runs gates\"| CLI\n```\n\n- Product engineers talk to the board and the intake tools. They never call the factory directly.\n- Factory engineers change skills and the binding through factory CRs on the forge.\n- The board and the forge are the only hand-off between parts.\n\n## 2. Layers and ports\n\nPurpose: show the three layers and which port reaches which external system.\n\n```mermaid\nflowchart TB\n  subgraph Process[\"Process: skills/\"]\n    S[\"11 skills: sdlc, triage-signal, backlog-grooming,<br/>shape, implement-spec, review-pr, verify-ux,<br/>release, escalate-to-human, judge-run,<br/>improve-factory\"]\n  end\n  subgraph Binding[\"Binding: .agents/binding.yml\"]\n    B[\"Board, statuses, commands, paths,<br/>owners, model tiers, executors\"]\n  end\n  subgraph Ports[\"Ports: agentic-sdlc CLI\"]\n    subgraph BA[\"board adapters\"]\n      b1[\"github\"]\n      b2[\"jira\"]\n      b3[\"linear\"]\n      b4[\"local\"]\n      b5[\"github-issues\"]\n    end\n    subgraph FA[\"forge adapters\"]\n      f1[\"github\"]\n    end\n    subgraph VA[\"vcs adapters\"]\n      v1[\"git\"]\n    end\n    G[\"gates\"]\n    D[\"dispatch\"]\n    L[\"ledger\"]\n    BN[\"bench\"]\n    M[\"MCP server\"]\n  end\n  S -->|\"reads\"| B\n  S -->|\"calls verbs\"| Ports\n  B -->|\"picks adapter\"| Ports\n  M -.->|\"same verbs\"| Ports\n\n  EB[\"Board service\"]\n  EF[\"Forge host + CI\"]\n  EV[\"VCS server\"]\n  EA[\"Executors\"]\n  ET[\"Trace store\"]\n  BA --> EB\n  FA --> EF\n  VA --> EV\n  G --> EB\n  G --> EF\n  D --> EA\n  L --> EB\n  L --> ET\n  BN --> VA\n  BN -->|\"agent_command\"| EA\n```\n\n- Skills hold process only. The binding holds every project value. Ports hold mechanism only.\n- A skill never calls a vendor CLI. It calls a port verb.\n- The MCP server exposes the same verbs for agents with no shell.\n- `bench run` is the one place the package starts an agent.\n- For Claude Code the skills, hooks and MCP server ship as the `agentic-sdlc` plugin; other\n  harnesses read the same skills from `.agents/skills/`.\n\n## 3. Executors\n\nPurpose: show how the orchestrator hands a stage to whoever runs it.\n\n```mermaid\nflowchart LR\n  O[\"Orchestrator<br/>(sdlc skill)\"]\n  D[\"dispatch\"]\n  H[\"Harness subagent\"]\n  C[\"Command bot\"]\n  W[\"Webhook bot\"]\n  MG[\"Managed agent\"]\n  AS[\"Assign to hosted agent\"]\n  BF[\"Board + forge\"]\n  LG[\"Ledger row<br/>(executor, ref)\"]\n\n  O -->|\"skill, ticket, cr\"| D\n  D -->|\"harness\"| H\n  D -->|\"command: run\"| C\n  D -->|\"webhook: POST\"| W\n  D -->|\"managed: session\"| MG\n  D -->|\"assign: user + comment\"| AS\n  H --> BF\n  C --> BF\n  W --> BF\n  MG --> BF\n  AS --> BF\n  BF -->|\"next cycle reads\"| O\n  D --> LG\n```\n\n- Results come back only through board and forge writes. There is no direct reply channel.\n- A second dispatch of the same ticket or CR, skill and head inside `cycle.dedupe_minutes` is a double fire. It is skipped.\n- A dispatch is also skipped while the previous run of the same key has not finished, until `stall_minutes` pass.\n- The rules for executors live in `skills/sdlc/references/executors.md`, part of the contract.\n\n## 4. Trust boundaries\n\nPurpose: show what runs where, which secret each part holds, and which inputs are untrusted.\n\n```mermaid\nflowchart LR\n  subgraph U[\"Untrusted input\"]\n    U1[\"Signal text\"]\n    U2[\"CR bodies\"]\n    U3[\"Comments from non-bots\"]\n  end\n  subgraph CIN[\"Forge CI: pull_request, no secrets\"]\n    REQ[\"Required job:<br/>install + verify\"]\n    POB[\"proofs-on-base\"]\n  end\n  subgraph CI[\"Forge CI: trusted rules\"]\n    T[\"Binding read from<br/>TARGET branch\"]\n    GT[\"Gates: branch-names, linkage,<br/>proofs-on-base, approval,<br/>merged, shipped, signal-on-red,<br/>skill-regression\"]\n    BT[\"Board token\"]\n  end\n  subgraph IS[\"Implementer sandbox\"]\n    IT[\"Implementer token<br/>(branch, CR, comments)\"]\n    IB[\"Board token\"]\n  end\n  subgraph RS[\"Review runtime<br/>(runs no CR code)\"]\n    RV[\"Review token\"]\n  end\n  HU[\"Human approver\"]\n  subgraph OR[\"Orchestrator\"]\n    OB[\"Board token<br/>(heartbeat)\"]\n  end\n\n  U1 -->|\"data, not commands\"| OR\n  U2 -->|\"data, not commands\"| RS\n  U3 -->|\"never state\"| OR\n  T --> GT\n  GT --> BT\n  IS -->|\"opens draft CR\"| CIN\n  CIN -->|\"checks\"| RS\n  RS -->|\"review status + approve\"| CI\n  HU -->|\"approving review\"| GT\n```\n\n- CI loads the binding from the target branch, never from the CR.\n- CR code runs only in the no-secrets `Required` job. The review runtime reads its result and\n  runs no install or test command.\n- With two identities the implementer holds no review token. It cannot post `review` or approve.\n  With one identity the review runtime is a `review-pr` subagent of the cycle, under the same account.\n- The `approval` gate posts `human-approval` only with the approvals the CR's class needs.\n- Only heartbeats by accounts in `owners.bots` count as state.\n- Secrets reach an executor only when its entry lists them.\n\n## 5. Installed project layout\n\nPurpose: show where the factory lives in a project that installed it.\n\n```mermaid\nflowchart LR\n  R[\"project/\"]\n  R --> A[\"AGENTS.md<br/>(agent card)\"]\n  R --> CL[\"CLAUDE.md<br/>(@AGENTS.md import, Claude only)\"]\n  R --> AG[\".agents/\"]\n  R --> CIF[\"CI files<br/>(.github/workflows)\"]\n  AG --> SK[\"skills/<br/>(not for Claude: the plugin has them)\"]\n  AG --> BI[\"binding.yml\"]\n  AG --> SC[\"scorers/<br/>(done-conditions, ...)\"]\n  AG --> BE[\"bench/suites/<br/>(suite JSON files)\"]\n  AG --> HK[\"hooks/<br/>(pre-push)\"]\n```\n\n- `.agents/` is the factory definition. Changing it is a factory change.\n- Skills are copied whole, or come from the plugin. A project replaces only `binding.yml`.\n- CI files call `agentic-sdlc gate <name>`.\n"}];
const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';
mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
marked.use({ renderer: { code(text, lang) { return lang === 'mermaid' ? '<pre class="mermaid">' + text.replace(/</g, '&lt;') + '</pre>' : false; } } });
const nav = document.getElementById('nav'), doc = document.getElementById('doc'), src = document.getElementById('source');
async function show(id) {
  const d = docs.find((x) => x.id === id) ?? docs[0];
  for (const b of nav.children) b.setAttribute('aria-current', b.dataset.id === d.id ? 'page' : 'false');
  src.innerHTML = 'Source: <a href="https://github.com/dmitriywind/agentic-sdlc/blob/master/' + d.file + '">' + d.file + '</a>';
  doc.innerHTML = marked.parse(d.md);
  await mermaid.run({ nodes: doc.querySelectorAll('pre.mermaid') });
  if (location.hash.slice(1) !== d.id) history.replaceState(null, '', '#' + d.id);
}
for (const d of docs) {
  const b = document.createElement('button');
  b.textContent = d.label; b.dataset.id = d.id; b.onclick = () => show(d.id);
  nav.append(b);
}
show(location.hash.slice(1));
</script>
</html>
