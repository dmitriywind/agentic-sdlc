# Merge into your bitbucket-pipelines.yml. Secrets: AGENTIC_FORGE_TOKEN, AGENTIC_BOARD_TOKEN,
# AGENTIC_REVIEW_TOKEN as secured variables of the deployment environment `agentic-gates`
# (Repository settings > Deployments), so only steps with `deployment: agentic-gates` read them.
# The Required and proofs-on-base steps run the PR's code and have no deployment, so no secret.
# Branch restrictions on the trunk: merge check "successful build", 1 approval (the review identity's
# forge approve), reset approvals on change, squash/fast-forward only, no direct push except the bot.
# Bitbucket has no native auto-merge: the custom pipeline below is it.
# PR steps read the binding from the TARGET branch (a git worktree of it is --root), never the PR's copy.
# set: vcs.trunk (main), vcs.release_prefix (release/), and your deploy commands.
image: node:22

definitions:
  # Pinned CLI: the project's agentic-sdlc devDependency through `npm ci`; else AGENTIC_SDLC_VERSION (set it to an exact version).
  scripts:
    - &agentic-cli >-
      if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null;
      then npm ci --ignore-scripts && export PATH="$PWD/node_modules/.bin:$PATH";
      else npm i -g "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.0}"; fi
    - &target-root >-
      git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH" &&
      export AGENTIC_ROOT="$(mktemp -d)/target" &&
      git worktree add --detach "$AGENTIC_ROOT" "origin/$BITBUCKET_PR_DESTINATION_BRANCH" &&
      test -f "$AGENTIC_ROOT/.agents/binding.yml"

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step:
              name: Required
              script:
                - npm ci     # set: the binding's commands.install
                - npm test   # set: the binding's commands.verify
          - step:
              name: proofs-on-base
              clone:
                depth: full
              script:
                - npm ci     # set: the binding's commands.install (puts the pinned agentic-sdlc devDependency in node_modules)
                - export PATH="$PWD/node_modules/.bin:$PATH"
                - command -v agentic-sdlc >/dev/null || npm i -g "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.0}"
                # The step's own result is the check; the named status needs a minimal forge token as AGENTIC_FORGE_TOKEN.
                - agentic-sdlc gate proofs-on-base --cr "$BITBUCKET_PR_ID"
          - step:
              name: ticket-linkage
              deployment: agentic-gates
              clone:
                depth: full
              script:
                - *target-root
                - cd "$AGENTIC_ROOT"   # not from the PR tree: its .npmrc is untrusted
                - *agentic-cli
                - cd "$BITBUCKET_CLONE_DIR"
                - agentic-sdlc --root "$AGENTIC_ROOT" gate branch-names --ref "$BITBUCKET_BRANCH"
                - agentic-sdlc --root "$AGENTIC_ROOT" gate linkage --cr "$BITBUCKET_PR_ID"
                # Posts status human-approval; the worktree shares this clone's objects, so the PR head is readable.
                - agentic-sdlc --root "$AGENTIC_ROOT" gate approval --cr "$BITBUCKET_PR_ID"
                - agentic-sdlc --root "$AGENTIC_ROOT" gate board-sync --cr "$BITBUCKET_PR_ID" --event ready
                - if git diff --name-only "origin/$BITBUCKET_PR_DESTINATION_BRANCH...HEAD" | grep -q '^\.agents/'; then agentic-sdlc gate skill-regression; fi
  branches:
    main:   # set: your vcs.trunk
      - step:
          name: merged
          deployment: agentic-gates
          script:
            - *agentic-cli
            - agentic-sdlc gate board-sync --sha "$BITBUCKET_COMMIT" --event merged
      # Shipped follows the deploy's real result: after-script runs on success and on failure.
      - step:
          name: deploy first-env
          clone:
            depth: full   # shipped walks the full history and tags
          script:
            - echo "set: your first-environment deploy here"
          after-script:
            - *agentic-cli
            - git config user.name "agentic-sdlc" && git config user.email "agentic-sdlc@noreply.invalid"
            # set: first-env must match product.environments in the binding; the deploy's own deployment must hold the agentic tokens
            - if [ "$BITBUCKET_EXIT_CODE" = 0 ]; then R=success; else R=failure; fi
            - agentic-sdlc gate shipped first-env --sha "$BITBUCKET_COMMIT" --result "$R"
    'release/*':   # set: your vcs.release_prefix
      - step:
          name: in-release
          deployment: agentic-gates
          script:
            - *agentic-cli
            - agentic-sdlc gate board-sync --event in-release --release "${BITBUCKET_BRANCH#release/}"
      - step:
          name: deploy last-env
          clone:
            depth: full
          script:
            - echo "set: your last-environment deploy here"
          after-script:
            - *agentic-cli
            - git config user.name "agentic-sdlc" && git config user.email "agentic-sdlc@noreply.invalid"
            # set: last-env must match product.environments in the binding
            - if [ "$BITBUCKET_EXIT_CODE" = 0 ]; then R=success; else R=failure; fi
            - agentic-sdlc gate shipped last-env --sha "$BITBUCKET_COMMIT" --result "$R"
  custom:
    agentic-approval:
      # Bitbucket starts no pipeline on an approval: a repository webhook ("Pull request: approved",
      # "approval removed") to a relay that runs this pipeline through the API with variable CR=<pr id>.
      - variables:
          - name: CR
      - step:
          name: human-approval
          deployment: agentic-gates
          clone:
            depth: full
          script:
            - *agentic-cli
            - agentic-sdlc gate approval --cr "$CR"
    agentic-automerge:
      # Schedule it (Pipelines > Schedules, every few minutes). Merges open CRs whose body carries
      # the marker `<!-- agentic-sdlc:automerge -->` once their checks are green.
      - step:
          name: automerge
          deployment: agentic-gates
          script:
            - *agentic-cli
            - >-
              agentic-sdlc forge list --state open |
              node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).filter(c=>!c.draft&&(c.body||'').includes('<!-- agentic-sdlc:automerge -->')).forEach(c=>console.log(c.n)))" |
              while read n; do agentic-sdlc forge automerge "$n" || true; done
