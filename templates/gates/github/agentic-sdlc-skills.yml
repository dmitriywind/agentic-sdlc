name: agentic-sdlc skill regression
# Reads the PR's .agents/skills files with the published CLI. Plain pull_request: no secrets, read-only
# token, so the PR's own copy of this file can do no harm. The job always runs, so the required check
# skill-regression is green on a CR that does not touch .agents/**.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  skill-regression:
    name: skill-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: factory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -q '^\.agents/'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.factory.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.factory.outputs.run == 'true'
        run: npm i -g "agentic-sdlc@${AGENTIC_SDLC_VERSION:-next}" && agentic-sdlc gate skill-regression
