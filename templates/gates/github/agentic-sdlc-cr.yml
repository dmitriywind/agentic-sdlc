name: agentic-sdlc CR gate
# Event -> gate wiring only. Process rules live in the CLI and the binding.
# Required checks (ruleset.trunk.json): job "ticket-linkage" here; status "human-approval" posted here by
# `gate approval`; "Required", "proofs-on-base" and "skill-regression" come from agentic-sdlc-verify.yml;
# "review" is posted by `forge verdict` (the review runtime; with one identity, the gate review-gate from the report).
# pull_request_target: this file and the binding come from the base branch, so a PR cannot change
# what runs with these secrets. The PR's code is never checked out or run here; its number, head ref
# and head sha reach the gates only as data (env).
# AGENTIC_REVIEW_TOKEN lives only in Environment `agentic-review`, whose deployment-branch rule names the
# trunk exactly, `gh-readonly-queue/<trunk>/*` (the merge queue ref) and the release line glob. No job that a PR-ref event runs can
# read it: a review event reaches `human-approval` through the no-secret `agentic-sdlc review event` workflow
# (agentic-sdlc-review-event.yml, installed by init) and workflow_run, which runs from the default branch. A fork PR's approval status updates
# on the next pull_request_target event or a re-run.
# merge_group runs the queue commit's own copy of this file, with the review Environment: a change to
# .github/** takes effect there. Keep `.github/**` in paths.factory (the guardrail class: factory-owner approval).
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, edited]
  workflow_run:
    workflows: ["agentic-sdlc review event"]
    types: [completed]
  merge_group:   # merge queue: carries the PR head's review statuses to the queue commit
  issue_comment: # one identity: a verdict report becomes the review status (job review-gate)
    types: [created]

permissions: {}

concurrency:
  # No job here moves the board (skills and the trunk-push merged gate do), so a newer event replaces an older run.
  # A fork's workflow_run has no PR number: its run id keeps fork review events apart. An issue_comment run is
  # never cancelled and has its own group (any commenter could otherwise cancel a review gate).
  group: agentic-cr-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.event.merge_group.head_sha }}-${{ github.event_name }}${{ github.event.comment.id && format('-{0}', github.event.comment.id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

defaults:
  run:
    shell: bash   # self-hosted Windows runners default to PowerShell
jobs:
  ticket-linkage:
    # Posts status ticket-linkage on the head with this job's GITHUB_TOKEN (the Actions app the ruleset pins).
    name: linkage-gate
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read      # the board: a github-issues board on a private repo
      checks: read
      statuses: write
    env:
      # Secret names the binding's options point at: board token_env. The forge token is this job's own GITHUB_TOKEN. No review token here.
      GH_TOKEN: ${{ github.token }}
      AGENTIC_FORGE_TOKEN: ${{ github.token }}
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      CR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Base branch only: the binding in force is the trunk's, not the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Branch names
        if: github.event_name != 'merge_group'
        run: |
          # A ref that starts with - could be read as an option.
          case "$HEAD_REF" in -*) echo "::error::branch name starts with -"; exit 1 ;; esac
          .agents/bin/agentic-sdlc gate branch-names --ref "$HEAD_REF"

      - name: Ticket linkage on the queue commit
        # A merge queue commit needs every required context; linkage was proven on the PR head.
        if: github.event_name == 'merge_group'
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUE_SHA" -f state=success -f context=ticket-linkage -f description='proven on the PR head' >/dev/null

      - name: Ticket linkage
        if: github.event_name != 'merge_group' && github.event.pull_request.draft == false
        run: .agents/bin/agentic-sdlc gate linkage --cr "$CR"


  human-approval:
    # Posts status human-approval on the head (with the review identity's token; with one identity, no
    # forge.review_identity, with this job's token): computes the class and checks the approving reviews
    # the class needs. Runs on a PR event and, via workflow_run, on a review event.
    name: approval-gate
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
    environment: agentic-review
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read      # the closing ticket's Lane
      checks: read      # forge view reads the head's check runs
      statuses: write   # one identity: the gate posts with this job's token
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ github.token }}   # one identity posts human-approval with this job's token (pinned to Actions)
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      # Empty on a fork PR's review event: every step after checkout is then skipped.
      CR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      # Base branch only: the binding in force is the trunk's, not the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # The PR head as data only: its objects let `gate approval` read the head's files; it is never checked out or run.
      - name: Fetch PR head objects
        if: env.CR != ''
        # persist-credentials is off, so a private repo needs the job token for this one fetch.
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)" fetch --no-tags origin "+refs/pull/$CR/head:refs/remotes/pr/head"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CR != ''
        with:
          node-version: 22
      - name: Human approval
        if: env.CR != ''
        run: .agents/bin/agentic-sdlc gate approval --cr "$CR"

  review-gate:
    # One identity: posts status review on the head from the newest trusted verdict report for it,
    # with this job's token (a Claude cloud session cannot write statuses). Runs on a new report and on
    # every PR event, so `forge ready` after an earlier report also gets the status. `gate review` does nothing
    # with two identities. issue_comment runs this file from the default branch; no PR code runs here.
    name: review-gate
    if: (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '<!-- review-pr ')) || github.event_name == 'pull_request_target'
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTIC_FORGE_TOKEN: ${{ github.token }}
      CR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Review status from the report
        run: .agents/bin/agentic-sdlc gate review --cr "$CR"

  agent-provenance:
    # Posts status agent-provenance on the head with this job's token: every agent commit of the CR carries
    # the Agent-Run and Agent-Model trailers (forge.provenance warn | require; off does nothing). It reads the
    # CR's commits through the API; no PR code is checked out or run. Add it to forge.required_checks and the
    # trunk ruleset only with provenance: require. A squash merge drops the trailers: this status is the record.
    name: agent-provenance
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # no secrets: only this job's token
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGENTIC_FORGE_TOKEN: ${{ github.token }}
      CR: ${{ github.event.pull_request.number }}
    steps:
      # Base branch only: the binding in force is the trunk's, not the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Agent provenance on the queue commit
        # A merge queue commit needs every required context; the trailers were checked on the PR head.
        if: github.event_name == 'merge_group'
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUE_SHA" -f state=success -f context=agent-provenance -f description='checked on the PR head' >/dev/null
      - name: Agent provenance
        if: github.event_name == 'pull_request_target'
        run: .agents/bin/agentic-sdlc gate provenance --cr "$CR"

  carry-statuses:
    # A merge queue needs every required check on its own commit. Required, proofs-on-base and
    # skill-regression run there (agentic-sdlc-verify.yml); review and human-approval were earned on
    # the PR head, so copy their state with the same token that posted them.
    name: carry-statuses
    if: github.event_name == 'merge_group'
    environment: agentic-review
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Carry PR statuses to the queue commit
        env:
          GH_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          n=$(echo "$QUEUE_REF" | sed -n 's|.*/pr-\([0-9]*\)-.*|\1|p')
          head=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          for ctx in review human-approval; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" -q ".statuses[] | select(.context == \"$ctx\") | .state" | head -n1)
            gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUE_SHA" -f state="${state:-pending}" -f context="$ctx" -f description="from PR #$n head" >/dev/null
          done
