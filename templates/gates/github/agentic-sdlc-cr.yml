name: agentic-sdlc CR gate
# Event -> gate wiring only. Process rules live in the CLI and the binding.
# Required checks (ruleset.trunk.json): job "ticket-linkage" here; status "human-approval" posted here by
# `gate approval`; "Required", "proofs-on-base" and "skill-regression" come from agentic-sdlc-verify.yml;
# "review" is posted by review-pr in the review runtime.
# pull_request_target: this file and the binding come from the base branch, so a PR cannot change
# what runs with these secrets. The PR's code is never checked out or run here; its number, head ref
# and head sha reach the gates only as data (env).
# AGENTIC_REVIEW_TOKEN lives only in Environment `agentic-review`, whose deployment-branch rule names the
# trunk exactly, `gh-readonly-queue/<trunk>/*` (the merge queue ref) and the release line glob. No job that a PR-ref event runs can
# read it: a review event reaches `human-approval` through the no-secret `agentic-sdlc review event` workflow
# (agentic-sdlc-review-event.yml, installed by init) and workflow_run, which runs from the default branch. A fork PR's approval status updates
# on the next pull_request_target event or a re-run.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, edited]
  workflow_run:
    workflows: ["agentic-sdlc review event"]
    types: [completed]
  merge_group:   # merge queue: carries the PR head's review statuses to the queue commit

permissions: {}

concurrency:
  # No job here moves the board (skills and the trunk-push merged gate do), so a newer event replaces an older run.
  group: agentic-cr-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.merge_group.head_sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ticket-linkage:
    # Posts status ticket-linkage on the head with this job's GITHUB_TOKEN (the Actions app the ruleset pins).
    name: linkage-gate
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: write
    env:
      # Secret names the binding's options point at: board token_env. The forge token is this job's own GITHUB_TOKEN. No review token here.
      GH_TOKEN: ${{ github.token }}
      AGENTIC_FORGE_TOKEN: ${{ github.token }}
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_SDLC_VERSION: ${{ vars.AGENTIC_SDLC_VERSION }}
      CR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Base branch only: the binding in force is the trunk's, not the PR's.
      # pin to a commit SHA (actions/checkout, actions/setup-node)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agentic-sdlc (the trunk's pinned devDependency)
        run: |
          if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then
            npm ci --ignore-scripts && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            # set: repo variable AGENTIC_SDLC_VERSION to an exact version, or add agentic-sdlc as a devDependency
            npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.3}"
          fi

      - name: Branch names
        if: github.event_name != 'merge_group'
        run: agentic-sdlc gate branch-names --ref "$HEAD_REF"

      - name: Ticket linkage on the queue commit
        # A merge queue commit needs every required context; linkage was proven on the PR head.
        if: github.event_name == 'merge_group'
        env:
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUE_SHA" -f state=success -f context=ticket-linkage -f description='proven on the PR head' >/dev/null

      - name: Ticket linkage
        if: github.event_name != 'merge_group' && github.event.pull_request.draft == false
        run: agentic-sdlc gate linkage --cr "$CR"


  human-approval:
    # Posts status human-approval on the head (with the review identity's token): computes the class and
    # checks the approving reviews the class needs. Runs on a PR event and, via workflow_run, on a review event.
    name: approval-gate
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
    environment: agentic-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN || github.token }}
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_SDLC_VERSION: ${{ vars.AGENTIC_SDLC_VERSION }}
      # Empty on a fork PR's review event: every step after checkout is then skipped.
      CR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      # Base branch only: the binding in force is the trunk's, not the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # The PR head as data only: its objects let `gate approval` read the head's files; it is never checked out or run.
      - name: Fetch PR head objects
        if: env.CR != ''
        run: git fetch --no-tags origin "+refs/pull/$CR/head:refs/remotes/pr/head"
      - uses: actions/setup-node@v4
        if: env.CR != ''
        with:
          node-version: 22
      - name: Install agentic-sdlc (the trunk's pinned devDependency)
        if: env.CR != ''
        run: |
          if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then
            npm ci --ignore-scripts && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            # set: repo variable AGENTIC_SDLC_VERSION to an exact version, or add agentic-sdlc as a devDependency
            npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.3}"
          fi
      - name: Human approval
        if: env.CR != ''
        run: agentic-sdlc gate approval --cr "$CR"

  carry-statuses:
    # A merge queue needs every required check on its own commit. Required, proofs-on-base and
    # skill-regression run there (agentic-sdlc-verify.yml); review and human-approval were earned on
    # the PR head, so copy their state with the same token that posted them.
    name: carry-statuses
    if: github.event_name == 'merge_group'
    environment: agentic-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Carry PR statuses to the queue commit
        env:
          GH_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          n=$(echo "$QUEUE_REF" | sed -n 's|.*/pr-\([0-9]*\)-.*|\1|p')
          head=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          for ctx in review human-approval; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" -q ".statuses[] | select(.context == \"$ctx\") | .state" | head -n1)
            gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUE_SHA" -f state="${state:-pending}" -f context="$ctx" -f description="from PR #$n head" >/dev/null
          done
