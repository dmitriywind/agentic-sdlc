name: agentic-sdlc delivery
# Deploy runs -> shipped. CI runs -> signal-on-red. Trunk push -> merged (the only gate that moves a ticket to Done).
# A release/** push runs that branch's copy of this file: import .github/rulesets/release.json so only the release bot creates or updates release lines.
on:
  workflow_run:
    # set: your staging deploy workflow name, your production deploy workflow name, your trunk CI workflow name
    workflows: ["Deploy staging", "Deploy production", "CI"]
    types: [completed]
  push:
    # set: your vcs.trunk
    branches: [main]

# No concurrency group: GitHub keeps one pending run per group and cancels older ones, which would drop
# events. The gates read a ticket again before each write and never lower Shipped, so runs may overlap.

permissions:
  contents: write   # gate shipped tags the released revision
  issues: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN || github.token }}
  AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  RUN_NAME: ${{ github.event.workflow_run.name }}
  RUN_ID: ${{ github.event.workflow_run.id }}
  RUN_SHA: ${{ github.event.workflow_run.head_sha }}
  TRUNK: main   # set: your vcs.trunk (doctor checks it)
  RELEASE_PREFIX: release/   # set: your vcs.release_prefix (doctor checks it)
  DELIVERY: release-line   # set: your product.delivery (doctor checks it)
  VERSION: ""   # set: an artifact version expression for continuous delivery, e.g. ${{ github.run_number }}; empty for none

defaults:
  run:
    shell: bash   # self-hosted Windows runners default to PowerShell
jobs:
  delivery:
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 10
    steps:
      # pin to a commit SHA (actions/checkout, actions/setup-node)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # shipped walks the full history and tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agentic-sdlc (the pinned devDependency)
        env:
          AGENTIC_SDLC_VERSION: ${{ vars.AGENTIC_SDLC_VERSION }}
        run: |
          if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then
            npm ci --ignore-scripts && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          else
            npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.5}"   # set: AGENTIC_SDLC_VERSION to an exact version
          fi
      - name: Git identity for tags
        run: |
          git config user.name "agentic-sdlc"
          git config user.email "agentic-sdlc@users.noreply.github.com"

      - name: Shipped
        # Only a deploy of the trunk or a release line ships; a PR or manual run of the same workflow never does.
        # set: widen only to events that deploy those branches.
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == env.TRUNK || startsWith(github.event.workflow_run.head_branch, env.RELEASE_PREFIX))
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Only a real result counts: skipped, cancelled, action_required and the rest are no deploy.
          case "$CONCLUSION" in
            success) result=success ;;
            failure|timed_out) result=failure ;;
            *) echo "conclusion $CONCLUSION: nothing shipped"; exit 0 ;;
          esac
          # set: the deploy/publish workflow for the first environment; its env name must match product.environments
          if [ "$RUN_NAME" = "Deploy staging" ]; then agentic-sdlc gate shipped first-env --sha "$RUN_SHA" --result "$result"; fi
          # set: the deploy/publish workflow for the last environment; its env name must match product.environments
          # The last environment ships from a release line, or from the trunk under continuous delivery.
          if [ "$RUN_NAME" = "Deploy production" ]; then
            case "$DELIVERY:$HEAD_BRANCH" in
              release-line:"$RELEASE_PREFIX"*) agentic-sdlc gate shipped last-env --sha "$RUN_SHA" --result "$result" ;;
              continuous:"$TRUNK")
                # Continuous delivery has no release ready check: missing release evidence reports the deploy as failed.
                if [ "$result" = success ] && ! agentic-sdlc gate evidence --sha "$RUN_SHA"; then result=failure; fi
                agentic-sdlc gate shipped last-env --sha "$RUN_SHA" --result "$result" ${VERSION:+--version "$VERSION"} ;;
            esac
          fi

      - name: Signal on red
        # Trunk and release pushes of CI only: a red PR run is the CR's business, and a red deploy is shipped's Signal.
        # set: your trunk CI workflow name
        if: >-
          github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'CI' &&
          (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
          (github.event.workflow_run.head_branch == env.TRUNK || startsWith(github.event.workflow_run.head_branch, env.RELEASE_PREFIX))
        run: agentic-sdlc gate signal-on-red --run "$RUN_ID"

      - name: Merged
        if: github.event_name == 'push' && github.ref_name == env.TRUNK
        run: agentic-sdlc gate merged --sha "$GITHUB_SHA"
