# Include from .gitlab-ci.yml:  include: { local: .gitlab/agentic-sdlc.yml }
# Secrets: AGENTIC_FORGE_TOKEN, AGENTIC_BOARD_TOKEN, AGENTIC_REVIEW_TOKEN as CI/CD variables that are
# Protected, Masked and hidden; keep "protected variables in MR pipelines" off. Environment scope is a name
# match that an MR can declare in its own .gitlab-ci.yml, so it is no boundary on its own. Protected
# variables do not reach MR pipelines, so the secret-holding gates (ticket-linkage, human-approval) must run
# from the trigger relay on the default branch. Known limitation, tracked for the next release. No MR job moves the board.
# Project settings: "Pipelines must succeed", fast-forward merge, merge trains on the trunk. Required
# checks: ticket-linkage, Required, proofs-on-base, review, human-approval, skill-regression.
# Event -> gate wiring only.
# set: your deploy job names (deploy-staging, deploy-production) and vcs.release_prefix (release/).

# Pinned CLI: the project's agentic-sdlc devDependency through `npm ci`; else AGENTIC_SDLC_VERSION (set it to an exact version).
.agentic-cli: &agentic-cli
  - |
    if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then
      npm ci --ignore-scripts && export PATH="$PWD/node_modules/.bin:$PATH"
    else
      npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.4}"
    fi

.agentic:
  image: node:22
  environment: { name: agentic-gates, action: access }
  variables:
    GIT_DEPTH: "0"   # shipped walks the full history and tags
  before_script:
    - *agentic-cli
    - git config user.name "agentic-sdlc" && git config user.email "agentic-sdlc@noreply.invalid"

# MR jobs read the binding (and the CLI) from the TARGET branch, never the MR's copy:
# a git worktree of origin/<target> is the --root every gate below runs against.
.agentic-mr:
  extends: .agentic
  # The worktree shares this checkout's objects, so the MR head sha stays readable as data (gate approval).
  before_script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export AGENTIC_ROOT="$(mktemp -d)/target"
    - git worktree add --detach "$AGENTIC_ROOT" "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - test -f "$AGENTIC_ROOT/.agents/binding.yml"
    - cd "$AGENTIC_ROOT"   # not from the MR tree: its .npmrc is untrusted
    - *agentic-cli
    - cd "$CI_PROJECT_DIR"

# Runs the MR's code with no secret (no environment).
Required:
  image: node:22
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci     # set: the binding's commands.install
    - npm test   # set: the binding's commands.verify

# The MR's new or changed proofs against the merge base's product code; posts status proofs-on-base.
# No environment, so no agentic secret: the job's own result is the check ("Pipelines must succeed").
# AGENTIC_READ_TOKEN: a project access token with Reporter role and read_api scope only, masked and not
# protected, because MR code can read it and it must be unable to post statuses.
proofs-on-base:
  image: node:22
  stage: test
  variables:
    GIT_DEPTH: "0"
    AGENTIC_FORGE_TOKEN: $AGENTIC_READ_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci     # set: the binding's commands.install (puts the pinned agentic-sdlc devDependency in node_modules)
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - command -v agentic-sdlc >/dev/null || npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.4}"
    - agentic-sdlc gate proofs-on-base --cr "$CI_MERGE_REQUEST_IID"

ticket-linkage:
  extends: .agentic-mr
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - agentic-sdlc --root "$AGENTIC_ROOT" gate branch-names --ref "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - agentic-sdlc --root "$AGENTIC_ROOT" gate linkage --cr "$CI_MERGE_REQUEST_IID"

# Posts status human-approval. GitLab starts no pipeline on an approval: add a project webhook
# (Merge request events, action approved/unapproved) to a relay that calls the pipeline trigger API with
# AGENTIC_EVENT=approval and AGENTIC_CR=<iid>, or re-run the MR pipeline after approving.
# (GitLab approval rules, Premium, can enforce the human approval natively instead.)
human-approval:
  extends: .agentic-mr
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: { AGENTIC_CR: $CI_MERGE_REQUEST_IID }
    - if: $CI_PIPELINE_SOURCE == "trigger" && $AGENTIC_EVENT == "approval"
  before_script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - export AGENTIC_ROOT="$(mktemp -d)/target"
    - git worktree add --detach "$AGENTIC_ROOT" "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
    - cd "$AGENTIC_ROOT"
    - *agentic-cli
    - cd "$CI_PROJECT_DIR"
  script:
    - agentic-sdlc --root "$AGENTIC_ROOT" gate approval --cr "$AGENTIC_CR" --fail-pending

# Reads the MR's own .agents/skills (static file checks with the pinned CLI). No secret.
skill-regression:
  image: node:22
  stage: test
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" | grep -q '^\.agents/'; then
        if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then npm ci --ignore-scripts && export PATH="$PWD/node_modules/.bin:$PATH"; else npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.4}"; fi
        agentic-sdlc gate skill-regression
      fi

# Trunk pipeline after a merge. set: your trunk branch if it is not the default branch.
merged:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - agentic-sdlc gate merged --sha "$CI_COMMIT_SHA"

# Shipped follows the deploy job's real result: on_success / on_failure evaluate the jobs in needs.
# set: first-env and last-env must match product.environments in the binding
shipped-first-env:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  needs: [deploy-staging]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - agentic-sdlc gate shipped first-env --sha "$CI_COMMIT_SHA" --result success

shipped-first-env-failed:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  needs: [deploy-staging]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - agentic-sdlc gate shipped first-env --sha "$CI_COMMIT_SHA" --result failure

# The last environment deploys from the release line.
shipped-last-env:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  needs: [deploy-production]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\//
      when: on_success
  script:
    - agentic-sdlc gate shipped last-env --sha "$CI_COMMIT_SHA" --result success

shipped-last-env-failed:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  needs: [deploy-production]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\//
      when: on_failure
  script:
    - agentic-sdlc gate shipped last-env --sha "$CI_COMMIT_SHA" --result failure

signal-on-red:
  extends: .agentic
  resource_group: agentic-board   # trunk jobs that write the same tickets run one at a time
  stage: .post
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - agentic-sdlc gate signal-on-red --run "$CI_PIPELINE_ID"

# The factory cycle and review pipelines: templates/runner/gitlab-ci-cycle.yml.
