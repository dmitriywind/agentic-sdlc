# PR validation build. Secrets (secret pipeline variables): AGENTIC_FORGE_TOKEN, AGENTIC_BOARD_TOKEN, AGENTIC_REVIEW_TOKEN.
# A secret variable reaches a script only through its env mapping, so the Required and proofs_on_base
# jobs, which run the PR's code, hold none.
# Branch policy on the trunk (Repos > Branches > Branch policies), set once by hand:
#   - Build validation: this pipeline, required, display name "Required" (its gates job is ticket-linkage)
#   - Status checks, required: agentic-sdlc/proofs-on-base, agentic-sdlc/review, agentic-sdlc/human-approval
#   - Minimum reviewers 1 (the review identity's vote via forge approve); reset votes on new pushes
#   - Merge types: squash or rebase only (linear history); no direct push except the bot
#   - Auto-complete allowed
# Event -> gate wiring only. PR validation runs when the PR opens and on every push.
# The gates read the binding from the TARGET branch (a git worktree of it is --root), never the PR's copy.
# A reviewer's vote starts no build: add a Service hook on "Pull request updated" (reviewer vote changed)
# queuing this pipeline's gates job, or `gate approval --cr <n>`, so human-approval follows the votes.
trigger: none
pr:
  branches:
    include: [main]   # set: your vcs.trunk

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Required
    steps:
      - checkout: self
      - task: NodeTool@0
        inputs: { versionSpec: 22.x }
      - script: npm ci     # set: the binding's commands.install
        displayName: install
      - script: npm test   # set: the binding's commands.verify
        displayName: verify

  - job: proofs_on_base
    displayName: proofs-on-base
    steps:
      - checkout: self
        fetchDepth: 0
      - task: NodeTool@0
        inputs: { versionSpec: 22.x }
      - script: npm ci     # set: the binding's commands.install (puts the pinned agentic-sdlc devDependency in node_modules)
        displayName: install
      - script: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          command -v agentic-sdlc >/dev/null || npm i -g "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.0}"
          agentic-sdlc gate proofs-on-base --cr "$SYSTEM_PULLREQUEST_PULLREQUESTID"
        displayName: proofs-on-base
        env:
          AGENTIC_FORGE_TOKEN: $(System.AccessToken)   # the build's own repo-scoped token, to post the status

  - job: gates
    displayName: ticket-linkage
    steps:
      - checkout: self
        fetchDepth: 0
      - task: NodeTool@0
        inputs: { versionSpec: 22.x }
      - script: |
          TARGET="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git fetch origin "$TARGET"
          ROOT="$AGENT_TEMPDIRECTORY/target"
          git worktree add --detach "$ROOT" "origin/$TARGET"
          test -f "$ROOT/.agents/binding.yml"
          echo "##vso[task.setvariable variable=AGENTIC_ROOT]$ROOT"
        displayName: Target branch binding
      # Installed from the target worktree, not the PR tree (its .npmrc is untrusted): the pinned devDependency, else AGENTIC_SDLC_VERSION.
      - script: |
          cd "$AGENTIC_ROOT"
          if grep -q '"node_modules/agentic-sdlc"' package-lock.json 2>/dev/null; then
            npm ci --ignore-scripts && echo "##vso[task.prependpath]$AGENTIC_ROOT/node_modules/.bin"
          else
            npm i -g "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.0}"   # set: AGENTIC_SDLC_VERSION to an exact version
          fi
        displayName: Install agentic-sdlc
      - script: agentic-sdlc --root "$AGENTIC_ROOT" gate branch-names --ref "${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
        displayName: branch-names
      - script: agentic-sdlc --root "$AGENTIC_ROOT" gate linkage --cr "$SYSTEM_PULLREQUEST_PULLREQUESTID"
        displayName: ticket-linkage
        env:
          AGENTIC_FORGE_TOKEN: $(AGENTIC_FORGE_TOKEN)
          AGENTIC_BOARD_TOKEN: $(AGENTIC_BOARD_TOKEN)
      # Posts status human-approval on the head (the worktree shares this checkout's objects, so the head is readable).
      - script: agentic-sdlc --root "$AGENTIC_ROOT" gate approval --cr "$SYSTEM_PULLREQUEST_PULLREQUESTID"
        displayName: human-approval
        env:
          AGENTIC_FORGE_TOKEN: $(AGENTIC_FORGE_TOKEN)
          AGENTIC_REVIEW_TOKEN: $(AGENTIC_REVIEW_TOKEN)
      - script: agentic-sdlc --root "$AGENTIC_ROOT" gate board-sync --cr "$SYSTEM_PULLREQUEST_PULLREQUESTID" --event ready
        displayName: board-sync
        env:
          AGENTIC_FORGE_TOKEN: $(AGENTIC_FORGE_TOKEN)
          AGENTIC_BOARD_TOKEN: $(AGENTIC_BOARD_TOKEN)
      # Not PR events, so wire them yourself (each checkout fetchDepth: 0):
      #   merged: a Service hook ("Pull request merged") queuing `gate board-sync --sha <merge sha> --event merged`
      #   draft: the same hook on "Pull request updated" running `gate board-sync --cr <n> --event draft`
      #   release line push (release/*): `gate board-sync --event in-release --release <version>`
      #   each deploy pipeline: `gate shipped <env> --sha <sha> --result success|failure` from the deploy's real result
      - script: |
          if git diff --name-only "origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}...HEAD" | grep -q '^\.agents/'; then
            agentic-sdlc gate skill-regression
          fi
        displayName: skill-regression (.agents changes only)
