# Project binding: every project value the skills and the CLI read (references/architecture.md section 4).
# "unresolved: <hint>" marks a value init could not know; the setup skill or you replace it, and
# `agentic-sdlc validate --json` lists every one. Secrets never go here: name env vars.
version: 2
profile: individual # individual | organization
owners: # a login, { board, forge }, or a list (the first is the primary); optional: operator, security, compliance
  product: "unresolved: the product owner's forge login"
  factory: "unresolved: the factory owner's forge login"
  bots: ["unresolved: the forge login the factory runs as"]

board: # optional: later_milestone, page (the URL of the published board page), scope { label, home, repos }
  adapter: github-issues # github-issues | local
  options: {} # github-issues: { repo: owner/name, field_ids?: { status: <id>, ... } }; local: {}
  statuses: [Ideas, Signals, Backlog, Ready, In progress, In review, Done, Cancelled]
  fields: { size: Size, priority: Priority, lane: Lane, shipped: Shipped, release_version: Release Version }
  labels: { human: needs-human, bug: bug, feature: feature, release: release }
  env_labels: [env:staging, env:production]
  done_statuses: [Done, Cancelled]
  signal_streams: [alert, feedback, owner, security, ci, deploy, maintenance, factory] # label signal:<stream>

forge:
  adapter: github
  options: {} # github: { repo: owner/name, token_env?, review_token_env? }
  review_identity: "" # empty: one identity (yours); set: the separate review account
  human_approval: full-lane # full-lane | always | never
  approval_label: approved # the label the owner applies to approve a CR head
  provenance: off # off | warn | require
  review_check_name: review
  verify_check_name: Required
  required_checks: [ticket-linkage, Required, proofs-on-base, review, human-approval, skill-regression]
  planned_checks: []
  ci_workflow: "unresolved: the name of the CI workflow that runs on a trunk push (delete the key when none does)"
  deploy_workflows: ["unresolved: the deploy workflow names, first and last environment ([] when nothing deploys)"]

vcs:
  adapter: git
  trunk: "unresolved: the default branch"
  change_pattern: "feature/<ticket>-<name>"
  factory_change_pattern: "sdlc/<name>"
  release_prefix: release/
  tag_prefix: v
  version_scheme: calver # calver | semver

product: # optional: slo { change_failure_rate_max, window_days }
  environments: [staging, production] # ordered; the last is where users get value
  delivery: continuous # continuous | release-line
  evidence: [] # sbom | provenance | signature
  proofs: [test, eval, visual, data-check, computer-use, manual]

# executors.<skill>[/<step>]: { kind: harness | command, run?, mcps?, secrets?, sandbox?, model?, max_turns?, max_tokens?, max_minutes? }
executors: { default: { kind: harness } }
mcps: { browser: { command: "npx @playwright/mcp" } }
# optional: traces { uri }, agent_command (bench run)
models: { fast: sonnet, balanced: sonnet, deep: opus } # tier -> model, the one home: init writes .claude/agents/sdlc-<tier>.md from it

commands: # optional: setup, preview, rollback, evidence_check
  install: "unresolved: install dependencies in a fresh checkout"
  fast_check: "unresolved: the quick check build runs before the draft CR (typecheck or lint)"
  verify: "unresolved: the full test command the Required CI job runs"
  proofs_on_base: "unresolved: the test command for the proof files {files}"

paths: # init keeps only the file keys whose file exists
  guiding_narrative: docs/narrative.md
  roadmap_doc: docs/roadmap.md
  importance_doc: AGENTS.md
  glossary: GLOSSARY.md
  review_checklist: docs/review-checklist.md
  test_standard: docs/test-standard.md
  security_policy: SECURITY.md
  pr_template: .github/pull_request_template.md
  sources_before_question: [docs/narrative.md, GLOSSARY.md]
  factory: [".agents/**", ".github/**", ".claude/**"]
  lane_areas: [] # paths that force the Full lane
  no_proof: ["docs/**", "*.md"]

sizes: [XS, S, M, L, XL]
ready_size_limit: M
fast_lane_max_size: S
priorities: [P0, High, Default, Low]
p0_setters: [owner, plan/triage]
max_subissue_depth: 1
spec_marker: "spec.md"
stall_minutes: 60 # keep it above the longest step run
parallel_agents: 3
cycle: # optional: max_tokens_per_ticket
  { max_implementations: 1, min_ready: 2, time_budget_minutes: 45, failure_limit: 2, dedupe_minutes: 10, max_rework: 3, land_wait_minutes: 5 }
heartbeat:
  ticket: "unresolved: the heartbeat ticket id (agentic-sdlc board bootstrap creates it)"
learning: # optional: bench_budget { max_runs, max_minutes }; auto_merge_classes: [tuning] once a bench baseline exists
  { enabled: false, every_cycles: 20, min_evidence_runs: 5, bench_size: 20, bench_min_cases: 20, bench_trials: 3, auto_merge_classes: [], judge_tier: fast }
