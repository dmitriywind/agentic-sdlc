# Profile: individual or individual-api (subscription token) or organization (API key).
# Install at: .github/workflows/factory-cycle-claude.yml
# Secrets (set ONE auth secret; the API key outranks the token, so never set both — setup.sh refuses
# ANTHROPIC_API_KEY when the binding's profile is individual or individual-api):
#   individual, individual-api: CLAUDE_CODE_OAUTH_TOKEN  (create with `claude setup-token`)
#   organization: ANTHROPIC_API_KEY
# Also: AGENTIC_BOARD_TOKEN, AGENTIC_FORGE_TOKEN, and AGENTIC_REVIEW_TOKEN with two identities (the names your binding uses).
# One identity (forge.review_identity empty): the cycle runs review/review itself; delete the `review` job
# (`dead-man` needs only `cycle`, so the file stays valid; with two identities add `review` to its needs).
# Repo variable: AGENTIC_AGENT_CLI_VERSION (an exact Claude Code version); a job fails when it is unset.
# The agentic-sdlc CLI is the pin in .agents/cli.json, run through .agents/bin/agentic-sdlc (it installs itself on first use).
# The agent CLI installs in a step with no secrets in its env; each secret reaches only the steps that need it.
# GitHub disables scheduled workflows after 60 days without repo activity, so `dead-man` stops with the cycle.
# --allowedTools: set the npm entries to your binding's commands.fast_check and commands.verify.
# Three jobs: `cycle` implements and never sees AGENTIC_REVIEW_TOKEN;
# `review` starts when the cycle finishes, with the review token and the review prompt only;
# `dead-man` fails (and notifies) when no heartbeat landed for --max-hours.
# Setup script and prompts come from `agentic-sdlc init` (.agents/runner-setup.sh, .agents/cycle-prompt.md, .agents/review-prompt.md).
# The plugin loads from the pinned CLI package (--plugin-dir .agents/.cli/<ref>/node_modules/agentic-sdlc): skills, the
# forge-approve / trunk-push hook and the MCP server. runner-setup.sh installs it and puts .agents/bin on PATH.
name: factory-cycle-claude
on:
  schedule:
    - cron: "*/30 * * * *"  # set: your cadence
  workflow_dispatch:
concurrency: factory-cycle
permissions:
  contents: read   # pushes use AGENTIC_FORGE_TOKEN, not this token
env:
  AGENTIC_SDLC_UNATTENDED: "1"
  CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "1"
defaults:
  run:
    shell: bash   # self-hosted Windows runners default to PowerShell
jobs:
  cycle:
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that run CR or agent code
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the agent CLI (no secrets in this step)
        env:
          AGENTIC_AGENT_CLI_VERSION: ${{ vars.AGENTIC_AGENT_CLI_VERSION }}
        run: |
          case "$AGENTIC_AGENT_CLI_VERSION" in ""|-*) echo "::error::set the repo variable AGENTIC_AGENT_CLI_VERSION to an exact Claude Code version"; exit 1 ;; esac
          npm i -g "@anthropic-ai/claude-code@$AGENTIC_AGENT_CLI_VERSION"
      - name: Set up the runner   # also the ANTHROPIC_API_KEY guard for the individual profiles
        run: sh .agents/runner-setup.sh
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # organization; empty unless the secret exists
      - name: Run one cycle
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # individual
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # organization; empty unless the secret exists
        run: >-
          claude -p "$(sed '1,/^---$/d' .agents/cycle-prompt.md)"
          --plugin-dir ".agents/.cli/$(node -p "require('./.agents/cli.json').ref")/node_modules/agentic-sdlc"
          --output-format json --max-budget-usd 5 --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Bash(agentic-sdlc *)" "Bash(.agents/bin/agentic-sdlc *)" "Bash(git add *)" "Bash(git commit *)" "Bash(git push *)" "Bash(npm run *)" "Bash(npm test *)" "mcp__agentic-sdlc" "mcp__plugin_agentic-sdlc_agentic-sdlc"
          --disallowedTools "Bash(agentic-sdlc forge approve *)" "Bash(.agents/bin/agentic-sdlc forge approve *)"
  review:
    needs: cycle
    if: ${{ !cancelled() }}  # review even when the cycle failed
    environment: agentic-review   # AGENTIC_REVIEW_TOKEN lives only here (trunk-only deployment branches)
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_ROLE: review   # the plugin hook allows forge approve only here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the agent CLI (no secrets in this step)
        env:
          AGENTIC_AGENT_CLI_VERSION: ${{ vars.AGENTIC_AGENT_CLI_VERSION }}
        run: |
          case "$AGENTIC_AGENT_CLI_VERSION" in ""|-*) echo "::error::set the repo variable AGENTIC_AGENT_CLI_VERSION to an exact Claude Code version"; exit 1 ;; esac
          npm i -g "@anthropic-ai/claude-code@$AGENTIC_AGENT_CLI_VERSION"
      - name: Set up the runner
        run: sh .agents/runner-setup.sh
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # organization; empty unless the secret exists
      - name: Review open CRs
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # individual
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # organization; empty unless the secret exists
        run: >-
          claude -p "$(sed '1,/^---$/d' .agents/review-prompt.md)"
          --plugin-dir ".agents/.cli/$(node -p "require('./.agents/cli.json').ref")/node_modules/agentic-sdlc"
          --output-format json --max-budget-usd 5 --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Bash(agentic-sdlc *)" "Bash(.agents/bin/agentic-sdlc *)" "mcp__agentic-sdlc" "mcp__plugin_agentic-sdlc_agentic-sdlc"   # review: no git writes, no npm
  dead-man:
    needs: [cycle]   # two identities: add review, so the check waits for the review run
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Not runner-setup.sh: its doctor probes the forge too, which this job has no token for, so it would stay red.
      # Exit 1 when the newest heartbeat is older than this: a failed run, a stuck one, or a cycle that writes none.
      - name: Heartbeat is fresh
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
        run: .agents/bin/agentic-sdlc ledger stale --max-hours 3   # set: a few cadences
