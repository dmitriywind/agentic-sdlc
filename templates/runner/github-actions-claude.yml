# Profile: individual (subscription token) or enterprise (API key).
# Install at: .github/workflows/factory-cycle-claude.yml
# Secrets (set ONE auth secret; the API key outranks the token, so never set both — setup.sh refuses
# ANTHROPIC_API_KEY when the binding's profile is individual):
#   individual: CLAUDE_CODE_OAUTH_TOKEN  (create with `claude setup-token`)
#   enterprise: ANTHROPIC_API_KEY
# Also: AGENTIC_BOARD_TOKEN, AGENTIC_FORGE_TOKEN, AGENTIC_REVIEW_TOKEN (the names your binding uses).
# --allowedTools: set the npm entries to your binding's commands.fast_check and commands.verify.
# Three jobs (forge.review_runtime: separate): `cycle` implements and never sees AGENTIC_REVIEW_TOKEN;
# `review` starts when the cycle finishes, with the review token and the review prompt only;
# `dead-man` fails (and notifies) when no heartbeat landed for --max-hours.
# Setup script and prompts come from `agentic-sdlc init` (.agents/runner-setup.sh, .agents/cycle-prompt.md, .agents/review-prompt.md).
# The plugin loads from the pinned devDependency (--plugin-dir node_modules/agentic-sdlc): skills, the
# forge-approve / trunk-push hook and the MCP server.
name: factory-cycle-claude
on:
  schedule:
    - cron: "*/30 * * * *"  # set: your cadence
  workflow_dispatch:
concurrency: factory-cycle
permissions:
  contents: write
  pull-requests: write
  issues: write
env:
  AGENTIC_SDLC_UNATTENDED: "1"
  CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "1"
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # individual
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # enterprise; empty unless the secret exists
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
    steps:
      # pin to a commit SHA (actions/checkout, actions/setup-node)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # set: pin an exact Claude Code version
      - run: npm i -g @anthropic-ai/claude-code
      - run: sh .agents/runner-setup.sh   # also the ANTHROPIC_API_KEY guard for the individual profile
      - name: Run one cycle
        run: >-
          claude -p "$(sed '1,/^---$/d' .agents/cycle-prompt.md)"
          --plugin-dir node_modules/agentic-sdlc
          --output-format json --max-budget-usd 5 --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Bash(npx --no agentic-sdlc *)" "Bash(git add *)" "Bash(git commit *)" "Bash(git push *)" "Bash(npm run *)" "Bash(npm test *)" "mcp__agentic-sdlc" "mcp__plugin_agentic-sdlc_agentic-sdlc"
          --disallowedTools "Bash(npx --no agentic-sdlc forge approve *)"
  review:
    needs: cycle
    if: ${{ !cancelled() }}  # review even when the cycle failed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_ROLE: review   # the plugin hook allows forge approve only here
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
      AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: sh .agents/runner-setup.sh
      - name: Review open CRs
        run: >-
          claude -p "$(sed '1,/^---$/d' .agents/review-prompt.md)"
          --plugin-dir node_modules/agentic-sdlc
          --output-format json --max-budget-usd 5 --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Bash(npx --no agentic-sdlc *)" "Bash(git add *)" "Bash(git commit *)" "Bash(git push *)" "Bash(npm run *)" "Bash(npm test *)" "mcp__agentic-sdlc" "mcp__plugin_agentic-sdlc_agentic-sdlc"
  dead-man:
    needs: [cycle, review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm i -g --allow-git=root "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.1}"
      # Exit 1 when the newest heartbeat is older than this: a failed run, a stuck one, or a cycle that writes none.
      - run: npx --no agentic-sdlc ledger stale --max-hours 3   # set: a few cadences
