# Profile: enterprise (API key).
# Install at: .github/workflows/factory-cycle-codex.yml
# Secrets: CODEX_API_KEY (an OpenAI API key), AGENTIC_BOARD_TOKEN, AGENTIC_FORGE_TOKEN, AGENTIC_REVIEW_TOKEN.
# Two jobs (forge.review_runtime: separate): `cycle` implements and never sees AGENTIC_REVIEW_TOKEN;
# `review` starts when the cycle finishes, with the review token and the review prompt only; `dead-man` runs `ledger stale`.
# Note: a ChatGPT-login auth.json can also work in CI (seed it with `codex login`, keep it in a secret
# store, one runner at a time, tokens rotate), but the OpenAI docs call it an advanced path for trusted
# runners and say an API key is the right way to authenticate automation. This template uses the key.
name: factory-cycle-codex
on:
  schedule:
    - cron: "*/30 * * * *"  # set: your cadence
  workflow_dispatch:
concurrency: factory-cycle
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_UNATTENDED: "1"
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
    steps:
      # pin to a commit SHA (actions/checkout, actions/setup-node)
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # set: confirm the install method in the Codex docs
      - run: npm i -g @openai/codex
      - run: sh .agents/runner-setup.sh
      - name: Run one cycle
        # exec's default sandbox is read-only; workspace-write lets the cycle edit and push.
        run: codex exec --sandbox workspace-write "$(sed '1,/^---$/d' .agents/cycle-prompt.md)"
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
  review:
    needs: cycle
    if: ${{ !cancelled() }}  # review even when the cycle failed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_UNATTENDED: "1"
      AGENTIC_SDLC_ROLE: review
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
      AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
      AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @openai/codex
      - run: sh .agents/runner-setup.sh
      - name: Review open CRs
        run: codex exec --sandbox workspace-write "$(sed '1,/^---$/d' .agents/review-prompt.md)"
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
  dead-man:
    needs: [cycle, review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm i -g "github:dmitriywind/agentic-sdlc#v${AGENTIC_SDLC_VERSION:-2.0.0-alpha.0}"
      # Exit 1 when the newest heartbeat is older than this: a failed run, a stuck one, or a cycle that writes none.
      - run: npx --no agentic-sdlc ledger stale --max-hours 3   # set: a few cadences
