# Profile: organization or individual-api (API key). One identity (forge.review_identity empty): delete the `review` job.
# Repo variable: AGENTIC_AGENT_CLI_VERSION (an exact Codex CLI version); a job fails when it is unset.
# The agentic-sdlc CLI is the pin in .agents/cli.json, run through .agents/bin/agentic-sdlc (it installs itself on first use).
# The agent CLI installs in a step with no secrets in its env; each secret reaches only the steps that need it.
# GitHub disables scheduled workflows after 60 days without repo activity in a public repo only (docs.github.com, disabling and enabling workflows).
# The dead-man check is its own workflow, agentic-sdlc-dead-man.yml, installed by init.
# Install at: .github/workflows/factory-cycle-codex.yml
# Secrets: CODEX_API_KEY (an OpenAI API key), AGENTIC_BOARD_TOKEN, AGENTIC_FORGE_TOKEN, AGENTIC_REVIEW_TOKEN.
# Two jobs: `cycle` implements and never sees AGENTIC_REVIEW_TOKEN;
# `review` starts when the cycle finishes, with the review token and the review prompt only.
# Note: a ChatGPT-login auth.json can also work in CI (seed it with `codex login`, keep it in a secret
# store, one runner at a time, tokens rotate), but the OpenAI docs call it an advanced path for trusted
# runners and say an API key is the right way to authenticate automation. This template uses the key.
name: factory-cycle-codex
on:
  schedule:
    # Minutes: GitHub Free gives a private repo $12 of hosted compute a month (about 2,000 Linux minutes; Pro/Team $18,
    # about 3,000). A cycle of N minutes every 4 h is N x 180 minutes a month, and CR CI draws on the same pool.
    # A self-hosted runner (AGENTIC_RUNS_ON) uses none. Avoid minute :00: schedules are delayed or dropped at peak.
    - cron: "17 */4 * * *"  # set: your cadence
  workflow_dispatch:
# A group keeps one running and one pending run; a newer pending run replaces the older pending one, which is fine for a cycle.
concurrency: { group: factory-cycle, cancel-in-progress: false }
permissions:
  contents: read   # pushes use AGENTIC_FORGE_TOKEN, not this token
env:
defaults:
  run:
    shell: bash   # self-hosted Windows runners default to PowerShell
jobs:
  cycle:
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that run CR or agent code
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_UNATTENDED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the agent CLI (no secrets in this step)
        env:
          AGENTIC_AGENT_CLI_VERSION: ${{ vars.AGENTIC_AGENT_CLI_VERSION }}
        run: |
          case "$AGENTIC_AGENT_CLI_VERSION" in ""|-*) echo "::error::set the repo variable AGENTIC_AGENT_CLI_VERSION to an exact Codex CLI version"; exit 1 ;; esac
          npm i -g "@openai/codex@$AGENTIC_AGENT_CLI_VERSION"
      - name: Set up the runner
        run: sh .agents/runner-setup.sh
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
      - name: Run one cycle
        # exec's default sandbox is read-only; workspace-write lets the cycle edit and push.
        run: codex exec --sandbox workspace-write "$(sed '1,/^---$/d' .agents/cycle-prompt.md)"
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
  review:
    needs: cycle
    if: ${{ !cancelled() }}  # review even when the cycle failed
    environment: agentic-review   # AGENTIC_REVIEW_TOKEN lives only here (trunk-only deployment branches)
    runs-on: ${{ fromJSON(vars.AGENTIC_RUNS_ON_TRUSTED || vars.AGENTIC_RUNS_ON || '"ubuntu-latest"') }}   # jobs that hold secrets
    timeout-minutes: 60
    env:
      AGENTIC_SDLC_UNATTENDED: "1"
      AGENTIC_SDLC_ROLE: review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AGENTIC_FORGE_TOKEN }}   # a GITHUB_TOKEN push starts no workflow run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the agent CLI (no secrets in this step)
        env:
          AGENTIC_AGENT_CLI_VERSION: ${{ vars.AGENTIC_AGENT_CLI_VERSION }}
        run: |
          case "$AGENTIC_AGENT_CLI_VERSION" in ""|-*) echo "::error::set the repo variable AGENTIC_AGENT_CLI_VERSION to an exact Codex CLI version"; exit 1 ;; esac
          npm i -g "@openai/codex@$AGENTIC_AGENT_CLI_VERSION"
      - name: Set up the runner
        run: sh .agents/runner-setup.sh
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
      - name: Review open CRs
        run: codex exec --sandbox workspace-write "$(sed '1,/^---$/d' .agents/review-prompt.md)"
        env:
          AGENTIC_BOARD_TOKEN: ${{ secrets.AGENTIC_BOARD_TOKEN }}
          AGENTIC_FORGE_TOKEN: ${{ secrets.AGENTIC_FORGE_TOKEN }}
          AGENTIC_REVIEW_TOKEN: ${{ secrets.AGENTIC_REVIEW_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
